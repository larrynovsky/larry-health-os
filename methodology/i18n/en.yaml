cpic.implication.cyp2c19.intermediate_metabolizer: "⚡ Partially reduced CYP2C19. Clopidogrel: suboptimal platelet inhibition — consider ticagrelor. PPIs: the standard dose is usually OK."
cpic.implication.cyp2c19.ultrarapid_metabolizer: "⚡ Ultrarapid CYP2C19. PPIs may be less effective; antidepressants (SSRIs) — risk of subtherapeutic levels."
cpic.implication.cyp2c19.rapid_metabolizer: "ℹ️ Somewhat faster CYP2C19. Rarely clinically significant, but PPIs and SSRIs may require higher doses."
cpic.implication.cyp2d6.poor_metabolizer: "⚠️ Codeine/tramadol are contraindicated (no activation → lack of efficacy + toxicity risk). Tamoxifen: reduced efficacy. TCAs and antipsychotics — risk of accumulation."
cpic.implication.cyp2d6.ultrarapid_metabolizer: "⚠️ Codeine: risk of acute opioid toxicity due to excess morphine. SSRIs and TCAs — reduced concentrations, possible lack of efficacy."
cpic.implication.cyp2d6.intermediate_metabolizer: "⚡ Partially reduced CYP2D6. Use codeine/tramadol with caution; for tamoxifen, consider alternatives or endoxifen monitoring."
cpic.implication.slco1b1.poor_function: "⚠️ High risk of statin-induced myopathy (markedly reduced OATP1B1). Simvastatin ≥40 mg/day is contraindicated; rosuvastatin/pravastatin is preferred."
cpic.implication.slco1b1.decreased_function: "⚡ Moderate risk of statin myopathy. Simvastatin: no more than 20 mg/day; monitor CK when starting statins. Rosuvastatin is a safer alternative."
cpic.implication.dpyd.poor_metabolizer: "\U0001F6A8 Homozygous DPYD*2A — 5-FU/capecitabine are CONTRAINDICATED (life-threatening toxicity). Alternative chemotherapy regimens are required."
cpic.implication.dpyd.intermediate_metabolizer: "⚠️ Reduced metabolism of 5-FU/capecitabine. Reduce the starting dose by 25–50%; toxicity monitoring is required."
cpic.implication.tpmt.poor_metabolizer: "⚠️ Azathioprine/6-MP are contraindicated at standard doses → severe myelosuppression. If needed, reduce the dose by 90% + weekly CBC."
cpic.implication.tpmt.intermediate_metabolizer: "⚡ Moderately reduced TPMT. Azathioprine/6-MP: reduce the dose by 30–50%; regular CBC monitoring."
cpic.implication.ugt1a1.poor_metabolizer: "⚠️ Irinotecan: risk of severe neutropenia and diarrhoea (UGT1A1*28/*28). Reduce the starting dose; consider liposomal irinotecan."
cpic.implication.ugt1a1.intermediate_metabolizer: "⚡ Partially reduced UGT1A1. With irinotecan, monitor toxicity closely."
cpic.implication.hla_b.hla_b_57_01_carrier: "\U0001F6A8 HLA-B*57:01 carrier — ABACAVIR IS ABSOLUTELY CONTRAINDICATED (high risk of a life-threatening hypersensitivity reaction)."
cpic.phenotype.undetermined: "not determined"
cpic.advice.no_genotype: "Your genotype for this gene has not been determined. Check with a doctor before prescribing."
cpic.advice.no_recommendation: "There is no CPIC recommendation for this phenotype in the reference. Check with a doctor."
traits.notes.lactase_missing: "The genetic marker is absent from the genome (not covered by the chip)."
traits.notes.lactase_persistent: "Homozygous for the persistence allele (AA). Lactase activity is maintained in adulthood. Dairy products are well tolerated."
traits.notes.lactase_partial: "Heterozygous (AG). Most carriers of one A allele retain enough lactase activity to tolerate lactose without symptoms. Moderate sensitivity is possible at high doses."
traits.notes.lactase_nonpersistent: "Homozygous GG — the classic lactose intolerance genotype. Lactase activity declines after weaning. Typical symptoms: bloating, diarrhoea and cramps when drinking milk."
traits.notes.eye_missing: "The genetic marker is absent from the genome."
traits.notes.eye_light: "Homozygous GG. HERC2 rs12913832 GG is the strongest predictor of blue or grey eyes in European populations (AUC ~0.9 in multilocus models). The full colour is determined by additional loci (OCA2, TYRP1, SLC24A4)."
traits.notes.eye_mixed: "Heterozygous AG. One G allele: moderately reduced OCA2 pigmentation. The final colour cannot be predicted without accounting for the other pigmentation loci — it may be green, brown, hazel or light brown."
traits.notes.eye_dark: "Homozygous AA — high OCA2 activity and abundant melanin in the iris. Brown eyes are most likely. Other pigmentation loci rarely change the outcome with AA."
traits.notes.apoe_missing: "Genetic marker absent from the genome: {missing}."
traits.notes.apoe_e3_e3: "The most common variant (frequency ~60%). Baseline risk of Alzheimer’s disease. Neutral effect on LDL levels at this locus."
traits.notes.apoe_e2_e3: "The ε2 allele is associated with lower LDL levels and moderate protection against Alzheimer’s disease compared with ε3/ε3. The rare risk of dysbetalipoproteinaemia (type III) applies only to ε2/ε2, not here."
traits.notes.apoe_e2_e2: "Homozygous ε2/ε2 (rare genotype, ~1%). Risk of dysbetalipoproteinaemia (type III hyperlipoproteinaemia) in the presence of other metabolic factors. LDL levels are usually below average. Reduced risk of Alzheimer’s disease."
traits.notes.apoe_e3_e4: "One ε4 allele: moderately increased risk of Alzheimer’s disease (~3× vs ε3/ε3). Also associated with higher LDL levels. Carried by approximately 25% of people of European ancestry. Lifestyle (physical activity and metabolic health) substantially modifies the risk."
traits.notes.apoe_e4_e4: "Homozygous ε4/ε4 (rare genotype, ~2%). Markedly increased risk of Alzheimer’s disease (~12× vs ε3/ε3). Also strongly associated with high LDL. Genetic counselling is recommended."
traits.notes.apoe_phase_uncertain: "One ε2 marker and one ε4 marker. The most likely genotype is ε2/ε4, but phase is not determined from genetic marker data — alternatively ε2/ε3 + ε3/ε4 (without ε2/ε4). If clinically relevant, sequencing of the full APOE gene is recommended."
traits.notes.apoe_unusual: "Unusual allele combination — validation is required."
wellness.notes.mthfr_missing: "Both genetic markers (C677T, A1298C) are absent from the genome."
wellness.notes.mthfr_normal: "Both MTHFR loci are wildtype. Enzyme activity is normal (~100%). Folate methylation is unaffected. Homocysteine levels are expected to be normal."
wellness.notes.mthfr_677_het: "Heterozygous C677T (rs1801133 GA). MTHFR activity is moderately reduced (~65%). Thermolabile enzyme. Low folate intake may cause a subclinical increase in homocysteine. Maintaining normal dietary folate intake (green leafy vegetables, legumes) or taking supplemental L-methylfolate is recommended."
wellness.notes.mthfr_1298_het: "Heterozygous A1298C (rs1801131 TG). MTHFR activity is slightly reduced. Less clinically significant than C677T. Usually without consequences with a normal diet. Monitor homocysteine when prescribing neurotoxic drugs."
wellness.notes.mthfr_677_hom: "Homozygous C677T (rs1801133 AA). MTHFR activity is markedly reduced (~30%). Increased risk of hyperhomocysteinaemia, especially with folate, B12 or B6 deficiency. Important: active folate (L-methylfolate, 5-MTHF) is absorbed better than synthetic folic acid. Regular homocysteine monitoring is recommended."
wellness.notes.mthfr_compound: "Compound heterozygous: one copy of 677T and one copy of 1298C. MTHFR activity is moderately reduced (~50%). The effect is comparable in clinical significance to homozygous C677T. Hyperhomocysteinaemia is a real risk with B vitamin deficiency. Recommended: L-methylfolate, B12 (methylcobalamin), B6 (P-5-P)."
wellness.notes.mthfr_1298_hom: "Homozygous A1298C. MTHFR activity is moderately reduced (~60%). Less clinically significant than variants with 677T. Monitor homocysteine, B12 and folate levels."
wellness.notes.mthfr_severe: "Rare combination: homozygous 677T + heterozygous 1298C. MTHFR activity is very low (<10%). High risk of hyperhomocysteinaemia. Consultation with a nutritionist/geneticist is recommended. L-methylfolate + methylcobalamin are required."
wellness.notes.mthfr_rare: "Rare combination of MTHFR alleles. Clinical assessment is required."
wellness.notes.comt_missing: "Genetic marker rs4680 is absent from the genome."
wellness.notes.comt_low: "Homozygous Met/Met (AA). Slow dopamine breakdown. Potentially better working memory and concentration in calm conditions. Increased sensitivity to stress and pain. Caffeine and stimulants may increase anxiety. COMT is one of many factors in dopaminergic regulation."
wellness.notes.comt_intermediate: "Heterozygous Val/Met (GA). Intermediate COMT activity. Balanced profile: moderate dopamine clearance and moderate stress resilience. The most common genotype."
wellness.notes.comt_high: "Homozygous Val/Val (GG). Fast dopamine breakdown. High stress resilience (“warrior” rather than “explorer” in Goldman’s metaphor). Working memory is better preserved under stress; dopamine tone is lower in calm conditions."
wellness.notes.fto_missing: "Genetic marker rs9939609 is absent from the genome."
wellness.notes.fto_elevated: "Homozygous AA: the largest contribution of the FTO locus to obesity risk (~1.6× vs TT). Effect: +0.8 kg/m² BMI on average. Mechanism: impaired thermogenesis in brown adipose tissue. Responds well to physical activity: regular aerobic exercise partly offsets the FTO effect."
wellness.notes.fto_modest: "Heterozygous AT: moderate FTO contribution (~1.3× vs TT). Effect: +0.4 kg/m² BMI on average. Physical activity substantially offsets the genetic predisposition. One of the weakest predictors studied — lifestyle matters more than genetics."
wellness.notes.fto_neutral: "TT genotype — neutral. Obesity with this genotype is determined by other factors (behaviour, other loci, microbiome)."
wellness.notes.hfe_missing: "Genetic marker rs1799945 is absent from the genome."
wellness.notes.hfe_homozygous: "Homozygous H63D/H63D. Iron overload risk is higher than in heterozygotes, but still substantially lower than with C282Y mutations (classic HFE). Monitor ferritin and transferrin saturation when clinically indicated. Avoid long-term use of iron-containing preparations without an indication."
wellness.notes.hfe_heterozygous: "Heterozygous H63D carrier (the most common HFE variant, ~20% carriers). Slightly increased iron absorption. Clinical haemochromatosis is rare in heterozygotes. If ferritin is elevated, check transferrin saturation. A background risk that does not require specific monitoring with a normal CBC."
wellness.notes.hfe_absent: "HFE H63D is absent. The risk of genetic haemochromatosis at this locus is not increased."

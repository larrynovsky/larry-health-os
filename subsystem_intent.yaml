- id: agent_coordination
  title: "Несколько сессий в одном репозитории: своё дерево, дошедшая записка, переживающий замок"
  intent: >
    Репозиторий перестал быть однопользовательским, и это замерено, а не предположено:
    за двое суток 12-13.09 в health_scripts работали СЕМЬ разных сессий агента, каждая
    в своей задаче Cowork. Инструментального канала между ними нет — `ListAgents` пуст,
    проверено обеими сторонами независимо; общий репозиторий остался единственным
    каналом связи. Три вида ущерба от этого уже случились, и подсистема существует
    ровно против них, а не против воображаемых. ПЕРВЫЙ — захват чужого файла в коммит:
    четыре случая за 12.09, включая `c08d216`, где staged-файлы одной сессии уехали
    внутри коммита другой. Причина не в неаккуратности: индекс git один на рабочее
    дерево, а `git add` не знает, кто его звал. Лечение — одна нить = одно дерево
    (`thread_start.sh` заводит worktree и ветку `thread/<slug>`), тогда индексы
    физически разные. ВТОРОЙ — записка, оставленная одной сессией для другой,
    доставлялась ВНИМАНИЕМ читателя: `docs/handoff/` не назван в read-first ни в §B
    этого свода, ни в ХУК #1 соседнего проекта (грепом ноль). Цена промаха измерена 13.09: две
    сессии написали ОДИН модуль на 167 строк под одни шесть строк БД, потому что
    каждая не знала о второй. Лечение — печать свежих `LATEST.md` из `pre-commit`,
    места, которое прошёл КАЖДЫЙ коммит (84 за неделю, шесть сессий, все до одной).
    ТРЕТИЙ — окружение одной сессии протекает в общее состояние: личность песочницы
    `t <t@t>` попала в настоящий `.git/config`, и 61 коммит с 12.09 14:07 приехал за
    её подписью; механизм починили в тот же день, а остаток не убрали, и никто этого
    не заметил. Общий принцип тот же, что у single_primary соседнего проекта:
    дисциплину следующая сессия не наследует, замок — наследует. Отсюда и
    `studio-post-receive`: хуки переустанавливаются из репозитория при КАЖДОМ приёме
    push, а не выставляются руками однажды. Что здесь честно не построено — принуждение
    самого правила «нить в своём дереве»: см. инвариант gate_for_thread_rule_is_open.
  explanation: docs/explanation/agent_coordination.md
  code_anchors:
    - scripts/thread_start.sh
    - scripts/thread_finish.sh
    - scripts/git-hooks/handoff_notes_notice.sh
    - scripts/git-hooks/studio-post-receive
    - scripts/install_hooks.sh
  invariants:
    - id: thread_gets_its_own_index
      claim: "Нить живёт в ОТДЕЛЬНОМ рабочем дереве на ветке thread/<slug>, а не в главной копии. Смысл не в чистоте истории, а в том, что индекс git — разделяемый ресурс без замка: две сессии в одном дереве неизбежно кладут файлы друг друга в свои коммиты, что и случилось четырежды за 12.09."
      status: holds
      check:
        file: scripts/thread_start.sh
        present: ["worktree add", "thread/$SLUG"]
    - id: close_reads_the_tree_it_was_launched_from
      claim: "Главная копия при закрытии нити — ТА, ОТКУДА ЗАПУЩЕНО (`git rev-parse --show-toplevel`), а не «родитель каталога .git». Прежняя формула молча врала на репозитории с вынесенным git-каталогом: `.git` там ФАЙЛ-указатель, родитель даёт ~/.gitdirs, и закрытие падало с враньём о причине («нет ветки») при живой ветке. Семь оракулов этого не видели — в песочнице .git лежит внутри дерева."
      status: holds
      check:
        file: scripts/thread_finish.sh
        present: ["--show-toplevel", "MAIN_TREE=\"$REPO_ROOT\""]
    - id: foreign_dirt_blocks_close_own_artifacts_do_not
      claim: "Закрытие нити отказывает, если в главной копии есть ЧУЖОЕ незакоммиченное, и НЕ отказывает из-за собственных авто-артефактов и из-за untracked-файлов, которых слияние не тронет. Список машинных артефактов берётся из ЕДИНСТВЕННОГО дома `git_facts.MACHINE_REGENERATED_FILES` (fail-closed: нет списка — нет закрытия): до 14.09 здесь лежала вторая копия строкой, в ней был выдуманный путь, а `git add` с одним непопавшим pathspec не стейджит НИЧЕГО — ветка была no-op, и правка 13.09 в бою не работала ни разу. Грязь судится из ОДНОГО вызова `git status -z`, а имена читаются по NUL: построчный разбор отдавал имя в кавычках, а кириллицу ещё и в октальных escape (замерено 15.09), поэтому артефакт с пробелом в имени уехал бы в «чужую работу» и закрытие отказало бы на собственном файле."
      limits:
        - "Случай «обе стороны переписали один авто-артефакт» — настоящий content-конфликт, закрытие на нём отказывает; отдельный долг BL-THREAD-ARTIFACT-MERGE-1."
        - "Переименование (R old -> new) приходит двумя записями и попадает в «чужое» целиком — перестраховка в сторону отказа, не наоборот."
      status: holds
      check:
        file: scripts/thread_finish.sh
        present: ["AUTO_ARTIFACTS", "FOREIGN", "--untracked-files=no"]
    - id: note_delivery_is_a_mechanism_not_attention
      claim: "Записка соседней нити называется МЕХАНИЗМОМ: post-commit печатает НОВОЕ с прошлого коммита читателя, опрашивая ВСЕ реплики (ветки всех рабочих деревьев), а не только свою. До 14.09 читалась одна реплика при записи в свою — кворум без перекрытия (NR+Nw > N не выполнялось при трёх деревьях), и записка соседа с ЕГО ветки не доходила ни до кого: чем строже соблюдали §21, тем меньше работала доставка. Печатается дельта, а не состояние: замер 13-14.09 дал 51 и 43 печати в сутки при 12 и 12 изменениях — три четверти без новостей. ПЕЧАТЬ И ОТМЕТКА — ОДНО ДЕЙСТВИЕ В ОДНОМ ХУКЕ, и это исправление 15.09: с 13.09 они стояли в pre-commit, то есть на ПОПЫТКЕ коммита, и отменённый коммит (пустое сообщение в редакторе) гасил записку соседа НАВСЕГДА. Первая починка развела их по двум хукам через файл `.pending` — и оракул на `--no-verify` показал, что этот хук пропускает pre-commit, но НЕ post-commit, поэтому `.pending` отменённой попытки засчитывался коммитом, который записку не печатал. post-commit — единственное событие git, означающее «коммит СОСТОЯЛСЯ»: замерено на git 2.54, срабатывает и на `--no-verify`, и на `--amend`. WARN, не блок (§13). Тело живёт в ОДНОМ файле, который зовут хуки обоих репозиториев."
      limits:
        - "Доказывается ПЕЧАТЬ, не чтение: что напечатанное прочитали, машине недоступно."
        - "Отметка «прочитано» лежит в служебном каталоге ДЕРЕВА, а у главной копии он общий — две сессии, работающие обе в main, гасят отметку друг другу. Лечения без идентичности сессии нет."
        - "Показываются все свежие нити, включая собственную: отличить чужую записку от своей нечем — подписи сессии в коммите может не быть (merge-коммиты и --no-verify её не несут, замерено)."
        - "Записка приходит ПОСЛЕ коммита, а не перед ним: среагировать до фиксации нельзя. Для WARN это тот же момент по смыслу, но это цена, а не бесплатность."
        - "merge, rebase и cherry-pick post-commit не зовут — на них записка не показывается и, ровно поэтому, не засчитывается: доживает до следующего обычного коммита."
        - "Атомарность отметки доказана СПОСОБОМ записи (подмена файла через mv, оракул различает её по правам), а не устойчивостью к настоящему обрыву питания — такого оракула нет и не будет."
        - "Уборка частичного временного файла после неудачной записи (`rm -f ${_SEEN}.tmp$$`) ОРАКУЛА НЕ ИМЕЕТ: чтобы её вызвать, нужен обрыв посреди printf при записываемом каталоге, а такое состояние в тесте не построить. Свёртка 15.09 это подтвердила — мутация «убрать уборку» пережила. Строка оставлена как дешёвая, но сделанной не называется."
      status: holds
      check:
        file: scripts/git-hooks/handoff_notes_notice.sh
        present: ["core.quotepath=false", "docs/handoff/*/LATEST.md", "48 hours ago"]
    - id: locks_reinstall_on_every_receive
      claim: "Хуки переустанавливаются из репозитория при КАЖДОМ приёме push, а не выставляются руками однажды: иначе порядок, наведённый одной сессией, не доживает до следующей. Обёртка приёма чистит GIT_* из окружения — git зовёт хуки приёма с GIT_DIR и соседями, и установщик спрашивал бы каталог хуков не того репозитория."
      status: holds
      check:
        file: scripts/git-hooks/studio-post-receive
        present: ["install_hooks.sh", "unset GIT_DIR"]
    - id: sandbox_identity_cannot_hide
      claim: "Личность песочницы (`t <t@t>` и соседи) не может молча ПОДПИСАТЬ коммит. Судится `git var GIT_AUTHOR_IDENT` — то, чем реально подпишется следующий коммит, — а не содержимое одного файла конфига: до 14.09 датчик спрашивал только `config --local` и был ЗЕЛЁНЫМ при отравлении глобального, хотя подпись при этом песочная (воспроизведено внешним ревью). Вопрос ПОСТРАДАВШЕГО («чем подписано») заодно покрывает env GIT_AUTHOR_*, includeIf и worktree-конфиг. Класс не гипотетический: 61 коммит с 12.09 14:07 приехал за подписью песочницы."
      limits:
        - "Это ДАТЧИК, а не замок: он краснеет на следующем прогоне, а не мешает записи произойти. Между отравлением и прогоном коммиты уезжают за чужой подписью."
        - "Отбор прогона на коммите — по затронутым файлам, поэтому ширина окна зависит от того, тронул ли коммит область датчика; гарантированный прогон — ночной на Studio, а он судит конфиг Studio, тогда как пишет код MacBook."
      status: holds
      check:
        file: tests/unit/test_repo_identity_not_poisoned.py
        present: ["песочные"]
    - id: gate_for_thread_rule_is_open
      claim: "У правила «работа длиннее одного коммита — в своём дереве» НЕТ принуждения, и это выбрано замером, а не ленью: блокирующий гейт «в main только через слияние нити» сработал бы на 60 из 60 коммитов за неделю. Это не гейт, а смена уклада, цена которого не измерена. Долг BL-THREAD-GATE-1 ищет узкий признак, отвечающий на вопрос ПОСТРАДАВШЕГО («в коммит попал файл, которого эта сессия не трогала»), а не строителя."
      status: open
      closes_when: "найден узкий гейт, который на НЕДЕЛЕ реальной истории краснеет на захвате чужого файла и молчит на обычных коммитах"
      closes_when_by: claude
      limits:
        - "Сигнал возврата сформулирован как «следующий зафиксированный случай захвата», и он сам НЕ машинно-обнаружим: в коммите нет носителя понятия «эта сессия», а четыре случая 12.09 нашлись руками после ущерба."
        - "Построенный 14.09 признак (git_facts.captured_files) долг НЕ закрывает и в pre-commit НЕ включён — решение по замеру 15.09 на живой ленте: цена 61 мс медиана (не препятствие), но 10 из 20 коммитов не судятся вовсе, а единственное срабатывание из 20 оказалось ложным (b306c0c: своя же записка, написанная до снимка и закоммиченная после). Блокирующий гейт на таком признаке — §14."
        - "Окно признака — refs/backups/wip^..HEAD — покрывает 12 из 75 суточных коммитов (16 %): снимок делает бэкап по расписанию, цепочки у него нет. Расширение окна — долг BL-CAPTURE-WINDOW-1 (выделен 16.09 из BL-WIP-WORKTREES-1: тот был про защиту работы и закрыт, окно детектора — другой предмет)."
    - id: note_lives_in_the_addressees_inbox
      claim: "Записка соседа лежит в docs/handoff/<нить>/inbox/<отправитель>.md, у LATEST.md остаётся ОДИН писатель — автор нити, и доставка читает ОБА адреса. До 16.09 писателей у LATEST было два, и это давало write-write конфликт ровно на закрытии нити: за 30 дней 21 закрытие, 5 с настоящим конфликтом, и в ДВУХ конфликтовал чужой LATEST (a40ebde: error-channel против agent-coordination; a5efde1: night-cycle против brief+handoff) — 30 и 45 строк ручного разбора. Экспозиция: 74 правки LATEST за месяц, 15 чужой рукой. Конфликт снят единственным владельцем файла, а не разрешателем: кандидат merge-драйвер `union` отвергнут замером — целей у него 0 из 21, а на docs/handoff/INDEX.md он даёт ДУБЛЬ строки нити, потому что правка указателя не коммутативна."
      status: holds
      verified_at: "2026-09-16"
      verified_on: "macbook"
      probe: "plans/probe_thread_merge_conflicts_2026-09-16.py"
      check:
        file: scripts/git-hooks/handoff_notes_notice.sh
        present: ["docs/handoff/*/inbox/*"]
      limits:
        - "check грепает ПУТЬ в доставке, то есть присутствие носителя, а не поведение. Поведение стережёт tests/unit/test_handoff_note_delivery.py, и у него ТРИ исполненные мутации 16.09: «убрать inbox из pathspec» и «сузить grep обратно до LATEST.md$» роняют ровно три новых теста при 16 зелёных старых, «убрать отправителя из печати» роняет два."
        - "ПРИНУЖДЕНИЯ НЕТ: ничто не мешает сессии по привычке написать в тело чужого LATEST. Норма §22 называет адрес, механизма-запрета не построено, и это тот же класс, что gate_for_thread_rule_is_open."
        - "Проба видит только СОСТОЯВШИЕСЯ слияния: закрытие, упёршееся в конфликт и отменённое (git merge --abort), следа в истории не оставляет. Значит её число — нижняя оценка."
        - "На 16.09 проба печатает 4 конфликта на файлах канала — это история ДО переезда. Ноль ожидается, когда окно съедет; до тех пор утверждение о ПОЛЬЗЕ переезда не подтверждено данными, подтверждён только механизм."
        - "Из двух писателей убран один, а не оба класса конфликта: docs/handoff/INDEX.md по-прежнему конфликтует (2 случая за месяц, 4 и 6 строк). Оставлено жить решением владельца 16.09 — лечение завело бы генератор с потребителем в ночном цикле."
    - id: merged_thread_leaves_changelog_row
      claim: "Каждая слитая нить с работой кода оставляет строку журнала `[нить <slug>]`: её пишет закрытие нити (`thread_finish` → `doc_agent --thread-merge`) из заголовков коммитов нити, без модели, отдельным коммитом с обычными гейтами. Повод — 23.09: с 11–12.09 хук после коммита на ветке нити выходил до doc_agent, а слияние хук не зовёт, и журнал молчал 11 дней (50 нитей восстановлены актом plans/backfill_changelog_2026-09-23.py). Сторож — `check_changelog_freshness`: слитая нить с кодом без строки."
      status: holds
      check:
        file: scripts/thread_finish.sh
        present: ["doc_agent.py --thread-merge", "docs(changelog): нить"]
      limits:
        - "Строка пересказывает заголовки коммитов, а не код: неточный заголовок даёт неточную строку."
        - "Нить, слитая дважды под одним именем, считается покрытой первой строкой."
        - "Отказ записи строки закрытие не останавливает — ловит сторож наутро."
  last_reconciled: "2026-09-16"

- id: code_backup
  title: "Код и работа нитей переживают отказ одного диска"
  intent: >
    У бэкапа в этом проекте два разных предмета, и до 16.09 запись замысла была
    только у одного из них — да и та жила строкой в чужой записи. ПЕРВЫЙ предмет:
    база бэкапится там, где она канонична (Studio), а не там, где удобно, — правило
    родилось после BUG-BACKUP-DEAD, когда backup.sh смотрел в iCloud-путь и падал на
    authorization denied 35 ночей из 36 (TCC macOS), то есть «бэкап был» ровно в том
    смысле, в каком его не было. ВТОРОЙ предмет: код. Снимок дерева MacBook уезжает в
    refs/backups/* на Studio ВНЕ main — решение владельца 24.07 после того, как прежняя
    форма (git commit --no-verify в main + push) ночами деплоила непроверенный WIP мимо
    всех гейтов. Оба предмета соединяет одно свойство: копия на второй машине, а не
    вторая копия на том же диске. Третий случай нашёлся замером 16.09 и оказался дырой:
    post-commit пушит ТОЛЬКО main («не main → выход ДО push»), а снимок брался с главной
    копии — значит закоммиченная работа нити от первого коммита до слияния существовала
    в одном экземпляре. В момент замера так лежали 992 строки двух нитей (22 ч и 62 ч),
    и git cat-file -e на Studio отвечал «нет» для обоих tip'ов. Риск рос ровно от
    соблюдения §21: чем строже нити живут в своих деревьях, тем больше работы вне
    единственного канала. Лечение — нативной возможностью git: ветки нитей едут копией
    в инертный namespace refs/backups/thread/*, где updateInstead не трогает дерево
    Studio. Что этой подсистемой НЕ обещано: оффсайт. Его нет ни у базы, ни у кода —
    решение владельца 13.08, риск принят явно (BACKUP_POLICY.md §R2.5).
  explanation: docs/explanation/code_backup.md
  code_anchors:
    - backup.sh
    - scripts/git-hooks/post-commit-macbook
    - integrity_tests.py::check_thread_work_has_a_second_copy
    - integrity_tests.py::check_backup_freshness
  invariants:
    - id: db_backed_up_where_canonical
      claim: "База бэкапится на машине, где она канонична (Studio, backup_studio.sh), и свежесть КАЖДОГО тенанта судится SLA-датчиком. Прежняя форма — бэкап с MacBook по iCloud-пути — падала на TCC 35 ночей из 36 и бэкапила не ту БД после перехода single-primary → Studio; оба дефекта лечатся одним: база бэкапится там, где она канонична."
      status: holds
      check:
        file: integrity_tests.py
        present: ["check_backup_freshness", "BACKUP_LABEL"]
      limits:
        - "Датчик судит СВЕЖЕСТЬ файла бэкапа, а не восстановимость из него: `PRAGMA integrity_check` перед использованием — ручной шаг R3 политики, машиной он не исполняется."
        - "Оффсайта нет — решение владельца 13.08, риск принят явно. Канон и все суточные копии лежат на одном диске одной машины."
    - id: code_snapshot_never_enters_main
      claim: "Снимок кода не коммитит в main и не пушит main: дерево уезжает как commit-tree в refs/backups/* и деплоя не вызывает. До 24.07 форма была другой — `git commit --no-verify` в main + push, — и ночью деплоился непроверенный WIP, обходя ВСЕ гейты (dupgate, L2, доки, ponytail), а история зарастала авто-коммитами."
      status: holds
      check:
        file: backup.sh
        present: ["commit-tree", "refs/backups/"]
      limits:
        - "`check` судит присутствие формы, а не поведение. Поведение стережёт tests/unit/test_backup_wip_snapshot.py::test_снимок_не_коммитит_в_main_и_не_пушит_main — он исполняет НАСТОЯЩИЙ backup.sh против настоящего голого репозитория и требует, чтобы main не сдвинулся и не уехал."
    - id: thread_work_lives_on_two_disks
      claim: "Закоммиченная работа нити существует минимум на двух дисках: ветки thread/* едут копией в refs/backups/thread/* на Studio (backup.sh --wip, раз в 3 ч), а датчик check_thread_work_has_a_second_copy судит НАЛИЧИЕ объекта у себя, а не рапорт отправителя об успешном push. Копия удаляется только ДОКАЗАННО доехавшая (решение владельца 16.09): tip — предок main, либо коммиты копии уже в main по содержанию (`git cherry`). `git push --prune` удалял бы копию ветки, удалённой локально, — а ветка исчезает и при слиянии, и при потере дерева. С 21.09 есть третий исход: закрытие нити переставляет ветку, и если при этом содержание переписано (разбор конфликта), доказать «доехало» нечем — копия НЕ удаляется, а переносится в refs/backups/thread-closed/ (локальной ветки нет И в main есть слияние этой нити). Данные остаются, список риска не засоряется."
      status: holds
      verified_at: "2026-09-16"
      verified_on: "macbook"
      check:
        file: backup.sh
        present: ["refs/backups/thread/*", "is-ancestor"]
      limits:
        - "Отсрочка датчика 6 ч (два периода снимка): нить живёт медиану 12 минут (замер 16.09, 18 слияний), порог меньше периода звенел бы на каждой здоровой нити — §13."
        - "Окно потери не ноль, а период снимка: работа, закоммиченная в нити и потерянная в ближайшие 3 часа, копии ещё не имеет."
        - "Копия — вторая МАШИНА, но тот же дом: оффсайта нет (R2.5), пожар уносит обе."
        - "refs/backups/thread-closed/ не чистится ничем: удалять недоказанное владелец не разрешал. Растёт по одной записи на каждую нить, закрытую с правкой содержания при перестановке (первая — close-rebase-once, 21.09)."
        - "Незакоммиченное в дереве нити по-прежнему не копируется НИКУДА. Это измерено, а не забыто: p90 интервала между коммитами внутри нити — 11 минут, в момент замера незакоммиченного было 0 строк. Снимок несёт worktrees_uncovered=N — честное «про эти деревья не знаю»."
  last_reconciled: "2026-09-16"

- id: night_test_triage
  title: "Ночной разбор красного: severity по замыслу теста, а не по громкости падения"
  intent: >
    Ночной набор падает не одинаково, и правило «упал тест → CRITICAL» даёт шум, в
    котором тонет настоящая регрессия: часть тестов стоит на UC со статусом `intended`
    — код туда ещё не дошёл, их красный не новость, а известный разрыв. Поэтому разбор
    идёт по ЗАМЫСЛУ проверяемого: красный против `implemented` UC — регрессия, звонок и
    напоминание владельцу; против `partial`/`intended` — запись в gap-отчёт; против
    теста, которого нет в указателе UC вовсе, — CRITICAL, потому что неизвестное обязано
    звенеть, а не молчать. Поверх два слоя: детерминированные ретраи по паттернам логов
    и один Haiku-диагноз на каждый оставшийся CRITICAL, без права трогать код.
    Тихих отказов здесь три, и все снаружи выглядят как зелёный: падение, помеченное
    `flaky_today` по совпадению паттерна; диагноз, переиспользованный от другой версии
    кода; ночь, которая не состоялась вовсе. Второй закрыт ключом кэша; первый — с
    23.09 отдельным повтором теста (граница — повтор один); третий — с 23.09 датчиком
    `check_nightly_suite_liveness`: итог ночи обязан покрывать последний плановый запуск.
  explanation: docs/explanation/night_test_triage.md
  code_anchors:
    - test_failure_handler.py::handle_test_failures
    - test_failure_handler.py::_is_critical
    - test_failure_handler.py::_uc_status_for_test
    - test_failure_handler.py::_diagnose_failure
    - morning_test_summary.py::build_summary
    - run_full_test_suite.sh
  invariants:
    - id: severity_from_uc_status
      claim: "Severity падения берётся из статуса UC, который тест проверяет, а не из самого факта падения: `implemented` → CRITICAL, `partial`/`intended` → expected_gap в gap-отчёт. Иначе каждая ночь CRITICAL, и владелец учится не смотреть — тот же banner-blindness, от которого §13 защищает эскалацию."
      status: holds
      check:
        file: test_failure_handler.py
        present: ["_uc_status_for_test", "expected_gap", "_is_critical"]
    - id: unknown_test_is_critical
      claim: "Тест, которого нет в указателе UC, считается CRITICAL, а не тихо пропускается. Умолчание выбрано в сторону громкости сознательно: неизвестный предмет — это дыра в указателе, и молчание о ней неотличимо от «всё хорошо»."
      status: holds
      check:
        file: test_failure_handler.py
        present: ["unknown → CRITICAL", "return True"]
    - id: diagnosis_cache_keyed_by_commit
      claim: "Диагноз кэшируется по паре (тест, коммит), а не по одному тесту: иначе объяснение, написанное про другую версию кода, вернулось бы как свежее и увело бы разбор в сторону. Ключ содержит HEAD, и смена кода промахивается мимо кэша по построению."
      status: holds
      check:
        file: test_failure_handler.py
        present: ["_git_head", "cache_key", "_{commit}.md"]
    - id: repair_level_lives_in_the_svod
      claim: "Вердикт об авто-применении красного этот модуль НЕ выносит — он на него ссылается (CLAUDE.md §13). Пересказ уже стоил 42 дней расхождения: поправка владельца 2026-08-03 сузила запрет, а docstring модуля продолжал отсылать к TEST_ARCHITECTURE §12.3 с отменённым «не реализуем»."
      status: holds
      check:
        file: test_failure_handler.py
        present: ["CLAUDE.md §13", "не реализован"]
    - id: layer_perimeter_is_the_directory
      claim: "Периметр слоя ночного прогона задаёт КАТАЛОГ, а не метка в файле. До 15.09 отбор шёл как `-m <слой>`, и файл без метки выпадал молча: замер — unit брал 2363 теста из 4267, integration 335 из 451, consistency 524 из 559, а все 2050 отсеянных оказались ЗЕЛЁНЫМИ, то есть отсеивались не больные, а невидимые. Два дома у ответа «какого слоя этот тест» расходились без единого признака снаружи, потому что расхождение выглядело как зелёный прогон."
      status: holds
      limits:
        - "Сторож держит ОДИН класс сужения — возврат фильтра по имени слоя при неполных метках. Другие способы тихо сузить прогон (norecursedirs, addopts, -k, skip внутри теста, каталог, который перестали звать из скрипта) он не видит; квитанционный датчик «junit ночи против числа собранного» шире и не построен."
        - "Цена принята зряче: unit-слой идёт ~200с вместо ~116с, и удлинение обострило гонку за блокировку БД в `test_quarantine_persistence` — один красный на два объединённых прогона. В одиночку тест зелен всегда; у класса есть штатный ответ (уровень A ловит `database is locked` и повторяет)."
      check:
        file: run_full_test_suite.sh
        present: ["Периметр слоя задаёт КАТАЛОГ", "mfilter"]
        absent: ["-m \"$layer\""]
    - id: flaky_pattern_can_swallow_a_real_failure
      claim: "Паттерны уровня A (`database_locked`, `anthropic_timeout`, `icloud_evicted`, `network_error`) больше не выносят вердикт сами: с 2026-09-23 совпавшее падение повторяется ОДНО, отдельным pytest по node id (`_rerun_isolated`). Прошёл повтор — случайность; упал или не состоялся — падение идёт в обычный разбор с пометкой. До этого `retry` ничего не повторял (стояла заглушка), а настоящая регрессия с текстом паттерна уходила молча. Holds с 2026-09-23 по критерию, утверждённому владельцем."
      status: holds
      limits:
        - "Повтор ОДИН: падение, которое проходит через раз, признаётся случайностью, если повтор удачный — это граница оракула, а не его ошибка."
        - "Живого случая совпадения паттерна за всю историю лога не было (замер 2026-09-23): все 874 строки «AUTO retry» — след юнит-тестов, писавших в боевой лог (исправлено тем же изменением)."
    - id: missed_night_is_loud
      claim: "Смерть ночной задачи тестов видна наутро: `check_nightly_suite_liveness` (монитор 07:50) звенит, если итог ночи не покрывает последний плановый запуск по ЖИВОМУ плисту задачи — порога-литерала нет. До 2026-09-23 датчика не было вовсе: реестр производителей числил задачу покрытой dead-man'ом и её же собственным итогом, а оба этих носителя о её смерти сообщить не могут. Тот же предикат (`morning_test_summary.summary_covers_last_run`) не даёт красной серии ночного цикла читать устаревшие записи как «красного нет»."
      status: holds
      limits:
        - "Судится СЛЕД задачи (итог в agent_reports), а не её запуск: задача, которая стартовала, но не дошла до последнего шага, читается как пропущенная — это и есть нужный смысл."
        - "Выводятся ежедневная и еженедельная {Weekday,Hour,Minute} формы и их списки; StartInterval и прочие дают «не судимо» и звенят этим, а не молчат."
        - "До владельца факт доезжает одним каналом — триажем warn-уровня, ежедневно (класс decide; тест держит, что метка не заглушена и не уехала в понедельничный дайджест). Утренний отчёт (модуль morning_report, удалён 30.09) с его «блоком тестов» выведен из расписания 13.07 и до человека не доезжает вовсе — 23.09 было ошибочно записано, что он «молча опускает блок»."
      check:
        file: integrity_tests.py
        present: ["def check_nightly_suite_liveness", "summary_covers_last_run", "ночной прогон тестов не состоялся"]
  sentinel: tests/unit/test_failure_handler.py
  last_reconciled: "2026-09-15"

- id: public_zone
  title: "Публичная зона: дерево, которое можно открыть в любой момент"
  intent: >
    Владелец решил (2026-09-23): проект когда-нибудь откроется на GitHub новым чистым
    репозиторием — экспортом публичной зоны одним коммитом, история и журналы остаются у него.
    Значит, дерево обязано быть публикуемым в любой момент, а не «вычищаемым к дате»: без
    сторожа каждый коммит снова пачкает его. Поломка тихая: личное (имя, диагноз, препараты,
    даты заборов, города) уезжает в файл, который выглядит обычным кодом или тестом, и ничего
    не краснеет. Поэтому перепись литералов из приватного словаря стоит на pre-commit с ратчетом
    вниз, а список того, чего она НЕ видит, назван рядом с ней, чтобы зелёный не читали шире.
  explanation: docs/explanation/public_zone.md
  code_anchors:
    - pii_census.py::census
    - pii_census.py::judge
    - pii_census.py::public_files
    - scripts/public_mirror.py::unread_public
  invariants:
    - id: census_before_commit
      claim: "Pre-commit гоняет pii_census --staged: у застейдженного публичного файла находок больше долга (private/pii_baseline.json) — коммит заблокирован; уменьшение долга до-стейджится само. Словарь — private/pii_terms.yaml (приватная зона, в экспорт не едет); нет словаря — блок, а не пустой суд. Зоны — publication_zones.yaml."
      status: holds
      limits:
        - "Дерево ветки старше гейта (нет pii_census.py) проходит pre-commit с предупреждением — ловит только ночной ратчет tests/consistency/test_pii_census_ratchet.py."
      check:
        file: scripts/git-hooks/pre-commit
        present: ["pii_census.py\" --staged", "Коммит заблокирован: pii_census"]
    - id: genotype_profile_judged
      claim: "Профиль генотипа тенанта в публичной зоне судится отдельно от словаря: один генотип — знание, выдаёт СОЧЕТАНИЕ. Ночная целостность (check_public_genotype_profile) собирает dict-литералы {rsid: генотип} из публичных .py (pii_census.genotype_profiles) и считает различающие совпадения с raw_snps всех тенантов (pii_census.profile_leaks); порог — system_config pii.genotype_profile_min_hits (seed 3). В сообщение идут путь, строка и число, ни одного генотипа."
      # Заведено 2026-09-25 (нить genotype-scrub): до чистки фикстуры двух тестов были скопированы
      # с живого генома при переписи 0 (4 и 3 различающих совпадения). Мутации 3/3 покраснели
      # (plans/mutate_genotype_profile_2026-09-25.sh). На каноне после чистки — ни одного профиля ≥3.
      status: holds
      limits:
        - "Судятся только dict-литералы в .py: генотипы в .md/.json, в строках и списках кортежей — вне зрения."
        - "При одном тенанте различающих совпадений нет по построению — у публичной установки на одного человека судья слеп."
        - "Частые генотипы не считаются вовсе: профиль из одних частых генотипов, выдающий человека сочетанием с другими данными, не ловится."
      check:
        file: integrity_tests.py
        present: ["def check_public_genotype_profile", "_pc.profile_leaks(profiles, tenants, min_hits)"]
    - id: zero_means_known_classes_only
      claim: "Перепись 0 (замер 2026-09-26 по всем публичным файлам дерева: ни одной находки ни в одном файле) значит «известных литералов нет», а не «личных данных нет». С 2026-09-26 (класс provenance) видна и ПОМЕТКА автора «это настоящие данные <чьи/откуда>» — сама утечка без такой пометки по-прежнему нет. Вне зрения: личное, которого нет в словаре; смысл другими словами; данные без пометки или с пометкой другими словами; бинарники; голые даты в данных тестов; «онкологический» и гены в стражах; старые снимки docs/handoff (приватная зона, но с датой рождения) — долг BL-PUB-14."
      # Заведено 2026-09-25 (нить family-criterion) по парку снимка document-intake@2026-09-25-08c3845 §3 в.2
      # и урокам C-58/C-59 (стражи держали досье литералами; перепись 0 при открытой хронологии).
      status: open
      closes_when: "BL-PUB-14 закрыт, и читатель — не автор (сторонний агент без авторских объяснений) — на экспортированном дереве BL-PUB-9 не нашёл личного владельца или партнёра, которого нет в словаре; найденное — либо внесено в словарь и вычищено, либо названо границей"
      closes_when_by: claude
      warm_guard:
        absent: ["личных данных в публичной зоне нет", "перепись гарантирует", "дерево полностью обезличено"]
        absent_en: ["no personal data in the public zone", "census guarantees", "tree is fully anonymized"]
    - id: push_after_diff_read
      claim: "Выгрузка в открытый репозиторий (scripts/public_mirror.py --push) отказывает, пока не прочитан каждый публичный файл, изменённый после отметки plans/publication_read.txt; список непрочитанного строится из самого коммита (pii_census.public_files_at), а не из плана чтения. Отметку ставит человек или агент после чтения (--mark-read), машинная строка «Версия/Дата» ARCH_SNAPSHOT чтения не требует."
      # Заведено 2026-09-29 (нить finish-prep, решение владельца «Да» на вопрос 2 плана хвостов):
      # страж построен в нитях pub-read-gate/pub-read-version (C-92), в реестре его не было —
      # сессия, трогающая public_mirror, не получала его ни в preflight, ни на закрытии.
      status: holds
      limits:
        - "Судит, что файл ПРОЧИТАН (отметка поставлена), а не что прочитан внимательно: отметку можно поставить не читая — это дисциплина, не механизм."
        - "Структурные отпечатки истории (C-93) чтение пропускает — контрольный поиск по словам истории описан в docs/how-to/publish_mirror.md и остаётся ритуалом."
      check:
        file: scripts/public_mirror.py
        present: ["left = unread_public(a.ref)", "не прочитаны после отметки"]
  sentinel: tests/unit/test_pii_census.py
  last_reconciled: "2026-09-25"

- id: install_path
  title: "Путь установки: урок, который исполняется, и образ, который выпускает владелец"
  intent: >
    Владелец решил (2026-09-30): новичок ставит систему из готового образа — два файла выпуска
    и docker compose, без клона и сборки; на Windows — через WSL2, честно помеченный
    непроверенным. Поломка тихая с обеих сторон: урок остаётся гладким текстом, когда
    установщик уже собирает другое (пропал ключ .env, сменилось имя службы, счёт шаблонов), и
    первым это видит чужой человек на чужой машине — молча уходит. Образ же — вторая
    публикация публичной зоны: всё, что лежит в дереве, лежит и в слоях. Поэтому у документов
    установки — штамп фактов установщика и сторож свежести, как у замыслов; урок исполняется в
    CI по помеченным блокам; выпуск делается только по команде владельца и только из открытого
    репозитория, и только если урок на этом коммите прошёл.
  explanation: docs/explanation/install_path.md
  code_anchors:
    - scripts/install.py::install_facts
    - scripts/install.py::install_facts_hash
    - scripts/tutorial_run.py::blocks
    - scripts/public_mirror.py::release
  invariants:
    - id: install_docs_fresh
      claim: "Урок first_install и how-to install_docker несут штамп <!-- install-provenance: sha256:… --> — хеш фактов установщика (scripts/install.py::install_facts: службы, порты, тома, строка итога, секреты, ключи .env, языки OCR по умолчанию, флаги --docker). Факты сменились — tests/consistency/test_install_docs_fresh.py и pre-commit краснеют и печатают команду doc_agent.py --regen-install <страница>; английская страница обновляется тем же путём перевода."
      status: holds
      limits:
        - "Штамп судит, что страницу ПЕРЕГЕНЕРИРОВАЛИ после смены фактов, а не что текст верен: правильность проверяет прогон урока в CI (tutorial_executes), и только для помеченных блоков."
        - "Факты — то, что установщик знает о себе; поведение образа (что служба реально слушает порт) — вне фактов."
      check:
        file: tests/consistency/test_install_docs_fresh.py
        present: ["install_facts_hash", "install-provenance"]
    - id: tutorial_executes
      claim: "Блоки урока, помеченные <!-- tutorial:run -->, исполняются как написаны (scripts/tutorial_run.py; подмены — только адрес выпуска и заглушки ключей) на чистой Ubuntu в .github/workflows/tutorial.yml с образом из того же коммита; затем дашборд обязан ответить, постоянные службы кроме бота — отмечаться, бот — дойти до InvalidToken на поддельном токене. public_mirror.py --release не ставит тег, пока tutorial.yml на этом коммите не зелёный."
      status: holds
      limits:
        - "Исполняются только помеченные блоки на Linux: шаги Мака (Colima, launchctl) и ветка Windows/WSL2 не прогоняются — Windows прямо помечена в уроке «не проверено»."
        - "Поддельный токен: настоящий Telegram CI не проходит. Путь бота дальше отказа Telegram (/start и знакомство) — отдельный инвариант first_contact_executes; карточки и документы не проходятся."
        - "CI живёт только в открытом репозитории: в рабочем репозитории владельца урок не исполняется, сторож — штамп фактов и тесты."
      check:
        file: scripts/public_mirror.py
        present: ["_run_of(\"tutorial.yml\", commit=head)", "не зелёный"]
    - id: first_contact_executes
      claim: "Человек проходит первый контакт так, как его получит бот: в CI (шаг «первый контакт» tutorial.yml, на свежей базе урока) scripts/first_contact_smoke.py в контейнере бота с его монтированием (ключи — только чтение) гонит /start, всё знакомство и /help через bot.main.build_app — те же обработчики, фильтр владельца и обработчик ошибок; поддельный только сетевой слой Telegram. Красный: необработанная ошибка, любой notify.fault, запись ERROR, знакомство не кончилось или не записало имя, профиль уже заполнен (стенд не чистый). Красный шаг — красный tutorial.yml — тега нет."
      status: holds
      # holds 2026-10-02 по критерию, утверждённому владельцем («Согласен»): шаг «первый контакт» зелёный
      # в tutorial.yml открытого репо на коммите выпуска v0.1.4 (Export of 42e3792, run 36977969421);
      # мутация «/start пишет номер чата» в образе — красный Errno 30 (02.10,
      # снимок нити first-contact). Анонимная загрузка образа v0.1.4 из ghcr — 200.
      limits:
        - "Telegram подделан: длину сообщений, разметку, гонки кнопок, доставку на телефон проверка не видит."
        - "Ответы знакомства — один путь (первая кнопка, типовой текст): ветки «пропустить», «вопрос посреди знакомства» и повтор /about не проходятся."
        - "Модель не зовётся: знакомство её сейчас не зовёт (замер 02.10); начнёт — смоук покраснеет на поддельном ключе, и решать, подставлять ли ответ модели, надо тогда."
      check:
        file: .github/workflows/tutorial.yml

        present: ["resolve_hypothesis", "verdict", "revised_hypothesis"]
    - id: versioned_not_destructive
      claim: "Правки гипотезы версионны (history[], version+1), не разрушающие: подтверждённая не закрывается, а ждёт следующей порции данных."
      status: holds

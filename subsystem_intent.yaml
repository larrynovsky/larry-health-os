- id: document_intake
  title: "Приём документов и генома от человека: модель только предлагает"
  intent: >
    Посторонний, поставивший систему, приносит свою историю сам: заключения врачей, выписки,
    анализы за три года и сырые данные генома — файлом в бот, ссылкой на облако или путём
    на диске (нить document-intake, 24.09; решение владельца «просить геном, анализы и любые
    заключения врачей за 3 года»). Повторный импорт файла с кириллицей в имени
    может создавать события-дубли и повторно вызывать модель без сигнала.
    Поэтому обещания: один документ —
    одно событие (сторожит ночной датчик, а не память); модель из документа только
    ПРЕДЛАГАЕТ диагнозы и лекарства, в медкарту их вносит человек; предложение несёт
    дословную цитату, и цитата, которой нет в тексте PDF, — выдумка, она отбрасывается
    (у снимка сверка через OCR помечает, а не отбрасывает: OCR сам ошибается); квитанция
    бота не обещает маршрута, которого нет (разборщик не запущен — сказано прямо); по
    ссылке скачивается только из четырёх облаков, каждое перенаправление проверяется,
    внутренние адреса отклоняются. Путь к файлу на диске читает любой файл машины — это
    доверие между тенантами одной машины (решение владельца 24.09), граница названа в
    записи multitenancy.

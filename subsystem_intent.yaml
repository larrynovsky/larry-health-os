- id: llm_exit
  title: "Выход к модели: один гард, один переводчик, смена модели — только на проверенную"
  intent: >
    Все 75 мест вызова модели говорят форматом Anthropic Messages и уходят через один выход —
    llm_client.guarded_client. Поломки здесь тихие по природе. Поставщик отключает модель — и
    анализы перестают распознаваться в день отключения, а узнаёт об этом человек. Модель
    подменили запасной без проверки — ответы продолжают приходить, правдоподобные и неверные
    (замер 01.10: gpt-5.6-terra три раза из трёх прочла число из бланка с ошибкой в десятых). Переводчик
    на чужого поставщика прочитал обрезанный ответ как законченный — JSON задач потерян без
    ошибки. Допуск рассуждающей модели посчитал деньги после вызова — бюджет владельца
    перепрыгнут одним запросом. Решения владельца 01.10: «сама с уведомлением» (переключение
    без человека, но только по цепочке допущенных и с карточкой), «вариант а» (один наш
    переводчик на выходе, а не посредник вроде LiteLLM — швы перевода под нашими тестами),
    лимит 10 $ в месяц на допуск, собственные бланки владельца в автоматическом допуске уходят
    только в Anthropic. Чужой поставщик установки (HEALTH_LLM_PROVIDER) получает только роли,
    чьи модели прошли допуск на синтетике; остальное отказывает громко.

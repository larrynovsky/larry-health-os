# ── Опережающие индикаторы: первый класс гипотез (predictor@T → target@T+lag). ──
# СТАТУС: gated_q_lag (промоут 2026-07-23; приостановка и возврат 2026-09-22 — см. lagged.status). Направления/лаги фиксированы (не по данным). Нуль
# валидирован twin'ом, включены в веру ОТДЕЛЬНОЙ семьёй q_lag (fdr_q_lag, BY, owner-only), derived
# исключены (m≈18). Наивный spearman-путь остаётся ТОЛЬКО в Excel-отчёте, вне веры.
lagged:
  status: gated_q_lag                  # ВОЗВРАЩЕНО 2026-09-22 после перепроверки по PREREG (все 3 лага admit).
                                       # Хронология: промоут 2026-07-23 → приостановка 2026-09-22 (BL-TWIN-BAND-1:
                                       # прежний twin судил полосой из наблюдённой доли) → перепроверка в тот же день:
                                       # twin_lag_directed.py, правило записано коммитом 58e733e ДО прогона, результат —
                                       # twin_lag_revalidation_2026-09-22.json (24 ячейки × 2000, type-I 0.044–0.0635,
                                       # ни одна не прошла Бонферрони 0.05/24). version НЕ бумпалась ни в одну сторону.
                                       # Ближе всех к краю: lag 1, φ=0.9, η=0 — 6.35% (p=0.0043 без поправки); φ=0.9
                                       # это угол синтетической сетки, не оценка параметров конкретного ряда.
  # Harness-валидация направленного сдвигового нуля (Группа 2 ч.2 fdr-online, 2026-07-23):
  #   twin_lag_directed.py гонял ПРОДОВЫЙ correlation_gate._strat_pvalue_lagged (strat_hi, лаг ВНУТРИ эпохи).
  #   type-I@0.05 держит номинал ±2·MCSE по сетке φ×η для ВСЕХ лагов 1/2/3 (0.013–0.073; вкл. угол φ=0/η=0.8,
  #   где contemporaneous семья A плыла — направленный лаг там чист). Мощность 1.00 (β=0.4). prewhitening/
  #   state-space НЕ применялись (спека §3.3.2 их отклонила для confirmatory). Наивный lagged_correlations
  #   (spearman p<0.05) остаётся ВНЕ веры. Промоут+бюджет m (новая q_lag ∨ направленная под-семья A) = оракул владельца.
  harness_validated: "2026-09-22"      # PREREG-перепроверка (было 2026-07-23 — по мягкой полосе)
  predictors: [hrv, sleep_total, sleep_deep, sleep_score, steps]
  targets:    [hrv, readiness, sleep_score, sleep_total]
  lags_days:  [1, 2, 3]

# ── Композиты: исключаются из семьи (композит × его вход ≠ новое открытие, §6/R1) ──
derived_composites:
  known:
    - sleep_score              # Oura composite
    - readiness                # Oura composite
    - readiness_hrv_balance    # под-индекс readiness (из HRV) — исключён по решению владельца 2026-07-12
    - readiness_recovery_idx   # под-индекс readiness — исключён по решению владельца 2026-07-12
    - readiness_body_temp      # v8: под-индекс readiness — тот же класс, прецедент 2026-07-12
    - activity_score           # v8: композит Oura (шаги+ккал+…), тот же класс, что sleep_score/readiness
    # Состав тела Fitdays (v2, 2026-07-12): весы считают всё из веса+импеданса → коллинеарно с весом.
    # НЕ новые сигналы, вес в обёртках. Добавление в семью = composite×вход ложные открытия (§6/R1).
    - bmi
    - body_fat_pct
    - skeletal_muscle_pct
    - muscle_mass_kg
    - visceral_fat
    - body_water_pct
    - protein_pct
    - bmr_kcal
    - bone_mass_kg
  r2_threshold: 0.90           # метрика с R²≥порога от остальных считается производной (авто-детект)

# ── Часть-целое: ПРЯМЫЕ структурные пары (Gate 0 «Structural Block», gates.yaml; добавлено
# 2026-08-06, validation-gate-repair). Со-движение ОПРЕДЕЛЕНИЕМ, не открытие: компонент ⊂ целое.
# Gate 0 декларировал блокировку часть-целое, но _derived_metrics ловил только МЕТРИКУ (R²≥0.9/
# known), не ПАРУ: sleep_light не daily-метрика → total из deep+rem R²-детектом не реконструируется.
# Без реестра такие пары могли рендериться LLM как «A-lever открытие».
# Это структурный блок РЕНДЕРА (gate_pass), а не смена тестируемой семьи/параметров:
# m, permutation-p и BY-порог сохраняются. До разделения version и quarantine_epoch
# бамп версии мог сделать pending-строки карантина чужими и скрыть их от читателя.
# Пары остаются в семье для учёта множественности (консервативно), режутся на gate_pass.
# Транзитивность НЕ применяется (efficiency=total/inbed → efficiency-пары это Gate 0.5, не здесь).
part_whole_pairs:
  - [sleep_total, sleep_deep]   # deep ⊂ total (стадия сна — часть общего)
  - [sleep_total, sleep_rem]    # rem  ⊂ total
  # v8 (2026-09-24, data-parity) — по определению Oura: total = deep+rem+core; inbed = total+awake.
  - [sleep_total, sleep_core]   # core ⊂ total
  - [sleep_inbed, sleep_total]  # total ⊂ inbed
  - [sleep_inbed, sleep_awake]  # awake ⊂ inbed
  - [sleep_inbed, sleep_deep]   # стадии ⊂ inbed (прямая часть, не транзитивность: inbed = стадии + awake)
  - [sleep_inbed, sleep_rem]
  - [sleep_inbed, sleep_core]
  - [active_kcal, total_kcal]   # active ⊂ total (total = active + базовый обмен)

# ── Пары «алгоритмическая производная одного конвейера» (Gate 0, решение владельца 2026-08-13,
# нить validation-gate-repair). Класс: метрика B ВЫЧИСЛЯЕТСЯ алгоритмом трекера из активности,
# где A — главный вход; связь — свойство арифметики устройства, не тела. Структурность судится
# ПО ПРОВЕНАНСУ вычисления (реестром, как часть-целое), потому что числовые пороги могут её
# пропустить: active_kcal зависит не только от steps, но и от тренировок и пульса. Такая пара
# может не достигать derived R²≥0.9 или частной корреляции ≥0.80 Gate 0.5 и всё же быть структурной.
# Потребитель тот же (correlation_gate: колонка structural). ПОСТ-BY фильтр: p/семья/m/version
# не тронуты. После структурного фильтра допустим и пустой набор содержательных связей.
algorithmic_derived_pairs:
  - [steps, active_kcal]   # active_kcal суммируется трекером из движения; шаги — главный вход
  # v8 (2026-09-24, data-parity) — тот же класс по провенансу вычисления:
  - [steps, distance_km]              # дистанция = шаги × длина шага (оценка трекера)
  - [sleep_efficiency, sleep_inbed]   # efficiency = total / inbed — знаменатель по определению
  # v8, ЗАМЫКАНИЕ того же конвейера (шаги → дистанция, шаги → активные ккал ⊂ все ккал).
  # Реестр дополнен ПОСЛЕ взгляда на результат; численные итоги здесь опущены.
  # Это пост-BY фильтр рендера: p, m, семья не меняются; основание — провенанс вычисления,
  # а не величина r. Решение принято 2026-09-25 по тому же правилу, что 2026-08-13.
  - [steps, total_kcal]
  # v9 — объявлено ДО прогона, по определению: время в постели = подъём − засыпание
  - [sleep_start, sleep_inbed]
  - [sleep_end, sleep_inbed]
  - [distance_km, active_kcal]
  - [distance_km, total_kcal]
  # v10 (2026-09-25, нить new-sources) — модуль Oura «стресс/восстановление».
  # Реестр дополнен ПОСЛЕ взгляда на исход; результаты измерений здесь опущены.
  # Основание решения — общий конвейер пульса/ВСР; формул Oura мы не видели:
  # это решение о провенансе, не доказательство формулы по корреляции.
  # По уроку C-54 объявлено ЗАМЫКАНИЕ: все пары внутри модуля (5 выходов → 10) +
  # оба входа (resting_hr, hrv) × оба процента восстановления (4).
  - [resilience_sleep_pct, resilience_daytime_pct]
  - [resilience_sleep_pct, resilience_stress_pct]
  - [resilience_daytime_pct, resilience_stress_pct]
  - [stress_high_min, recovery_high_min]
  - [stress_high_min, resilience_sleep_pct]
  - [stress_high_min, resilience_daytime_pct]
  - [stress_high_min, resilience_stress_pct]
  - [recovery_high_min, resilience_sleep_pct]
  - [recovery_high_min, resilience_daytime_pct]
  - [recovery_high_min, resilience_stress_pct]
  - [resting_hr, resilience_sleep_pct]
  - [resting_hr, resilience_daytime_pct]
  - [hrv, resilience_sleep_pct]
  - [hrv, resilience_daytime_pct]
  # 28.09 — замыкание модуля Oura дописано входами × МИНУТЫ стресса и восстановления.
  # В прежнее замыкание попали только проценты. Дополнение сделано ПОСЛЕ взгляда на исход:
  # пограничное решение может зависеть от разрешения Монте-Карло.
  # Основание — провенанс вычисления прибора, не величина p; формул Oura не видели.
  # Пост-BY фильтр: p, m, семья, version не тронуты.
  - [hrv, stress_high_min]
  - [hrv, recovery_high_min]
  - [resting_hr, stress_high_min]
  - [resting_hr, recovery_high_min]

# ── Gate 2 «Period Profile» порог (ВКЛЮЧЁН как БЛОК 2026-08-08, validation-gate-repair, решение
# владельца о глобальном применении). Двухкомпонентный: |медианы r| по допущенным эпохам И доля согласного знака.
# Точка zero-false — калибровка plans/probe_calibrate_two_component_2026-08-04.py (1000 повторов:
# при РОВНО нуле ложных r_min=0.225, s=1.0, мощность 40%). ПОСТ-BY фильтр (как часть-целое/coverage):
# permutation-p, семья и m НЕ тронуты → version НЕ бумпнут, метод-эпоха карантина не churn-ится.
# N/A когда профиля нет (нет эпох — тенант) → НЕ блокирует (Gate 2 неприменим, fail-open).
# Фильтр отсекает слабые или нестабильные по знаку профили. Структурно-смежные пары
# могут пройти его; их отдельно рассматривает Gate 0.5.
gate2_profile:
  r_min: 0.225        # пол |медианы r| по допущенным эпохам
  sign_min: 1.0       # пол доли эпох со знаком медианы (1.0 = знак не переворачивается ни в одной)

# ── Gate 0.5 «Suppression Detector» (ВКЛЮЧЁН 2026-08-08, validation-gate-repair).
# Скрытая тавтология Y=X/Z может маскироваться знаменателем Z=время в постели (sleep_inbed).
# Сигнатура подавления: контроль Z раскрывает near-deterministic связь → частная
# Пирсон-корр |r|≥partial_min (R²>0.64, автор) И |частная|>|сырой| (ratio>1,
# отличает суппрессию от честной сильной пары). Иллюстративный пример, числа вымышлены:
# сырой r=0.30 → частный r=0.90, ratio=3.0 → блок.
# ПОСТ-BY фильтр (version НЕ бумпнут, карантин не churn-ится).
# N/A когда Z нет / троек <30 → не блокирует. Пирсон, НЕ Спирмен (порог R²).
gate0_5:
  partial_min: 0.80   # пол |частной корреляции Пирсона| при контроле Z=sleep_inbed

# ── Held-out (пост-заявочное подтверждение, СЕМАНТИКА A с 2026-08-19) — пост-gate параметры:
# p-валидность семьи не трогают, version не бумпается. Читают: correlation_gate (_heldout_confirm,
# разрез train в gate_correlations) и гаситель heldout_readiness.parks_due /
# integrity_tests.check_heldout_ready (парк «прочти вердикт», когда окно дозрело).
heldout:
  floor_weeks: 6      # пост-freeze окно (недели), при котором held-out стоит прогонять
  # 2026-08-19 (нить heldout; замер симуляции Э1a — 14.08): пол 42д ПЕРЕСТАЛ быть
  # провизорным — симуляция мощности (сид 20260814, frozen φ из data_manifest) показала:
  # это граница ВАЛИДНОСТИ перестановочного нуля (ложные ≈ α от 42д, на ≤28д нуль
  # антиконсервативен ~2×). Мощностная граница (какое окно нужно ЭФФЕКТУ) — отдельная и
  # длиннее: r=0.5/φ=0.2 → 42д, r=0.5/φ=0.5 → 56д, r≤0.3 → >84д; вся таблица — в ADR
  # adr_heldout_train_confirm_split. Пост-BY/пост-gate параметры: p-валидность семьи не
  # трогают, version не бумпается. confirm_alpha — порог перестановочного p на confirm-окне.
  confirm_alpha: 0.05

# ── Параметры теста (часть замороженной декларации) ──
gate_params:
  fdr_q: 0.10                  # §12.1: терпимость discovery
  b_perm: 1000                 # если пол permutation-p = 1/1001 выше шага BY ранга 1, ранг недостижим
                               # v12: для семьи D больше не используется (см. d_perm_exact); живёт в held-out confirm
  d_perm_exact: true           # v12 (27.09, решение владельца): p семьи D — точный перебор всех годных сдвигов
  guard_days: 7                # circular-shift guard
  min_overlap_days: 365        # v10: общих дней пары на train для суда (до BY); было coverage_min 0.40 доли всей сетки
  lab_window_days: 7
  lab_n_min: 18
  pair_min_overlap: 30         # A3 (2026-09-22): минимум общих дней пары для ранговой корреляции семьи — ниже пара
                               # не считается вовсе (не «незначима», а «не тестировалась»). Вынесен из литералов
                               # correlation_gate._masked_corr, longitudinal.correlation_matrix (дефолт) и
                               # lagged_correlations — один смысл, одно значение. Значение НЕ изменено. Оракул — инженер.
                               # НЕ сюда: recovery_trajectory `len(b_vals) < 30` — минимум дней БАЗЫ для сравнения
                               # с текущим, другой вопрос; совпадение числа 30 — не совпадение смысла.
  panel_min_days: 80           # D1 (2026-07-23): минимум дней данных для входа метрики в панель И для derived-регрессии.
                               # Перенесён из литерала correlation_gate.py (×4: notna≥80 в _gate_daily/_gate_daily_stratified/
                               # _gate_lagged + len<80 в _derived_metrics — тот же порог, та же семантика «≥80 дней»). Значение
                               # НЕ изменено. Оракул — инженер (минимум выборки для рангов/регрессии).
  # ── Стратифицированный A-гейт (Фаза 2 fdr-online, 2026-07-22) ──
  c_star_stratified: 0.15      # τ̂/L порог валидности эпохи (governance П10, СТРОГО; серая зона 0.15–0.3 исключена)
  epoch_min_len: 16            # A4 (2026-09-23, нить family-epoch): a-priori пропуск короткой эпохи (дней) в strat_hi И в
                               # профиле эпох — было литералом ×2 в correlation_gate (гейт и профиль обязаны совпадать,
                               # иначе профиль расходится со стратифицированной семьёй молча). Значение НЕ изменено.
  epoch_min_overlap: 12        # A4: пол общих дней пары внутри эпохи (литерал ×2 там же). Значение НЕ изменено.
                               # Без бампа version и quarantine_epoch (прецедент A3): сменился дом числа, не метод.
  b_perm_stratified: 100000    # MC-пул strat_hi: пол p=1/(B+1)=1e-5 < BY-rank1 → достижим (в отличие от b_perm=1000)
  # ── Причинное уточнение A-рычагов (Группа 2 fdr-online, 2026-07-23) — ОПИСАТЕЛЬНОЕ, НЕ error-rate ──
  # Пометка поверх A-рычага: рычаг | совпадение | не_знаю (как D-разметка — «маркер, не тревога»). НЕ входит
  # в бюджет q_A/q_D (не пост-селекция с error-rate семантикой). Реконструкция ручного пробника 07-22
  # (плацебо/остаток/лаг) из period_confound_protocol. Пороги — clarity-cut, НЕ под исход. Оракул значений — владелец.
  causal_alpha: 0.10           # clarity-cut отдельного суб-теста (= пол неопределённости владельца); асимметрия — в комбинаторе
  causal_b_perm: 20000         # MC-пул причинных суб-тестов (пол p=1/(B+1)≈5e-5 ≪ alpha)
  causal_resid_window: 7       # ±дней локального среднего: быстрый остаток снимает медленный дрейф/недельный ритм
  causal_lag_days: 1           # направленный дискриминатор T→T+lag (та же ночь vs назавтра)
  causal_asym_ratio: 1.6       # во сколько раз |r| ведущего лага > обратного, чтобы звать 'рычаг' (асимметрия предшествования)
  # ── Направленная лаг-семья q_lag (промоут Группа 2 ч.2, 2026-07-23) — ОТДЕЛЬНАЯ семья, confirmatory ──
  # Решение владельца: отдельный бюджет q_lag (НЕ под-семья A) — лаговое≠одновременное, смешивать = категор.ошибка.
  # Нуль валидирован (twin_lag_directed, type-I номинал лаги 1/2/3). Статистик = strat_hi на направленной паре
  # (_strat_pvalue_lagged, B=b_perm_stratified). derived (sleep_score/readiness) исключены → m≈18, BY-порог достижим.
  fdr_q_lag: 0.10              # FDR-уровень направленной семьи (тот же q, что A/D; вклад в раскрытый леджер, см. notes)

notes: >
  §12.1 action-gate (повтор на свежих данных + величина эффекта) живёт на слое действия, не здесь.
  Долг Ф2/Ф3: сейчас m считается по парам, прошедшим сырой скрин p<0.05 (не полная семья) — при
  переходе на валидную полную семью и BY поднять b_perm (или exact enumeration), иначе BY-порог недостижим.
  БЮДЖЕТНЫЙ ЛЕДЖЕР (раскрытая честная цена, спека §1.2/§5.2.1 — НЕ enforcement, это Фаза 4): каждая семья
  несёт свой уровень q; lifetime-риск ложного открытия = раскрытая СУММА, не спрятана в один порог.
  Сейчас в вере: q_A=0.10 (внутрирежимный рычаг) + q_D=0.10 (описательное, не error-rate) + q_lag=0.10
  (направленное предшествование) = раскрытая сумма 0.30. q_on (онлайн-слой Фазы 4) НЕ активен (потока нет).
  Причинное уточнение causal_* — ВНЕ леджера (descriptive, не error-rate). Enforcement суммы = Фаза 4.

      status: holds
      check:
        file: secrets_paths.py
        present: ["HEALTH_SECRETS_DIR", "fail-closed"]
    - id: tenant_data_loud_default
      claim: "В мультитенантном режиме (HEALTH_MULTITENANT) процесс без явного HEALTH_DATA_DIR падает громко (R1), а не берёт молча данные дефолтного тенанта."
      status: holds
      check:

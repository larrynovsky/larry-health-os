# Реестр замысла подсистем — машинный слой (reference, Diátaxis).
#
# Хребет самомониторинга. Три связи:
#   1. КОД → сюда: докстринг-тег `# INTENT: <id>` в головном модуле подсистемы.
#   2. сюда → ТЁПЛЫЙ СЛОЙ: `explanation` → docs/explanation/<id>.md — ПРОИЗВОДНОЕ
#      от этого файла (первичен реестр), перегенерируется по сигналу сторожа.
#   3. сюда ↔ КОД: `code_anchors` + `invariants[].check` + `sentinel` — сторож
#      сверяет и что якоря живы, и что смысл кода не разошёлся с утверждением.
#
# ЖИВЁТ В GIT ВНУТРИ РЕПОЗИТОРИЯ, НЕ в iCloud (load-bearing; iCloud = СК-1).
#
# ЧТО СЮДА ПОПАДАЕТ (решение владельца 2026-09-02, критерий «тихое нарушение»):
#   механизм, ЧЬЯ ПОЛОМКА НЕ ВИДНА СНАРУЖИ — система продолжает выглядеть работающей,
#   а утверждение, на которое опираются, становится ложным. Второй писатель в канон;
#   тенант, читающий чужие секреты; умерший датчик; гейт, пропускающий пустую квитанцию;
#   лог, ротированный переименованием, — он замолкает навсегда и молча.
#   Критерий ВЫЧИТАН из реестра, а не придуман под ответ: он объясняет все записи,
#   включая три мета (project_context, disposability_gate, intent_receipts). Планка
#   проходит НЕ по клинике — замер 02.09 это опроверг.
#   Что НЕ попадает: поломка, которую видно сразу (упало — заметили). Ей хватает теста.
#
# invariants[].status: holds | doc_drift | designed_not_built | open
#   open = 4-я колонка: расхождение на решение человека, НЕ бетонируем.
# invariants[].closes_when — ОБЯЗАТЕЛЬНО у каждого не-holds (решение владельца 15.09).
#   Что должно стать ПРАВДОЙ, чтобы обещание закрылось. НЕ «когда вернуться»: замер
#   14.09 снял календарный срок как условие — он не измеряет, выполнено обещание или
#   нет. До 15.09 условия не было ни у одного из 22 открытых, и единственным способом
#   закрыть обещание было вспомнить про него и спросить владельца.
# invariants[].closes_when_by: claude | owner — ЧЕЙ это критерий. Предложение агента и
#   слово владельца — разные вещи; без поля первое через месяц читается как второе.
#   Сторож охвата, формы и авторства: tests/consistency/test_closing_condition_coverage.py
#   (четыре исполненные мутации, каждая роняет ровно свой тест).
# invariants[].check (опц.): смысловой маркер, не только «символ жив».
#   file — где искать; present — все подстроки обязаны быть;
#   absent — ни одной быть не должно. Смысл кода поменялся под тем же
#   именем → маркер краснеет → сигнал «сверь замысел».

- id: validation_gate
  title: "Валидационный гейт корреляций"
  intent: >
    Сырая корреляция между двумя показателями — ещё не правда о теле. Прежде чем
    такая связь попадёт в конституции и станет основой, из которой ИИ строит
    уверенный рассказ, она проходит фильтр: он проверяет, переживёт ли связь
    случай и не родилась ли она просто из того, что мы перебрали много пар сразу.
  explanation: docs/explanation/validation_gate.md
  spec: methodology/signal_validation_lifecycle_SPEC.md
  code_anchors:
    - correlation_gate.py::gate_correlations
    - correlation_gate.py::_gate_daily
    - correlation_gate.py::_gate_labs
    - correlation_gate.py::_bh_threshold
  invariants:
    - id: fdr_applied
      claim: "Поправка на множественные сравнения (FDR) применяется к семье протестированных пар, а не к каждой отдельно."
      status: holds
      check:
        file: correlation_gate.py
        present: ["_bh_threshold(", "FDR_Q"]
    - id: circular_shift
      claim: "На daily-пути ложную значимость двух «липких» рядов душит перестановка с циркулярным сдвигом."
      status: holds
      check:
        file: correlation_gate.py
        present: ["np.roll"]
    - id: derived_filter
      claim: "Показатели-формулы из других (напр. балл сна) распознаются и не пускаются."
      status: holds
      check:
        file: correlation_gate.py
        present: ["_derived_metrics", "R2_DERIVED_THRESH"]
    - id: fdr_method_open
      claim: "Метод FDR — Benjamini-Yekutieli (BY = step-up при q→q/H_m) на ОБОИХ путях, как требует спека §4. Расхождение BH-vs-BY закрыто на daily 2026-07-13 (Ф3), на lab — 2026-07-21 (флип после re-gate). Прежняя формулировка «lab остаётся BH» была ложной с 21 июля и держалась до аудита 2026-07-26: маркер стерёг наличие BY у daily и потому оставался зелёным."
      status: holds
      check:
        file: correlation_gate.py
        present: ["FDR_Q / _H(m_fam)", "def _H("]
      # warm_guard теперь стережёт ОБРАТНУЮ ложь: занизить BY до «всё ещё BH».
      warm_guard:
        absent: ["метод остаётся benjamini-hochberg", "по-прежнему bh", "йекутиели не применяется", "bh вместо by"]
        absent_en: ["still benjamini-hochberg", "still uses bh", "yekutieli is not applied", "bh instead of by"]
    - id: prewhitening_is_detrend
      claim: "«Отбеливания» (prewhitening) в коде нет; на lab-пути — только линейный детренд. Плейбук заявляет prewhitening — неточность дока."
      status: doc_drift
      closes_when: "плейбук переписан под код (слово «prewhitening» убрано либо заменено на «линейный детренд»), и расхождение дока с кодом больше не воспроизводится чтением обоих"
      closes_when_by: claude
      check:
        file: correlation_gate.py
        present: ["_detrend", "polyfit"]
        absent: ["prewhit", "отбел"]
      warm_guard:
        absent: ["отбеливание применяется", "выполняется отбеливание", "prewhitening применяется"]
        absent_en: ["prewhitening is applied", "applies prewhitening", "data are prewhitened"]
    - id: heldout_designed_not_built
      # id ИСТОРИЧЕСКИЙ (инвариант рождён в статусе designed_not_built, 2026-07) —
      # идентификатор не переименовывается, на него ссылаются хэндоффы и снимки нитей;
      # смысл несёт claim. Прецедент: fdr_method_open давно holds.
      claim: "Held-out (SPEC §4) РЕАЛИЗОВАН семантикой A — train/confirm split по frozen_at (решение владельца «согласен с А» 2026-08-19, снятие статуса — «доделывай» 2026-08-20; ADR docs/explanation/adr_heldout_train_confirm_split.md): discovery гейта (daily, стратификация A, q_lag, лаб при реактивации) судит ТОЛЬКО train (date <= frozen_at), confirm судит пары D на пост-freeze хвосте контрактом passed / failed (значимый обратный знак) / insufficient / nothing_to_judge / insufficient_window. Confirm — ИЗМЕРЕНИЕ: вердикты едут в gate_meta.heldout и веру, публикацию НЕ блокируют (блок — отдельное решение владельца на живом материале). Пол окна 42д — замеренная граница валидности перестановочного нуля (симуляция Э1a на frozen φ из data_manifest), не назначение; confirm_alpha и floor_weeks живут в signal_family.yaml."
      limits:
        - "Ветки Confirm passed/failed/insufficient проверены синтетикой через боевой вход (test_heldout_confirm_verdicts). Это не подтверждает поведение на произвольной непустой живой семье."
        - "Взаимодействие с ре-freeze семьи (version↑ → новый frozen_at → хвост обнуляется) живьём не прожито; семантика описана в ADR, оракула на переход нет."
        - "Опубликованное spearman_r потребителей — полный ряд (артефакт аналитика); суждение гейта несёт r_train. Перевод потребителей на r_train — отдельное решение владельца."
      status: holds
      verified_at: "2026-08-20"
      verified_on: "canon"
      # Сценарий nothing_to_judge при пустой семье проверяет контракт,
      # но не заменяет проверку вынесения вердикта по непустому входу. Носитель —
      # suite: test_heldout_discovery_is_train_only (break-back усечения) +
      # test_heldout_confirm_verdicts (все ветки). Проб нет — поле probe отсутствует.
      check:
        file: correlation_gate.py
        present: ["_heldout_confirm", "daily_train"]
      warm_guard:
        absent: ["в гейте не реализован", "спроектирован, но не реализован", "контрольная выборка спроектирована, но не построена"]
        absent_en: ["not implemented in the gate", "designed but not implemented", "held-out sample is designed but not built"]
    - id: spec_provenance_in_git
      claim: "Спека гейта + harness (fdr_harness/stage_b_twin/stage_b_scenarios) в git (methodology/), под сторожем integrity_tests. СК-1 устранён. Batch-квалификация ЗАВЕРШЕНА (qualification_protocol.release_result, ACCEPTANCE=True 2026-07-13): harness release-grade, числа воспроизводимы (release_run.py 50k/10k)."
      status: holds
      check:
        file: tests/unit/test_validation_gate_methodology_sentinel.py
        present: ["test_vg_methodology_sentinel_fails_when_missing", "check_validation_gate_methodology_present"]
      # warm_guard теперь стережёт ОБРАТНУЮ ложь: занизить готовую batch-квалификацию до «не завершена».
      warm_guard:
        absent: ["квалификация не завершена", "квалификация заблокирована", "harness не release", "воспроизводимость не доказана"]
        absent_en: ["qualification is not complete", "qualification is blocked", "harness is not release", "reproducibility is not proven"]
    - id: family_frozen_in_params
      claim: "Семья сигналов (пары/лаги/направления) и параметры теста заморожены в methodology/validation_gate/signal_family.yaml (§12.3); гейт читает оттуда, менять — только ре-объявлением, не под результат. Направленная лаг-семья q_lag в вере: промоут 2026-07-23 стоял на мягкой полосе twin-проверки (BL-TWIN-BAND-1); 2026-09-22 семья была приостановлена и в тот же день перепроверена по правилу, записанному до прогона (24 ячейки × 2000 повторов, точный биномиальный тест, Бонферрони) — все три лага допущены, артефакт twin_lag_revalidation_2026-09-22.json. Калибровка проверена на уровне 0.05, не в хвосте BY-порогов. С 2026-09-22 (A3) остатка хардкода семьи нет: минимум общих дней пары (pair_min_overlap=30, три читателя, один из которых — дефолт correlation_matrix — прежний regex-сторож не видел) и окно LAB_WINDOW_DAYS читаются из yaml, значения не изменены. Статус open держит НЕ хардкод, а closes_when: доказательства по истории yaml против дат прогонов веры ещё никто не собирал."
      status: open
      closes_when: "история signal_family.yaml против дат прогонов показывает, что за полный цикл публикации веры (вс 03:00 → вс 03:00) семья не менялась по смыслу ни разу, И каждая правка семьи, сделанная ПОСЛЕ взгляда на результат (всякая после сверки family-epoch — история до неё разобрана ниже; не только в окне), — законное исключение: (1) убирает пары (в algorithmic_derived_pairs / derived), которые прибор вычисляет из одних и тех же замеров; (2) записана в yaml открыто — дата, причина, пометка «после взгляда на исход»; (3) объявлено замыкание всего модуля прибора, а не только прошедшие пары (урок C-54); (4) в той же правке ничего не добавлено в семью и не сдвинут ни один порог/лаг/параметр теста. Любая иная правка после результата — нарушение: окно суждения начинается заново с её даты, и она описывается под инвариантом"
      closes_when_by: owner
      # Критерий утверждён владельцем 2026-09-25 («согласен с рекомендацией», вариант Б; нить family-criterion).
      # Прежний критерий (closes_when_by: claude) не судил правки после результата вне окна и разрешал
      # «поменял — выждал неделю — чисто». Известные правки после результата на дату утверждения:
      # 24.09 40f13e7 (замыкание арифметики трекера v8) и 25.09 7e6702d (модуль Oura стресс/восстановление,
      # «формул Oura мы не видели — это решение, не факт»). Обе подлежат суду по пп. (1)–(4) при закрытии.
      # Сверка 2026-09-23 (нить family-epoch; разбор YAML по коммитам, не диф текста):
      #   22 коммита с 12.07; меняли СМЫСЛ (состав/значения параметров): 12.07 (derived v2),
      #   22–23.07 (strat_hi, causal, q_lag — ре-объявления v3–v6), 25.07 (имена к канону, v7),
      #   08–19.08 (Gate 0/0.5/2 и held-out — новые БЛОКИ, пост-BY фильтры, p/m/семья не тронуты),
      #   22.09 (q_lag: приостановка и допуск по правилу, записанному ДО прогона). Только дом
      #   числа (значение то же, без бампа): 22.09 A3 pair_min_overlap, 23.09 A4 epoch_min_len/
      #   epoch_min_overlap и quarantine_epoch. Только метаданные/комментарии: 19.08, 21.08, 23.09.
      #   14.08 (steps×active_kcal) семью НЕ менял — пара снята фильтром Gate 0 после BY.
      #   Итог: полного цикла публикации веры (вс 03:00 → вс 03:00) без смысловой правки ещё не
      #   было — последняя 22.09. Первая возможная дата суждения — 04.10 (цикл 27.09 → 04.10),
      #   если до неё YAML не меняется по смыслу. Правка «дом числа» и метаданные — не смена семьи
      #   (прецедент A3); допуск по предрегистрированному правилу — не «подстройка под результат».
      # Сверка 2026-10-04 (плановая; критерий читан из closes_when, closes_when_by: owner):
      #   Прогоны веры есть: agent_reports #433 27.09 03:00:29 и #452 04.10 03:00:36 (местн.) — в БД
      #   владельца в контейнере (health-cron-1, с 30.09); нативная ~/health застыла на 29.09, там #452 нет.
      #   Окно 27.09 03:00 → 04.10 03:00 НЕ чистое (yaml.safe_load по коммитам, не текст):
      #   6280c87 27.09 10:09 — gate_params.d_perm_exact: true, version 11→12;
      #   241d8ed 28.09 08:58 — +4 algorithmic_derived_pairs. Без смысла: 37333d8, 2adc7eb, 1581ac2,
      #   3a0b9ca (только текст provenance). После 29.09 yaml не менялся; blob 5bafa86 = образ контейнера.
      #   Правки после взгляда на результат с 23.09 — вердикт по пп. (1)/(2)/(3)/(4):
      #   · 40f13e7 24.09 (+3 пары трекера): да/да/да/да — замыкание {steps, distance_km, active_kcal,
      #     total_kcal} полное, 6 пар из 6. Оговорка к п.2: после dd66efb пары [distance_km, *] стоят под
      #     строкой «v9 — объявлено ДО прогона»; пометка «после взгляда» в тексте сейчас читается как
      #     относящаяся к одной паре из трёх. Законное исключение.
      #   · 7e6702d 25.09 (+14 пар Oura): да/да/НЕТ/да — замыкание неполное: входы × минуты дописаны
      #     только 28.09, и 241d8ed сам это признаёт («25.09 в закрытие попали только проценты»). Нарушение.
      #   · 6280c87 27.09 (семья D: точный перебор, v12): нет/да/—/НЕТ — параметр теста сдвинут после
      #     взгляда на исход (решение владельца; pass-set тот же). По букве критерия — нарушение.
      #   · 241d8ed 28.09 (+4 пары Oura): да/да/под вопросом/да — входы (hrv, resting_hr) ×
      #     resilience_stress_pct в реестре по-прежнему нет; полнота модуля не доказана.
      #   Развилка критерия к следующей сверке (решает владелец, не агент): «нарушение → окно заново с
      #   его даты» против «каждая правка после результата — законное исключение». Буквально вторая
      #   часть не даёт закрыть никогда из-за 7e6702d/6280c87; при чтении «нарушение = перезапуск окна»
      #   закрытие возможно после чистого цикла.
      # сверка 04.10: не закрыт — в цикле 27.09→04.10 две смысловые правки (6280c87, 241d8ed), нарушения по
      #   п.3 (7e6702d) и п.4 (6280c87), следующая возможная дата 11.10 (цикл 04.10 03:00 → 11.10 03:00)
      check:
        file: correlation_gate.py
        present: ["import signal_family", "_sf.FDR_Q", "_sf.DERIVED_KNOWN", "_sf.PAIR_MIN_OVERLAP"]
        absent: ["FDR_Q = 0.10", "KNOWN_DERIVED = {", "mm.sum() < 30"]
      warm_guard:
        absent: ["семья подстраивается под результат", "лаги не подаются в веру", "лаги ждут валидации harness"]
        absent_en: ["family is tuned to the result", "lags are not fed into belief", "lags await harness validation"]
    - id: fdr_family_complete
      claim: "FDR-семья = ВСЕ non-derived жизнеспособные пары (≥30 overlap): p считается для всей семьи (R2 — скрин p<0.05 убран), а derived-композиты исключены из знаменателя (Ф3, вердикт §6). BY-знаменатель = m non-derived (2026-07-13). Усечение семьи скрином ИЛИ включением derived искажало бы порог."
      status: holds
      check:
        file: correlation_gate.py
        present: ["a not in R or b not in R", "fam = tested & (~df"]
        absent: ['r.get("significant")']
      warm_guard:
        absent: ["гейт тестирует только значимые", "скрин по p<0.05 усекает семью"]
        absent_en: ["gate tests only significant", "p<0.05 screen truncates the family"]
    # ── Контракты, построенные по внешнему аудиту 2026-07-26 (Ш1–Ш4 ремонта) ──
    - id: failure_never_publishes
      claim: "Отказ гейта НЕ публикует веру: при исключении саммари не строится и строка в agent_reports не появляется, а отказ становится событием (квитанция прогона + датчик). То же для отказа НОСИТЕЛЯ карантина: нечитаемый снимок pass-set = отказ прогона, а не «прибытий не было» (ревью R3). Квитанция пишется ПОСЛЕ фактической записи веры, и `published` означает «вера записана», а не «разрешено писать». Прошлая вера остаётся, но читатели показывают её возраст и факт упавшего прогона. До 2026-07-26 было наоборот: исключение → legacy-отбор strong&significant → сырая корреляция в конституциях (P1-01)."
      # Границы ДОКАЗАННОГО — поле, а не проза: генератор тёплой страницы читает `limits`
      # и обязан назвать каждую. Заведено 2026-07-28 после того, как оговорка внутри claim
      # была пересказана им как усиление, а оговорка в комментарии не видна вовсе.
      limits:
        - "Проверен исполнением на живом каноне ОДИН сценарий отказа — исключение внутри гейта (проба plans/probe_failure_never_publishes_2026-07-27.py, 8 оракулов из 8, воспроизведена дважды)."
        - "Отказ носителя карантина и падение записи веры проверены только на фикстурах, а не на живом пути."

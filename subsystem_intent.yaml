    - id: coverage_claim_checked
      claim: "Решение «не берём: … покрыто: <колонка>» проверяется данными: если в дни прихода метрики колонка пуста, вердикт — unowned, а не tracked (тест test_decision_with_false_coverage_claim_is_unowned)."
      status: holds
      check:

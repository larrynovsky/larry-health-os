    - id: judge_is_watched
      claim: "Слепота самого судьи — тоже крик: если реестр последний раз видел данные раньше, чем за 3 дня до новейшего файла сырого архива, датчик check_hae_arrivals_have_owner пишет «реестр HAE слеп к приходу» (устаревший путь приёма; негативный контроль M2, покраснела 26.09)."
      status: holds
      check:
        file: integrity_tests.py
        present: ["реестр HAE слеп к приходу"]
    - id: empty_column_means_no_device
      claim: "Пустая колонка семейства сигналов считается «прибора нет» (молчание датчика check_family_names_resolve) только если её источник не приходил ни в одном файле сырого архива, включая сжатые; пришёл, а колонка пуста, — потеря (тесты test_empty_column_without_device_is_silent и test_empty_column_whose_source_arrives_is_loss). ГРАНИЦА: правило верно на глубину архива — поэтому архив сжимается, а не удаляется (log_rotation.raw_archive_compressed_not_deleted)."

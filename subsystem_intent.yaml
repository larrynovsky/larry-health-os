- id: constitutions
  title: "Конституции: правила эксплуатации именно твоего организма"
  intent: >
    Личная норма описывает тебя статистикой, но не объясняет. Конституции — по одной на домен
    (сон, питание, стресс, нервная система, движение) — пишет мощная модель из связки геном +
    твои долгосрочные корреляции + клинические периоды: не «норма шагов 8000», а нарративное
    «твой верхний порог по шагам без разгрузки — N, и вот почему именно у тебя». Два
    предохранителя: нет генома по домену — генерация пропускается (пустой геном не рождает
    уверенную конституцию); нет истории — генерит на геноме с явной пометкой, запрещающей
    выдумывать тренды по несуществующим данным. Конституция — УСТРОЙСТВО, а не состояние
    (решение владельца 2026-09-25): в неё входит только то, у чего значимое следствие держится
    не меньше года; мерится срок следствия, а не длительность события (операция — день, её след
    — годы). Недели, поездки, текущие протоколы, свежие анализы — дом месячного отчёта.
  explanation: docs/explanation/constitutions.md
  code_anchors:
    - generate_constitutions.py::_generate_one
    - generate_constitutions.py::_metrics_or_sparse_note
    - constitutions_db.py::upsert_constitution
  invariants:
    - id: no_genome_no_constitution
      claim: "Нет SNP-данных по домену → генерация домена пропускается (return пусто): пустой геном не рождает пустую уверенную конституцию."
      status: holds
      check:
        file: generate_constitutions.py
        present: ["snp_total == 0", "пропускаем генерацию"]
    - id: no_fabricated_trends_when_sparse
      claim: "Нет долгосрочных метрик → генерит на геноме с явной пометкой, запрещающей LLM выдумывать тренды по несуществующей истории (та же дисциплина, что в утреннем отчёте)."
      status: holds
      check:
        file: generate_constitutions.py
        present: ["_SPARSE_METRICS_NOTE", "выдумывать тренды"]
    - id: db_as_source
      claim: "Источник конституций для потребителей — таблица БД (constitutions_db); markdown в constitutions/ и iCloud — производные зеркала."
      status: holds
      check:
        file: constitutions_db.py
        present: ["upsert_constitution", "get_constitution"]
    - id: narrative_not_outcome_validated_open
      claim: "Конституция — нарративная интерпретация мощной моделью (с дисциплиной против выдуманных трендов), но она не заверена исходом, а по замыслу питает персональные пороги тревог. Надёжность связки «нарратив → порог» не подтверждена."
      # open (4-я колонка): нарратив модели не валидирован против исходов; при этом
      # по замыслу кормит пороги. Дисциплина против выдумки есть — доказательства верности нет.
      status: open
      closes_when: "связка «нарратив → порог» заверена исходом хотя бы на одном пороге: предсказание записано ДО периода, сверено ПОСЛЕ"
      closes_when_by: claude
      warm_guard:
        absent: ["конституции проверены исходом", "пороги гарантированно верны", "нарратив заведомо точен"]
        absent_en: ["constitutions are validated by outcome", "thresholds are guaranteed correct", "narrative is known to be accurate"]
    - id: rebuild_only_on_new_inputs
      claim: "Конституции пересобираются только при новых вводных (решение владельца 2026-09-25: «пересборка нужна, если есть основания; дальше только по триггерам»). Недельное расписание (launchd com.larry.health.constitutions и .partner, вс 05:30/05:50) зовёт generate_constitutions --if-changed: отпечаток вводных (связи в вере, фазы в горизонте, лабораторные РЯДЫ длиной от горизонта, полные годы тренда, мед-периоды, объём генома; дрейф средних и отдельный новый забор — НЕ вводная, с 2026-09-25) хранится в system_config (constitutions.inputs_fp); совпал — пересборки нет, пишется только пульс constitutions.trigger_checked_at. Пульс старше TRIGGER_STALE_DAYS (8 дн.) краснит check_constitutions_trigger_alive в ночной целостности (негативный контроль исполнен 25.09, мутант 3/3)."
      # Заведено 2026-09-25 (нить family-criterion) по парку снимка document-intake@2026-09-25-08c3845 §3 в.2:
      # обещание существовало в коде и в решении владельца, но реестр о нём молчал. open — штатный
      # прогон по расписанию ещё не наблюдался ни разу (первый — вс 27.09 05:30).
      status: open
      closes_when: "два штатных воскресных прогона подряд у обоих тенантов наблюдены чтением Studio: пульс trigger_checked_at обновлён; при том же отпечатке generated_at конституций не сдвинулся, при новом — пересборка и новый inputs_fp"
      closes_when_by: claude
      check:
        file: generate_constitutions.py
        present: ["--if-changed", "FP_KEY = \"constitutions.inputs_fp\"", "CHECKED_KEY = \"constitutions.trigger_checked_at\""]
      warm_guard:
        absent: ["конституции пересобираются каждую неделю", "пересборка по расписанию без проверки"]
        absent_en: ["constitutions are rebuilt every week", "scheduled rebuild without a check"]
    - id: horizon_year_or_longer
      claim: "В промпт конституции идут только вводные длиной от горизонта (system_config constitutions.horizon_days, seed 365): геном, клиническая история, фазы longitudinal без поездок и без фаз короче горизонта, задевающих последний год (phase_in_horizon), годовой тренд без текущего неполного года, лабораторные ряды ≥3 точек длиной от горизонта (build_lab_history_context(horizon_days)), связи в вере. НЕ идут: самоотчёт — заметки чата (reasoning_block) и опросники (lab_results.source instrument:*; решение владельца 2026-09-27: субъективное в конституцию не идёт), recovery_vs_baseline (его current — 90 дней), текущие значения и разовые заборы, спец-панели. Вывод модели судит recent_mentions (дата моложе горизонта, срок вперёд в горизонте, фразы «за последние N дней/на прошлой неделе»): нарушение → одна попытка исправить → не сохраняется, отпечаток и пульс не пишутся."
      limits:
        - "Оракул вывода — поиск по форме: месяц без года («в сентябре»), относительное время другими словами («недавно», «с конца лета») и число вида дд.мм, прочитанное как дата, — вне его зрения или ложная тревога."
        - "Самоописание из чата (например, «утром я всегда бодрый») конституция не видит — не предел, а правило владельца 2026-09-27 (субъективное не идёт); прежняя рамка «потеря» (BL-CONST-SELF-1) снята."
      # Заведено 2026-09-25 (нить constitution-horizon) по решению владельца: «конституция — текст
      # о моём устройстве, инструкция по эксплуатации… всё, что имеет тренд на год и дольше» и
      # «речь о значимости последствий и сроке, а не о длительности события». Замер до правки:
      # 1–13 привязок к последним месяцам в каждой из 10 конституций обоих тенантов.
      # Мутации 25.09 (все покраснели): оракул немой → 10 красных; чат вернулся → 1; лаб без
      # горизонта → 1; сохранение после второго нарушения → 1.
      # ЗАКРЫТО 2026-09-26: пересборка 25.09 @1949127 (10/10 сохранены); перепроверка 26.09 на
      # Studio по БД обоих тенантов — recent_mentions пуст на всех 10; владелец 26.09: «я прочитал
      # конституции, все отлично».
      status: holds
      closes_when: "конституции обоих тенантов пересобраны по новому правилу, recent_mentions пуст на каждом сохранённом тексте, и владелец, прочитав конституцию сна, подтвердил, что в ней устройство, а не конъюнктура"
      closes_when_by: owner  # критерий утверждён владельцем 2026-09-26: «Да по конституциям»
      check:
        file: generate_constitutions.py
        present: ["def recent_mentions", "def phase_in_horizon", "horizon_days=horizon_days()", "НЕ сохраняю"]
        absent: ["reasoning_block())", "Восстановление vs pre-illness baseline"]
      warm_guard:
        absent: ["конституция учитывает свежие заметки", "заметки из диалогов"]
        absent_en: ["constitution takes recent notes into account", "notes from conversations"]
  sentinel: tests/consistency/test_intent_validation_gate.py
  last_reconciled: "2026-07-10"


- id: multitenancy
  title: "Многопользовательность: изоляция тенантов"
  intent: >
    Один репозиторий обслуживает больше одного пациента (владелец и партнёр), но у каждого —
    своя база и свои секреты. Несущее правило: ни один процесс в мультитенантном режиме не
    берёт данные или секреты «по умолчанию» — либо явно указан тенант, либо громкий отказ.
    Уже был обрыв: нотификаторы хардкодили секреты, и гипотезы партнёра ушли владельцу. Отсюда
    fail-closed на секретах, громкий отказ на данных и датчик, ищущий просочившийся след одного
    тенанта в базе другого. Утечка между пациентами здесь — худшее, что может случиться.
    Названная граница (решение владельца 24.09, нить document-intake): путь к файлу, присланный
    боту, читается с правами пользователя машины — бот партнёра может взять и файл владельца.
    Изоляция тенантов стоит на данных и секретах, а не на файловой системе машины; люди одной
    машины доверяют друг другу («если работает, значит я ему доверяю»). См. document_intake.
  explanation: docs/explanation/multitenancy.md
  code_anchors:
    - secrets_paths.py::secrets_dir
    - health_db.py::_resolve_health_dir

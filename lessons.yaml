# жанр: справочник. Единственный дом извлечённых уроков health_scripts.
# До 28.09.2026 — project_context.json::corpus (C-01…C-86, только «ложный путь» и модули).
# Переезд — нить lessons-home: у каждой записи появились причина в устройстве, адрес,
# исход, цена и улика. Формат и страж — project_context/lessons.py (общий движок для
# health_scripts и два соседних проекта); справка — docs/reference/lessons_format.md.
#
# ЧЕСТНОСТЬ ПЕРЕНОСА. C-01…C-24 заведены 22.07 без разбора (коммит b00a94c): у них был
# только текст ложного пути. Причина у таких записей помечена «[восстановлено]» — она
# выведена из текста самой записи при переезде, а не взята из разбора; стоимость, которой
# в источнике не было, так и названа. У C-25 и позже причина, исход и цена взяты из текста
# записи и из коммита, который её завёл (evidence: git:<sha>).
#
# ПОДАЧА. preflight печатает записи с полем modules при любом статусе — ровно так, как
# печатал corpus (подача не ослабла от переезда). `lessons --subject` на старте работы
# подаёт статусы из deliver_statuses (ниже).
#
# status: observation — копится · in_work — заведена задача на изменение
#         adopted — изменение сделано, есть change · failed — после adopted повторилось
#         confirmed — следующая работа с тем же предметом прошла без той же причины
schema_version: 1

# Вид адреса отвечает на «что именно менять».
address_kinds: [runtime, registry_rule, ritual, data, methodology_page]
# С 29.09 подаются и наблюдения: 47 из 83 уроков были observation и до исполнителя на
# старте не доезжали вовсе (решение 29.09, нить lessons-adopted-on; так же в соседнем проекте).
# Цена — длина подачи: у крупных предметов до ~20 строк.
deliver_statuses: [observation, in_work, adopted, failed]
# У каждого внедрённого урока — дата внедрения. Урок той же группы (адрес + предмет),
# записанный позже неё, красит проверку формы: правило не сработало → failed.
# Уроки, внедрённые до 28.09, датированы днём переноса корпуса — это верхняя граница,
# а не день внедрения: повтор между настоящим внедрением и 28.09 сигнал пропустит.
adoption_dates: required

subjects:
  dead_code: признание кода мёртвым — читатели имени, формы вызова, каналы без отправителя
  writers_readers: писатели и читатели данных — провенанс, второй писатель, аудитория поля
  hypothesis_before_fact: утверждение или гипотеза, высказанные до замера фактом
  existing_home: уже существующий дом знания, словаря, писателя или функции
  context_horizon: давность и горизонт контекста, который получает рассуждатель
  duplicate_data: дубли, дедуп и слияние данных — что теряется, что двоится
  contract_change: смена контракта или канала — все вызывающие, формы и старые читатели
  sensor_perimeter: периметр датчика или сторожа — слепые зоны, положительный контроль
  pipeline_order: порядок стадий конвейера
  vendor_data: данные поставщика (Apple Health, HAE, Oura) — замер вместо документации
  classifier_rules: словари и правила классификаторов
  concurrency: асинхронность, потоки, ограничители
  filesystem_icloud: файловая система, iCloud, границы контейнеров, вытеснение
  git_hooks: хуки git — события, биты исполнения, доставка через хук
  test_stand: стенд теста против боевого состояния, мутации, среда полного прогона
  shell_scripts: ловушки bash и shell
  intent_registry: реестр замысла, yaml, критерии закрытия, промпты задач
  run_version: на какой версии шёл прогон
  time_dates: даты, пояса, ритм задач
  pii: личные данные в публичной зоне и стражи против них
  measurement_path: замер тем путём, которым ходит потребитель
  ocr: распознавание документов
  message_delivery: доставка сообщений владельцу
  tenant: тенанты и значения, снятые с одного человека
  state_lifetime: жизнь состояния в памяти процесса
  secrets: секреты и их отправители
  probes: пробы вне pytest
  agent_delegation: задания другим агентам-исполнителям
  llm_output: ответы модели — обрезка, разметка, разбор


      claim: "Сомнение судьи (verdict=unsure) разрешается СОДЕРЖАТЕЛЬНЫМ вопросом человеку — «состоялось ли», «появились ли симптомы», — а не молчанием и не слепым действием: формулировка-действие заменяется вопросом судьи. Молчание остаётся только при полном отказе судьи: сбой ≠ сомнение."
      status: holds

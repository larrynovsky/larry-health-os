      # новый читатель gp_context.annotate_lab_recency (пришёл с 5a8cb3d, нить советов
      # по задачам) не объявлял границу и не был назван в _ACCEPTED. Это ПРАВИЛЬНЫЙ
      # красный: храповик поймал чужую правку, а не свою поломку. Читатель назван с

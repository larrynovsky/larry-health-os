      closes_when: "классификация поведенческое↔медицинское проверена ИСПОЛНЕНИЕМ на наборе пограничных случаев, собранном НЕ по прошлым промахам, и мисроута медицинского не было"
      closes_when_by: claude
      warm_guard:
        absent: ["всё медицинское уходит врачу", "медицинское гарантированно к врачу", "ничего не обойдёт врача"]
        absent_en: ["everything medical goes to the doctor", "medical is guaranteed to reach the doctor", "nothing bypasses the doctor"]
  sentinel: tests/consistency/test_intent_validation_gate.py
  last_reconciled: "2026-07-10"


- id: patient_answer_channel
  title: "Канал «вопрос → ответ»: система спрашивает человека и слышит ответ"
  intent: >
    Зеркало doctor_in_loop: там входом возвращается ответ врача, здесь — ответ пациента. Система
    умеет задавать вопросы: состоялось ли назначенное, о чём договорились с врачом, что изменилось в
    самочувствии. Напоминание, закрываемое галочкой, не несёт текста ответа. Такой отказ невидим
    снаружи: список задач может пустеть без доставки слов пациента врачу. Поэтому у вопроса
    отдельный носитель — сообщение бота с обратным адресом; закрыть вопрос может только текст; текст
    возвращается ВХОДОМ — в контекст врача и в память. Поле ответа обязано иметь читателя в
    клиническом контуре.
  explanation: docs/explanation/patient_answer_channel.md
  code_anchors:
    # health_db.py::question_answer_gate_ddl намеренно НЕ якорь: гейт живёт там
    # физически (миграция), но якорь на инфра-модуль раздувает подсистему до
    # полурепозитория — preflight сразу сказал «инфра-seed, подсистема широкая».
    # Сам гейт стережётся маркером в invariants[answer_or_nothing].check.
    - task_agent.py::record_answer
    - task_agent.py::should_ask_again
    - task_agent.py::promote_memory_questions
    - tasks_db.py::get_questions_needing_delivery
  invariants:
    - id: answer_or_nothing
      claim: "Вопрос нельзя закрыть без текста ответа: переход состояния охраняет САМА база (триггер RAISE(ABORT)) — писателей у задачи трое (бот, дашборд, синхронизация Reminders), и проверка внутри одного не стережёт остальных."
      status: holds
      check:
        file: health_db.py
        present: ["question_answer_gate_ddl", "RAISE(ABORT"]
    - id: delivery_has_return_address
      claim: "Доставленным считается вопрос, у которого есть обратный адрес (tg_message_id), а не отметка отправки: помеченная отправленной задача без адреса остаётся немой — человек видит её в списке и не может ответить."
      status: holds
      check:
        file: tasks_db.py

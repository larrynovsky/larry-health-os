        present: ["MULTITENANT-GUARD", "HEALTH_MULTITENANT"]
    - id: origin_predicate_not_in_secrets_resolve
      claim: "Предикат происхождения данных is_owner_data отвечает ТОЛЬКО на «чьи это данные» и не участвует в резолве секретов: ответ о происхождении никогда не открывает доступ к чужим токенам. «Чьи данные» и «чьи права» — разные вопросы, разделённые 9e98d8d (2026-08-12); их слияние и было классом инцидента «гипотезы партнёра ушли владельцу»."
      # 2026-08-13: инвариант добавлен решением владельца (сессия validation-gate-repair):
      # предикат живёт в secrets_paths — модуле, несущем границу изоляции, — и до этого
      # дня реестр про него молчал: правило держалось, но нигде не было обещано, и
      # следующий автор правки модуля узнал бы о границе только от тестов.
      status: holds
      verified_at: "2026-08-12"
      verified_on: "staging"
      check:
        file: secrets_paths.py
        present: ["is_owner_data", "DEV_CLONE_MARKERS"]
    - id: cross_tenant_sensor

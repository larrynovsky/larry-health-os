      # 2026-07-30: заверитель заменён с грепа на ПОВЕДЕНЧЕСКИЙ тест ОБЁРТКИ. Замер У-1:
      # датчик заставили замолчать, и не покраснело ничто — при четырёх честных зелёных
      # тестах в собственном файле. Разбор: все четыре проверяли ЧИСТУЮ ФУНКЦИЮ
      # `scan_cross_tenant`, а немым делали ОБЁРТКУ, у которой три тихих выхода
      # (предикат дев-клона · пустые siblings · hits is None → WARN). Закономерность У-1
      # в чистом виде: чистая функция защищена, ГРАНИЦА между слоями — нет.
      # Негативный контроль ИСПОЛНЕН (plans/verify_hollow_promises_2026-07-30.py,
      # M-03/M-04/M-05, staging, 2026-07-30) — краснеет каждый из трёх выходов.
      # Граница: доказано, что датчик умеет сработать и ДОНОСИТ отказ (AssertionError →
      # FAIL → триаж). НЕ доказано, что CROSS_TENANT_FP — достаточный признак утечки;
      # это tacit-суждение владельца, и при неверном признаке мутации краснеют штатно.

    - id: assessment_zero_score_is_failure
      claim: "Опросник (путь assessment_dialog → assessment_importer) с ответами, из которых не посчиталось ни одной субшкалы, — ОТКАЗ, а не «заполнено»: импорт возвращает False, сессия получает статус import_failed, задача остаётся открытой, человеку честный ответ, ночной check_assessments_freshness предупреждает. До 27.09 такой импорт закрывал сессию и задачу как успешные — баллов не было, и никто этого не видел (майский дрейф ключей ответов). Записано по слову владельца 27.09 (BL-BOTDEC-1, путь опросников был вне реестра)."
      status: holds

# Зоны публикации — ЕДИНСТВЕННЫЙ дом списка «что не едет в открытый репозиторий».
#
# Решение владельца 2026-09-23: проект когда-нибудь откроется на GitHub новым чистым
# репозиторием — экспортом публичной зоны одним первым коммитом. История git и всё,
# что перечислено ниже, остаются у владельца.
#
# Читатели: pii_census.py (перепись и pre-commit-гейт: приватное не судится) и будущий
# скрипт экспорта (приватное не копируется). Второй копии этого списка быть не должно.
#
# Всё, что не перечислено, — ПУБЛИЧНОЕ и судится гейтом. Добавить путь сюда — значит
# сказать «это личное по сути и не будет опубликовано», а не «не хочу чистить»:
# причина обязательна, и она читается глазами при ревью экспорта.
# Синтаксис glob — fnmatch: «*» захватывает и «/».
private:
  - glob: "CLAUDE.md"
    why: свод правил работы агентов в этом репозитории — внутренняя кухня владельца, не документация продукта (решение владельца 28.09)
  - glob: "docs/how-to/recover_studio_filevault*"
    why: восстановление доступа к машине владельца (его инфраструктура, не продукт; решение владельца 29.09)
  - glob: "docs/how-to/agent_bridge_codex*"
    why: переписка агентов владельца (Cowork ↔ Codex) — его рабочая кухня (решение владельца 29.09)
  - glob: "docs/how-to/multi_session_protocol*"
    why: протокол нескольких чатов Claude на машине владельца — его рабочая кухня (решение владельца 29.09)
  - glob: "private/*"
    why: словарь и долг самого гейта — сам словарь состоит из личных данных
  - glob: "docs/handoff/*"
    why: журнал сессий — записки между сессиями, датированные снимки
  - glob: "plans/*"
    why: рабочие планы — история, не документация продукта
  - glob: "contracts/plans/*"
    why: сайдкары проб из plans/ — едут вместе со своими файлами
  - glob: "plan_*.md"
    why: датированные разовые планы в корне — история, как plans/
  - glob: "CHANGELOG.md"
    why: журнал изменений, append-only
  - glob: "BACKLOG.md"
    why: живой долг владельца, пишется в рабочем порядке
  - glob: "BACKLOG_ARCHIVE.md"
    why: закрытый долг, журнал
  - glob: "ROADMAP.md"
    why: планы владельца
  - glob: "SECURITY_AUDIT_LOG.md"
    why: журнал аудитов безопасности
  - glob: "launchd/*"
    why: конфиги развёртывания машин владельца (пути, таймзона, окружения тенантов); публичный проект получит шаблоны
  - glob: "*.plist"
    why: то же — плисты launchd владельца в корне репозитория
  - glob: "tests/reports/*"
    why: артефакты прогонов (хосты, пути машины)
  - glob: "methodology/repertoire.json"
    why: личный кулинарный репертуар владельца — данные тенанта, не код
  - glob: "methodology/taste_profile.json"
    why: "личный вкусовой профиль владельца (извлечён из его PDF, user_id и имя внутри) — тот же класс, что repertoire.json; найдено 2026-09-25 (нить genotype-scrub). Без файла вкусовой слой нейтрален (taste.load_taste)"
  - glob: "methodology/taste_bridge.json"
    why: "мост keyword→вердикт, выведенный из его вкусового профиля (его запреты и любимое) — тот же класс"
  - glob: "methodology/taste_profile_calibrations.md"
    why: "ответы владельца о его вкусе (калибровка сессии 2026-07-15) — тот же класс"
  - glob: "data/norm_docs/physician_*"
    why: решения лечащего врача владельцу — дословные документы, данные тенанта
  - glob: "data/norm_docs/stratified_targets.json"
    why: машинная форма решения врача (парная к physician_*), данные тенанта
  - glob: "data/norm_docs/eflm_*"
    why: "ЛИЦЕНЗИЯ ЗАПРЕЩАЕТ: условия EFLM BV Database (biologicalvariation.eu/disclaimer, прочитано 2026-09-23) — «You may not, except with our express written permission, distribute… You cannot… store it in any other website». Публичная установка тянет данные из API сама или получает письменное разрешение EFLM"
  - glob: "data/norm_docs/ctcae_v*.xlsx"
    why: "документ NCI с кодами MedDRA — установка скачивает сам (norm_documents.fetch_ctcae, решение владельца 2026-09-25)"
  - glob: "data/norm_docs/ctcae_lab_v*.json"
    why: "ЛИЦЕНЗИЯ НЕ ПРОВЕРЕНА ДО КОНЦА: текст NCI свободен от копирайта (cancer.gov/policies/copyright-reuse), но файлы несут коды MedDRA (v5: колонка MedDRA Code), а MedDRA лицензирует ICH/MSSO. До проверки публичная установка скачивает CTCAE у NCI сама (URL — в norm_documents)"
  - glob: "methodology/clinical_kb/*"
    why: "онко-контур тенанта (классы состояний его диагноза, генотипы) — решение владельца 2026-09-23: публичный код не выдаёт диагноз публикатора; публичная установка приносит свой свод"
  - glob: "data/norm_docs/schedules.json"
    why: "кадансы и утверждения гайдлайнов по эпизодам лечения тенанта (id его эпизодов) — онко-контур, решение владельца 2026-09-23"
  - glob: "data/norm_docs/documents_tenant.json"
    why: "реестр документов тенанта (гайдлайны его диагноза, решения его врача) — то же решение"
  - glob: "methodology/validation_gate/data_manifest.yaml"
    why: "пререгистрация N=1-исследования владельца: даты его лечения как эпохи — личная медицинская хронология"
  - glob: "methodology/validation_gate/synthetic_spec.yaml"
    why: "длины его терапевтических эпох в спецификации синтетики — та же хронология, числом дней"
  - glob: "methodology/food_rules.yaml"
    why: "пол безопасности питания — правила, выписанные под состояния владельца (оракул — владелец); публичная установка приносит свой"
  - glob: "methodology/regimens.yaml"
    why: "синонимы схем лечения тенанта — набор схем выдаёт диагноз; решение владельца 2026-09-23"
  - glob: "docs/explanation/survivorship_extension_plan.md"
    why: "план расширения, написанный по истории лечения владельца — история, не документация продукта"
  - glob: "docs/explanation/survivorship_preflight.md"
    why: "разведка перед постройкой по данным владельца — история"
  - glob: "docs/DIATAXIS_WORKPLAN_V2.md"

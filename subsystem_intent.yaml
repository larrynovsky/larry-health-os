      # 2026-10-05 (нить digest-tails): claim переписан по слову владельца. Было «КАЖДЫЙ тенантский
      # процесс дал pass; отсутствие вердикта — ожидание». После переезда владельца в контейнер
      # expected_tags каждого рантайма видит только себя, и «каждый» молча стало «я». Восстановлено
      # механизмом: verdicts() читает все вердикт-файлы общей папки (digest-container b257c89), тест
      # test_чужой_блок_из_общей_папки_блокирует_и_того_кто_видит_только_себя. Не восстановлено и не
      # будет по решению владельца: ожидание соседа без файла. Цена названа: упавший сутки бот соседа

        present: ["_scan_unsafe_senders", "test_scan_positive_control", "ADMIN_GLOBAL_TG_ALLOW"]
      warm_guard:
        absent: ["каждый канал доставки тенант-безопасен", "утечка между тенантами невозможна", "все каналы доставки покрыты"]
        absent_en: ["every delivery channel is tenant-safe", "leakage between tenants is impossible", "all delivery channels are covered"]
    - id: shared_text_gate_fail_closed

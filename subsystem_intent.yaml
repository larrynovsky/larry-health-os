      status: holds
      check:
        file: getting_started.py
        present: ["SOURCE_STALE_DAYS", "BAND_MIN_OBS", "MIN_OVERLAP_DAYS", "def board"]
  sentinel: tests/consistency/test_intent_validation_gate.py
  last_reconciled: "2026-07-18"


- id: hypothesis_experiment
  title: "Гипотеза как эксперимент, а не реплика в чате"
  intent: >
    Врач ответил, гипотеза подтвердилась — и растворилась бы, будь она сообщением в переписке.
    Поэтому гипотеза живёт как запись со статусом и историей: рождается по устойчивой аномалии,
    подтверждённая не закрывается, а рождает протокол и ждёт следующих данных; правки версионно-
    безопасны; семантический дедуп не даёт одной метрике плодить две открытые гипотезы. На вопрос
    «что открыто и ждёт данных» ты получаешь список, а не пересказ чата.
  explanation: docs/explanation/hypothesis_experiment.md
  code_anchors:
    - hypotheses_db.py::save_hypothesis_outcome
    - hypotheses_db.py::get_hypotheses_awaiting_evaluation
    - hypothesis_semantic_check.py::_collect_candidates
    - jobs/scheduled.py::deliver_unsent_outcomes
    - hypothesis_resolution.py::run_consilium_and_resolve
    - dashboard_routers/api_status_actions.py::_spawn_eval
  invariants:
    - id: status_record_not_chat
      claim: "Гипотеза — запись со статусом и исходом (hypothesis_outcomes), а не реплика в чате: «что открыто и ждёт данных» — это список (status='testing' без outcome), а не пересказ переписки."
      status: holds
      check:
        file: hypotheses_db.py
        present: ["save_hypothesis_outcome", "hypothesis_outcomes", "testing"]
    - id: semantic_dedup
      claim: "Семантический дедуп не даёт одной метрике плодить две открытые гипотезы; он status-aware — учитывает уже подтверждённые/отклонённые."
      status: holds
      check:
        file: hypothesis_semantic_check.py
        present: ["дедупликация", "semantic_dedup", "status"]
    - id: drift_birth_defunct
      claim: "СУТОЧНЫЙ канал рождения гипотез из дрейфа выключен осознанно (defunct, gen disabled: суточные колебания = шум, не повод для гипотезы). Дрейф МЕТРИК не игнорируется: detect_metric_drift — structured input МЕСЯЧНОГО консилиума (monthly_consilium Round A), где гипотезы рождаются раз в месяц. Дрейф КОРРЕЛЯЦИЙ из входа консилиума убран 2026-09-03: корреляции туда идут только из принятой веры (belief_contract), сырой Spearman дрейфа — второй негейченный производитель r. Уточнение записано по слову владельца 27.09 (BL-BOTDEC-1)."
      status: holds
      check:
        file: hai_hypotheses.py
        present: ["defunct", "gen disabled"]
      warm_guard:
        absent: ["суточный дрейф рождает гипотезу", "дрейф рождает гипотезу ежедневно", "дрейф рождает гипотезу немедленно"]
        absent_en: ["daily drift creates a hypothesis", "drift creates a hypothesis every day", "drift creates a hypothesis immediately"]
    - id: result_reaches_owner
      claim: "Заключение консилиума доходит до человека читателем, чей жизненный цикл НЕ зависит от запросившего: outbox hypothesis_outcomes.sent_at читается job'ом бота каждые 5 мин (не только на старте), а карточка дашборда не держит HTTP-запрос дольше готовности результата — замок eval_started_at в payload + опрос карточки; сам консилиум идёт в ОТДЕЛЬНОМ процессе (hypothesis_resolution --eval), переживающем рестарт дашборда post-commit хуком. Урок 2026-08-29: девять консилиумов из дашборда отработали в пустоту, потому что оба канала (ответ на 170-секундный запрос, outbox только-на-старте) зависели от того, кто ещё жив в момент готовности. Живая приёмка 2026-08-30 16:15–16:22 (Chrome, Studio): карточка «идёт» <1 с, второй клик отбит, F5 не теряет опрос, kickstart дашборда во время Раунда B не убил процесс, вердикт partial → v3 + задача #176, outbox доставил в Telegram через 4,5 мин (message_id в SEND_RECEIPT)."
      status: holds
      check:
        file: jobs/scheduled.py
        present: ["deliver_unsent_outcomes_job", "interval=300"]
  sentinel: tests/consistency/test_intent_validation_gate.py
  last_reconciled: "2026-08-30"

- id: proactivity
  title: "Проактивность: тренд, а не всплеск"
  intent: >
    Пассивная система полезна здоровому и любопытному; тебе нужна та, что приходит первой. Но
    проактивность рождает зеркальную беду: дёргать по каждому шороху — и через неделю ты отключишь
    уведомления вместе с сигналом. Поэтому система различает тренд и всплеск: базовая линия против
    текущего, тревога — по серии подряд, а не по одному провалу. И молчит, когда данных мало: на
    коротком окне многодневные тренды не описываются, чтобы не выдумать паттерн на пустоте.
  explanation: docs/explanation/proactivity.md
  code_anchors:
    - gp_context.py::_build_trends_block
    - gp_agent.py::_observation_window_note
    - gp_agent.py::generate_daily_report
  invariants:
    - id: trend_not_spike
      claim: "Тревога — по тренду (базовая линия vs текущее) и серии подряд (напр. стрессовые дни подряд), а не по одиночному всплеску: один провал не поднимает шум."
      status: holds
      check:
        file: gp_agent.py
        present: ["consecutive_stress", "подряд", "baseline"]
    - id: sparse_data_no_trends
      claim: "При недостатке данных (короче минимального окна ~7 дней) многодневные тренды НЕ описываются — дисциплина против выдуманного паттерна на скудной истории."
      status: holds
      check:
        file: gp_agent.py
        present: ["минимальное окно", "многодневные тренды"]
    - id: alert_tuning_not_validated_open
      claim: "Пороги и длины серий — эмпирические константы (полы HRV/readiness/сна, серия 2–3 дня), настроены вручную и не заверены исходом. Баланс между шумом и пропуском — допущение, не доказанный оптимум."
      # open (4-я колонка): тюнинг тревог не валидирован против исходов; и над-, и
      # недо-алертинг возможны. Не выдаём подобранные константы за оптимальные.
      status: open
      closes_when: "доля ложных тревог и доля пропусков измерены на размеченном периоде, и владелец сказал, какой размен его устраивает"
      closes_when_by: claude
      warm_guard:
        absent: ["пороги оптимальны", "пороги доказаны", "баланс идеален"]
        absent_en: ["thresholds are optimal", "thresholds are proven", "balance is perfect"]
  sentinel: tests/consistency/test_intent_validation_gate.py
  last_reconciled: "2026-07-10"


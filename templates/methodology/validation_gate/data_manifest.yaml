# methodology/validation_gate/data_manifest.yaml — пререгистрация N=1-исследования (шаблон).
#
# Проверочный гейт судит связи в данных тенанта с поправкой на эпохи его жизни (лечение,
# переезды, смена режима). Эпохи и базовая суточная инерция метрик — ДАННЫЕ тенанта, их
# замораживают один раз, когда накопится хотя бы год ежедневных данных; до этого гейт
# работает без эпох, а лаб-путь выключен.
epochs: []                       # [{name, type, range: [YYYY-MM-DD, YYYY-MM-DD|null]}]
twin_baseline_core:
  baseline_acf: {}               # {метрика: {acf1: число}} — после заморозки базового окна
labs:
  scope: descoped_pending_data   # active | descoped_pending_data

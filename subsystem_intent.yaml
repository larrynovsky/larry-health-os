    - id: profile_threshold_calibrated_offline
      claim: "Пороги профиля по периодам (Gate 2 в словаре автора) выбираются на СИНТЕТИКЕ с известной правдой, а не на судимых данных: три контроля прогоняются через боевой вход гейта. С 2026-08-04 критерий ДВУХКОМПОНЕНТНЫЙ по спецификации автора («устойчивость ЗНАКА и величины»): медиана периодов ≥ r_min И доля согласного знака ≥ s_min (доля допущенных периодов, знак которых совпадает со знаком медианы; определение НАШЕ, у автора формулы нет). Авторитетная калибровка 2026-08-04 на 1000 повторах: при требовании РОВНО нуля ложных Negative двухкомпонентное правило даёт (r_min=0.225, s_min=1.0) с мощностью 40% против одной величины (r_min=0.425, мощность 13%) — знак утраивает мощность при том же нуле. При бюджете 2% ложных лучшая точка (r_min≈0.24, s_min≈0.7-0.8) даёт мощность 90%. Пороги ВКЛЮЧЕНЫ 2026-08-08 решением владельца («Global», подтверждено владельцем 2026-08-13): точка zero-false (r_min=0.225, s_min=1.0), дом gate2_profile в signal_family.yaml, применение correlation_gate._gate2_blocked, словарь gates.yaml. Выбор точки 2%-бюджета (мощность 90%) владельцем не взят — zero-false осознанно."
      # Tautological Control в выбор НЕ входит по построению — он предназначен детектору
      # подавления (Gate 0.5), и ужесточать пороги до его отсечения значило бы калибровать
      # один механизм под задачу другого. Его поведение измеряется отдельно.
      limits:
        - "ОПРЕДЕЛЕНИЕ ДОЛИ ЗНАКА — НАШЕ, у автора критерия формулы нет: доля допущенных периодов, знак r которых совпадает со знаком МЕДИАНЫ профиля; r=0 знака не несёт и не голосует. Это достройка под словесную спецификацию «знак и величина», а не цитата. Оракул согласия с намерением автора — человек (tacit), машинно не выводится."
        - "Проверка устойчивости знака не заменяет проверку происхождения показателей: часть-целое и алгоритмическая производная могут сохранять знак по периодам. Поэтому прохождение Gate 2 само по себе не доказывает содержательную связь; структурные зависимости должны отсекаться Gate 0 и Gate 0.5."
        - "Критерий «РОВНО ноль ложных Negative» — экстремальный квантиль, чувствителен к N повторов: при 100 повторах его разрешение 1% и точка казалась (0.275, s=0.7, мощность 84%); при авторитетных 1000 это артефакт грубой сетки, истинная точка при нуле ложных строже. Отчёт печатает ВСЮ границу (по каждому s_min — порог при 0% и при 2% бюджете), а не одну тай-брейкнутую точку."
        - "delta (Gate 3) и r_floor (Gate 4) не калибровались: механизмов не существует. Порог Gate 0.5 (0.80) автор зафиксировал жёстко и калибровке не подлежит."
      status: open
      closes_when: "проба калибровки исполняется носителем и даёт зелёный вердикт на всех трёх контролях"
      closes_when_by: claude
      # Статус open, но ПРИЧИНА сменилась 2026-08-14. Старая причина («пороги не включены —
      # результат замера, не решение») исчезла: включение решено владельцем 2026-08-08
      # («Global») и подтверждено 13.08. Флип в holds по слову владельца («Действуй» 14.08)
      # НЕ СОСТОЯЛСЯ: механизм holds потребовал живого носителя доказательства, и исполненный
      # self-test ОБЕИХ проб оказался красным (14.08, Studio: негативный контроль блокируется
      # Gate 1 до профиля — 0/30 против ожидания; оснастка писалась до включений 08.08 и с тех
      # пор не гонялась). Доказательство калибровки НЕ ВОСПРОИЗВОДИТСЯ на живом гейте → holds
      # был бы обещанием на гнилом носителе. Путь к holds: починить self-test проб (диагноз:
      # почему синтетический Negative перестал проходить Gate 1), включить их в носитель
      # run_probes.sh, переподтвердить. Границы доказанного — в limits, читаются при любом статусе.
      # Обе пробы калибровали пороги этого инварианта офлайн: two_component (2026-08-04)
      # сменяет ВЫВОД r_min (2026-08-01), но r_min остаётся валидным доказательством-
      # предшественником — его негативный контроль исполнен, и two_component воспроизводит
      # его порог как якорь s_min=0.5. Обе видны механизму полем, чтобы ни одна не «висла».
      probe:
        - "plans/probe_calibrate_two_component_2026-08-04.py"
        - "plans/probe_calibrate_rmin_2026-08-01.py"

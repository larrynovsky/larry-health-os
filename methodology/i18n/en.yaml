owner.card.wait: "the decision will wait for you and nothing will change"
owner.card.default: "the option “{choice}” will be applied on {on}"
owner.card.heldout: "About the system, not urgent. Earlier the system found links in your data (for example: \"after a bad night, heart-rate variability drops\"). Enough new data has built up to check whether these links really hold. What to do with the result?\n\nOptions:\n• Go through it with Claude — about 10 minutes; after that, report explanations use only the links that held up.\n• Put it off — reports may still mention links that didn't hold up.\nIf you don't reply — reports keep explaining things as before, and the check waits."
owner.card.lag: "About the system, not urgent. Delayed links were found: one thing affects another a day or two later (for example: \"bad sleep — lower heart-rate variability two days later\"). Should they be checked separately before reports mention them?\n\nOptions:\n• Check on new data first — such explanations will appear in reports later.\n• Mention them now with a note \"may be chance\" — sooner, but sometimes wrong.\nIf you don't reply — reports keep mentioning them as before."
owner.card.auto_repair: "About the system, not urgent; your health data is not affected. The same technical check has failed {nights} in a row. Should an automatic repair for such failures be built?\n\nOptions:\n• Build it — takes Claude's work and a safety review.\n• Leave it — Claude fixes each such failure separately.\nIf you don't reply — it stays as now: Claude fixes by hand."
owner.card.stalled: "About the system, not urgent. The work \"{work}\" has been stuck for {days}. Finish it or close it?\n\nOptions:\n• Finish — Claude returns to it in the next session.\n• Close — there will be no result, but it stops hanging.\nIf you don't reply — the work stays paused."
owner.card.stalled_older: "About the system, not urgent. More pieces of work stuck since earlier weeks: {count}. Go through them?\n\nOptions:\n• Go through them one by one with Claude — about 10 minutes.\n• Keep them paused.\nIf you don't reply — they stay paused."
owner.card.stalled_subject: "Which stuck pieces of work to finish and which to close? Claude shows the list when you write \"go through decisions\"."
owner.card.secret: "‼️ About the system, URGENT (within a day). A secret key — like a password to your account with a service — was found in text the system was about to send to an outside service. I stopped the sending. The key needs replacing: anyone who saw it could use the service in your name.\n\nOptions:\n• Replace it now — Claude will show where to click in the service settings (about 5 minutes); the old key stops working.\n• First find out where it may have leaked — but the risk stays until the key is replaced.\nIf you don't reply — sending stays stopped and the key stays the same."
owner.card.model_retired: "About the system, important. The AI service stopped supporting the model part of the bot runs on (for example, the morning report or hypothesis checks). Choose a replacement?\n\nOptions:\n• Pick a replacement — Claude tests a new model; cost and answer style may change a little.\n• Change nothing — the affected parts of the bot stop answering.\nIf you don't reply — there is no replacement and those parts stay silent."
owner.card.model_switched: "About the system, for your information. The AI service stopped serving the model {old}, so the system switched this part of the work to {new}, the next model on the checked list. Nothing to do."
owner.card.model_switched_back: "About the system, for your information. The model {new} is available again, and the system moved this part of the work back to it ({old} was covering in the meantime). Nothing to do."
owner.card.models_admitted: "About the system, for your information. New AI models were checked on the system's tasks. Passed and now on standby: {passed}. Did not pass: {failed}. Spent on checks this month: up to ${spent} of ${cap}. Nothing to do."
owner.card.intake: "About your health, not urgent. A new lab document arrived and the system read numbers from it. Check them against the original?\n\nOptions:\n• Check — Claude does it when you write \"go through decisions\"; the review page: {url}\n• Put it off — numbers from this document stay out of reports for now.\nIf you don't reply — they wait for the check."
owner.investigator.language: "owner_ask is written for a person with no programming skills; he does not open files or run commands. subject — one line: what exactly happened, concretely and from the evidence (what, how many, since when), no judgement and no framing. question opens with one sentence: whether this is about his health or about the system, and how urgent; then the question itself. Write only what the evidence shows: do not invent who acts (Claude does the work, he decides — there is nobody else), causes or deadlines; do not write \"it is unknown who or why\" — if the data can tell, finding out is Claude's job, not a question for him. Address him directly, no \"we\". A real-life example only when the notion cannot be understood without it, in one sentence; a comparison does not replace a fact. In each option's cost — what changes for him. Do not say what happens if he does not reply: the system adds that line. No file names, codes or English jargon."


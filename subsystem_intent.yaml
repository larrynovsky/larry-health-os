- id: project_context
  title: 'Анти-дубль и онбординг: discovery по данным + гейты'
  intent: >
    Агент в накопленном контексте строит уже построенное: вторую функцию тем же
    именем или ту же способность под другим. Способности заякорены на данные, а
    не на имена — поэтому существующее ищется ПО ДАННЫМ (capabilities: by_name +
    by_data), онбординг в замысел отдаётся pull'ом (project_intent: каталог →
    страница → код), а результат форсируется дубль-гейтом на коммите. Push-карта
    («агент читает дайджест — защищён») выкинута экспериментом 10/0 и не
    возвращается: принуждение и корпус работают, чтение карт — нет. Движок один
    на машину, проекты подключаются манифестом (health первый, соседний проект подключён).
  explanation: docs/explanation/project_context.md
  spec: docs/explanation/discovery_before_build.md
  code_anchors:
  - project_context/indexer.py::capabilities
  - project_context/dupgate.py::evaluate
  - project_context/mcp_server.py::intent_page
  - project_context/receipt.py::check
  - project_context/receipt.py::merge_credit
  - project_context/lessons.py::lesson_problems
  invariants:
  - id: dup_gate_wired
    claim: 'Дубль-гейт вшит в pre-commit: коммит, вводящий точный кросс-файл дубль
      имени, режется (exit 4); by-data кандидат — WARN, не блок. Только НОВЫЕ имена —
      легаси не красится.'
    status: holds
    check:
      file: scripts/git-hooks/pre-commit
      present:
      - '-m project_context dupgate --block'
      - '_dg_rc -eq 4'
  - id: discovery_by_data
    claim: 'Discovery ищет способность по ДАННЫМ (таблицы W/R), не только по имени:
      дубль под другим именем виден через таблицу; пустой результат несёт scope-пометку
      и не подаётся как отсутствие дублей.'
    status: holds
    check:
      file: project_context/indexer.py
      present:
      - by_data
      - Пустой результат
  - id: onboarding_pull_not_push
    claim: 'Онбординг — pull существующего: каталог реестра → тёплая страница
      байт-в-байт с диска → code_anchors; id — имя, не путь (traversal отвергается
      контрактом). Push-карта не возвращается.'
    status: holds
    check:
      file: project_context/mcp_server.py
      present:
      - intent_catalog
      - id не может быть путём
  - id: discovery_called_before_build
    claim: 'Агент реально зовёт discovery ДО постройки нового. Нефорсируемо (нет
      пре-тул хука в среде) — наблюдение RN-F идёт; форсируется только результат
      (гейт на коммите), привычка не доказана. ЗАМЕР 2026-09-14 на 51 дне журнала:
      из 27 коммитов, вводивших новый судимый .py, у 18 был вызов capabilities в
      сутки до коммита, у 9 — нет. Вердикт НЕ выносится ни в одну сторону, и
      причина сменилась: до 14.09 журнал вёл только MCP-канал, а CLI-вызов
      (python3 -m project_context capabilities) следа не оставлял вовсе — каждое
      «нет» неразличимо с «звали из терминала». Канал закрыт тем же числом;
      выводимость вердикта появится на накопленном ПОСЛЕ этой даты материале.'
    status: open
    closes_when: "замер журнала за период не короче месяца показывает, что discovery звали ДО постройки во всех случаях, где рождался новый модуль"
    closes_when_by: claude
    warm_guard:
      absent:
      - агент всегда зовёт discovery
      - discovery вызывается всегда
      - дубль больше невозможен
      absent_en: ["agent always calls discovery", "discovery is always called", "duplicates are no longer possible"]
  - id: receipt_credited_on_merge_by_composition
    claim: 'Квитанция preflight, выданная в дереве нити, засчитывается при её слиянии в
      main, если СОСТАВ подсистемы (composition_token — модули и таблицы) не изменился
      с момента чтения; сменился (сосед добавил писателя таблицы) — блок, перечитай.
      HEAD не сравнивается: ребейз в thread_finish его меняет всегда. Дерево нити
      называет thread_finish (THREAD_MERGE_SOURCE): настоящий git merge зовёт
      pre-merge-commit до записи MERGE_HEAD (C-65). Оракул:
      tests/unit/test_preflight_merge_credit.py (настоящий git). Живьём (замер
      2026-09-26): закрытия tg-senders, onco-scrub и marker-guard прошли без обхода.'
    # Записано решением владельца 2026-09-26 (BL-PUB-15 в): «Записать».
    status: holds
    check:
      file: project_context/receipt.py
      present:
      - def merge_credit
      - THREAD_MERGE_SOURCE
      - composition_token
  - id: lessons_repeat_after_adoption_red
    claim: 'Онбординг несёт и уроки прошлых нитей. Извлечённый урок живёт в lessons.yaml
      своего проекта (health_scripts и соседние проекты), форму стережёт один движок
      project_context/lessons.py. У внедрённого урока есть дата внедрения adopted_on;
      урок той же группы (адрес + ключ предмета), записанный ПОЗЖЕ неё, красит проверку
      формы — правило не сработало, у внедрённых уроков группы ставится failed.
      Обязательность даты — ключ проекта adoption_dates: required (health_scripts и
      один соседний проект; другой ключа не ставит). Оракул — самопроверка движка
      (lessons --selftest) в сюите через tests/unit/test_project_context_lessons.py.'
    # Записано решением владельца 2026-09-29 (сверка с замыслом нити lessons-adopted-on): «Все три».
    status: holds
    limits:
    - 'Подача уроков на старте работы (lessons --subject) держится текстом ритуала letitbe,
      а не машиной: что ритуал её действительно позвал, ничто не проверяет.'
    - 'Даты внедрения уроков, внедрённых до 28.09.2026, — верхняя граница (день переноса
      корпуса), а не настоящий день: повтор между настоящим внедрением и 28.09 сигнал не
      покажет.'
    - 'Группа — по данным, не по смыслу: повтор, записанный с другим адресом или предметом,
      правило не видит; урок того же дня, что внедрение, повтором не считается.'
    check:
      file: project_context/lessons.py
      present:
      - def _repeats_after_adoption
      - adoption_dates
      - правило не сработало
    warm_guard:
      absent:
      - урок всегда доходит до исполнителя
      - повтор невозможен
      - сигнал ловит любой повтор
      absent_en: ["a lesson always reaches the executor", "a repeat is impossible", "the signal catches any repeat"]
  sentinel: tests/consistency/test_intent_validation_gate.py
  last_reconciled: '2026-09-29'

- id: disposability_gate
  title: 'Гейт одноразовости: новый модуль за тестируемым контрактом'
  intent: >
    Новый модуль появляется быстрее, чем осмысление его границ, и через месяц его нельзя
    ни переписать, ни выбросить: контракта нет, характеризации нет, суждение никто не
    выносил. Гейт не измеряет качество модуля — он требует, чтобы суждение было ВЫНЕСЕНО и
    ЗАПИСАНО до того, как код попадёт в историю: сайдкар с публичной поверхностью и
    соседними контрактами, вердикт по шести пунктам, тест, зовущий публичное имя.
    Отрицательный вердикт легален, нелегально его отсутствие. Судится содержимое ИНДЕКСА, а
    не рабочего дерева: иначе частичный стейдж обходит гарантию, вообще не меняя будущего
    коммита. Два раунда внешнего ревью очертили границу — гейт повышает вероятность
    осмысленного контракта и характеризации, но не доказывает корректность произвольной
    программы на pre-commit, и известные обходы названы вслух, а не скрыты.
  explanation: docs/explanation/disposability_gate.md
  spec: docs/explanation/disposable_modules_refactor.md
  code_anchors:
  - project_context/dispgate.py::check
  - project_context/dispgate.py::evaluate_new_modules
  - project_context/staged.py::snapshot
  - project_context/indexer.py::disposability_policy
  invariants:
  - id: gate_wired
    claim: 'Гейт вшит в pre-commit и его блок доезжает до кода выхода: файл со статусом A,
      не прошедший K1-K3, режет коммит с exit 6. Размер (K4) только предупреждает.'
    status: holds
    check:
      file: scripts/git-hooks/pre-commit
      present:
      - '-m project_context dispgate --block'
      - _disp_rc -eq 6
  - id: judges_index_not_worktree
    claim: 'Всё судимое читается из ОДНОГО снимка индекса; рабочее дерево гейт не открывает.
      Поэтому частичный стейдж (модуль в индексе, сайдкар и тест untracked) не проходит.'
    status: holds
    check:
      file: project_context/dispgate.py
      present:
      - with staged.snapshot(root) as snap
      - indexer.build(sroot)
  - id: internal_error_blocks
    claim: 'Внутренняя ошибка гейта БЛОКИРУЕТ, а не пропускает. Отказ окружения гейт выражает
      структурно (snapshot отдаёт ok=False), поэтому исключение означает дефект гейта либо
      нераспознанный вход; тихий проход по нему сделал бы тихим каждый будущий дефект.'
    status: holds
    check:
      file: project_context/__main__.py
      present:
      - 'гейт одноразовости: ВНУТРЕННЯЯ ОШИБКА'
  - id: engine_checklist_from_package
    claim: 'Движковый чек-лист D1-D6 читается из УСТАНОВЛЕННОГО ПАКЕТА, а не из судимого
      содержимого: он инструмент суждения, а не предмет. Подменить его вместе с кодом нельзя.'
    status: holds
    check:
      file: project_context/indexer.py
      present:
      - engine_dir or os.path.dirname
  - id: project_layer_bounded
    claim: 'Проектная политика берётся из ИНДЕКСА вместе с остальным содержимым репозитория и
      может: переопределить числа, ДОБАВИТЬ каталоги периметра, назвать канон проекта. НЕ может:
      перекрыть движковый каталог (tests остаётся judgement_harness, чем бы проект его ни назвал),
      расширить закрытый список классов (каталог с неизвестным классом не освобождается вовсе).
      Негодная проектная политика — ОТКАЗ инструмента суждения, а не её отсутствие: блок с
      названной причиной. Разрезано из engine_checklist_from_package 12.09.2026 решением
      владельца: там склеивались два разных предмета с разными сторожами, и красный не говорил,
      какая половина сломалась. Прежняя формулировка «переопределяет только числа» стала неверной
      после проектного слоя и врала В СТОРОНУ ПРЕУМЕНЬШЕНИЯ возможностей проекта — тот, кто её
      читал, делал вывод, что проект физически не может ослабить периметр, и не проверял
      проектный файл. Из этого же вывода вырос дефект F-01. ТРЕТЬЯ граница и семантика входа
      добавлены 12.09.2026 по раунду 2 внешнего ревью, и все три находки — тот же класс
      занижения: проект НЕ может назначить своему каталогу класс из never_overrides (его
      освобождение не снимается касанием канона, то есть было бы сильнее любого движкового,
      F-R2-06); имена проектного канона обязаны резолвиться против индекса, а секция canon без
      единого имени — отказ, потому что опечатка в единственной строке снимала строгость молча
      (F-R2-07); для строгого читателя политика-симлинк — отказ, иначе байты живут вне индекса
      и вердикт меняется при неизменном блобе (F-R2-08). Отказ называет ПРОЕКТНЫЙ файл: до
      ремонта шесть форм блокировали без адреса, а негодная запись каталога звала чинить
      движковый perimeter.json из чужого репозитория (F-R2-03/04/05).'
    status: holds
    check:
      file: tests/unit/test_dispgate_project_perimeter.py
      present:
      - test_project_cannot_override_engine_directory
      - test_unknown_class_does_not_exempt_anything
      - test_project_cannot_hand_itself_a_never_overridden_class
      - test_empty_canon_section_is_a_refusal
      - test_unresolvable_canon_name_is_found
      - test_symlinked_policy_is_a_refusal
      - ProjectManifestUnusable
  - id: degraded_checklist_blocks
    claim: 'Негодный чек-лист блокирует, а не предупреждает, и негодность определяется по ТИПУ,
      а не по непустоте: строка вместо списка пунктов раньше проходила проверку и падала позже.'
    status: holds
    check:
      file: project_context/indexer.py
      present:
      - degraded=not (_it_ok and _lim_ok)
  - id: k2_is_syntactic_witness
    claim: 'K2 доказывает СИНТАКСИЧЕСКОЕ свидетельство связанного вызова, а не исполнимость.
      Гейт не знает, соберёт ли pytest файл, достижима ли ветка и есть ли в тесте ассерты;
      усиление детектора этого не изменит, потому что вызов без ассертов законен.'
    status: holds
    check:
      file: project_context/dispgate.py
      present:
      - 'ЧЕСТНАЯ СИЛА K2'
  - id: liveness_not_rule_coverage
    claim: 'Ночная поведенческая проба доказывает, что гейт жив, но НЕ что живо каждое из
      правил K1-K4: она подсовывает грубого нарушителя, которого останавливает уже K1.
      Смерть одного правила ловят только целевые pytest.'
    status: open
    closes_when: "у каждого из правил K1–K4 есть целевой тест с исполненным негативным контролем"
    closes_when_by: claude
    warm_guard:
      absent:
      - датчик проверяет каждое правило
      - покрывает K1-K4
      - ночная проба доказывает корректность
      absent_en: ["sensor checks every rule", "covers k1-k4", "nightly probe proves correctness"]
  - id: staged_readers_duplicated
    claim: 'Понятие «что застейджено» имеет несколько независимых реализаций: git diff --cached
      зовут receipt, dupgate, pre_commit_check и staged, плюс сам shell-хук. Дубль-гейт этот
      класс НЕ видит по конструкции — его модель способности это имя и таблица данных, а здесь
      дублируется обращение к внешнему инструменту. Миграция соседей не начата.'
    status: open
    closes_when: "реализация «что застейджено» одна, остальные её зовут; либо дубль-гейт видит этот класс, либо его слепота к нему названа в реестре явно"
    closes_when_by: claude
    warm_guard:
      absent:
      - единственный читатель staged
      - дубль-гейт стережёт это
      - соседи мигрированы
      absent_en: ["the only reader of staged", "duplicate gate guards this", "neighbours are migrated"]
  sentinel: tests/consistency/test_intent_validation_gate.py
  last_reconciled: '2026-07-27'

- id: intent_receipts
  title: 'Квитанция замысла: артефакт закрытия несёт живое чтение реестра'
  intent: >
    Замысел подсистем живёт в этом реестре, но чтение его — добрая воля: нить могла пройти
    от плана до закрытия, ни разу не сверившись. Гейт требует у артефактов закрытия
    (план нити plans/PLAN_*.md, снимки docs/handoff/) квитанцию чтения: ids затронутых
    записей, ЖИВЫЕ статусы их инвариантов и дату. Статусы пересчитываются на коммите против
    реестра из индекса — квитанцию нельзя написать, не прочитав реестр, и нельзя довезти
    протухшей (квитанция — кэш чтения, пересчёт — его инвалидация). Ревью-передача несёт
    ids без обязательных статусов: авторские статусы для внешнего тестировщика — утечка
    авторских допущений. Нормативный дом формата — docs/reference/intent_receipt_format.md
    (contract-тест исполняет его примеры живым судьёй); скиллы letitbe/the-end ссылаются,
    не нормируют (внешнее ревью 2026-08-07, F-02: прежний дом жил вне репозитория).
  explanation: docs/explanation/intent_receipts.md
  spec: plans/PLAN_intent_receipt_gate_2026-08-07.md
  code_anchors:
  - project_context/intentgate.py::check
  - project_context/intentgate.py::evaluate_files
  - project_context/staged.py::snapshot
  invariants:

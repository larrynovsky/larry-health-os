cpic.advice.no_genotype: "Генотип по этому гену не определён у тебя. Свериться с врачом перед назначением."
cpic.advice.no_recommendation: "Нет CPIC-рекомендации для этого фенотипа в справочнике. Свериться с врачом."
traits.notes.lactase_missing: "Генетический маркер отсутствует в геноме (не покрыт чипом)."
traits.notes.lactase_persistent: "Гомозигота по аллелю персистентности (AA). Активность лактазы сохраняется во взрослом возрасте. Молочные продукты переносятся хорошо."
traits.notes.lactase_partial: "Гетерозигота (AG). Большинство носителей одного A-аллеля сохраняют достаточную активность лактазы и переносят лактозу без симптомов. Возможна умеренная чувствительность в больших дозах."
traits.notes.lactase_nonpersistent: "Гомозигота GG — классический генотип непереносимости лактозы. Активность лактазы снижается после отлучения от груди. Характерные симптомы: вздутие, диарея, спазмы при употреблении молока."
traits.notes.eye_missing: "Генетический маркер отсутствует в геноме."
traits.notes.eye_light: "Гомозигота GG. HERC2 rs12913832 GG — самый сильный предиктор голубых или серых глаз в европейских популяциях (AUC ~0.9 в мультилокусных моделях). Полный цвет определяется дополнительными локусами (OCA2, TYRP1, SLC24A4)."
traits.notes.eye_mixed: "Гетерозигота AG. Один G-аллель: умеренное снижение пигментации OCA2. Итоговый цвет непредсказуем без учёта остальных пигментных локусов — может быть зелёным, карим, ореховым или светло-карим."
traits.notes.eye_dark: "Гомозигота AA — высокая активность OCA2, много меланина в радужке. Карий цвет глаз наиболее вероятен. Другие пигментные локусы редко меняют итог при AA."
traits.notes.apoe_missing: "Генетический маркер отсутствует в геноме: {missing}."
traits.notes.apoe_e3_e3: "Наиболее распространённый вариант (частота ~60%). Базовый уровень риска болезни Альцгеймера. Нейтральный эффект на уровень ЛПНП по данному локусу."
traits.notes.apoe_e2_e3: "ε2-аллель ассоциирован со сниженным уровнем ЛПНП и умеренной защитой от болезни Альцгеймера по сравнению с ε3/ε3. Редкий риск дисбеталипопротеинемии (тип III) — только при ε2/ε2, здесь не применимо."
traits.notes.apoe_e2_e2: "Гомозигота ε2/ε2 (редкий генотип, ~1%). Риск дисбеталипопротеинемии (тип III гиперлипопротеинемии) при наличии других метаболических факторов. Уровень ЛПНП обычно ниже среднего. Сниженный риск болезни Альцгеймера."
traits.notes.apoe_e3_e4: "Один ε4-аллель: умеренно повышенный риск болезни Альцгеймера (~3× vs ε3/ε3). Также ассоциирован с более высоким уровнем ЛПНП. Несёт примерно 25% популяции европейского происхождения. Образ жизни (физическая активность, метаболическое здоровье) существенно модулирует риск."
traits.notes.apoe_e4_e4: "Гомозигота ε4/ε4 (редкий генотип, ~2%). Значительно повышенный риск болезни Альцгеймера (~12× vs ε3/ε3). Также выраженная ассоциация с высоким ЛПНП. Рекомендована консультация генетика."
traits.notes.apoe_phase_uncertain: "По одному ε2- и ε4-маркеру. Наиболее вероятный генотип ε2/ε4, но фаза не определена по данным генетических маркеров — альтернативно ε2/ε3 + ε3/ε4 (без ε2/ε4). При клиническом значении рекомендуется секвенирование полного гена APOE."
traits.notes.apoe_unusual: "Нестандартная комбинация аллелей — требуется валидация."
wellness.notes.mthfr_missing: "Оба генетических маркера (C677T, A1298C) отсутствуют в геноме."
wellness.notes.mthfr_normal: "Оба локуса MTHFR — дикий тип. Активность фермента в норме (~100%). Метилирование фолата не нарушено. Уровень гомоцистеина ожидаемо нормальный."
wellness.notes.mthfr_677_het: "Гетерозигота C677T (rs1801133 GA). Активность MTHFR умеренно снижена (~65%). Термолабильный фермент. При низком потреблении фолата возможно субклиническое повышение гомоцистеина. Рекомендуется поддерживать нормальный уровень фолата в питании (зелёные листовые овощи, бобовые) или дополнительный приём L-метилфолата."
wellness.notes.mthfr_1298_het: "Гетерозигота A1298C (rs1801131 TG). Активность MTHFR незначительно снижена. Клинически менее значимо, чем C677T. При нормальном питании, как правило, без последствий. Мониторинг гомоцистеина при назначении нейротоксичных препаратов."
wellness.notes.mthfr_677_hom: "Гомозигота C677T (rs1801133 AA). Активность MTHFR значительно снижена (~30%). Повышенный риск гиперхомоцистеинемии, особенно при дефиците фолата, B12, B6. Важно: активная форма фолата (L-метилфолат 5-MTHF) усваивается лучше, чем синтетическая фолиевая кислота. Регулярный контроль гомоцистеина рекомендован."
wellness.notes.mthfr_compound: "Компаундная гетерозигота: одна копия 677T и одна копия 1298C. Активность MTHFR снижена умеренно (~50%). Эффект сопоставим с гомозиготой C677T по клиническому значению. Риск гиперхомоцистеинемии реален при дефиците витаминов группы B. Рекомендуется: L-метилфолат, B12 (метилкобаламин), B6 (P-5-P)."
wellness.notes.mthfr_1298_hom: "Гомозигота A1298C. Активность MTHFR снижена умеренно (~60%). Менее значимо клинически, чем варианты с 677T. Следите за уровнем гомоцистеина, B12 и фолата."
wellness.notes.mthfr_severe: "Редкая комбинация: гомозигота 677T + гетерозигота 1298C. Активность MTHFR очень низкая (<10%). Высокий риск гиперхомоцистеинемии. Рекомендована консультация нутрициолога/генетика. L-метилфолат + метилкобаламин обязательны."
wellness.notes.mthfr_rare: "Редкая комбинация аллелей MTHFR. Требуется клиническая оценка."
wellness.notes.comt_missing: "Генетический маркер rs4680 отсутствует в геноме."
wellness.notes.comt_low: "Гомозигота Met/Met (AA). Медленный распад допамина. Потенциально лучшая рабочая память и концентрация в спокойных условиях. Повышенная чувствительность к стрессу и боли. Кофеин и стимуляторы могут усиливать тревожность. COMT — один из многих факторов дофаминергической регуляции."
wellness.notes.comt_intermediate: "Гетерозигота Val/Met (GA). Промежуточная активность COMT. Сбалансированный профиль: умеренный клиренс допамина, умеренная стрессоустойчивость. Наиболее распространённый генотип."
wellness.notes.comt_high: "Гомозигота Val/Val (GG). Быстрый распад допамина. Высокая стрессоустойчивость («воин», а не «исследователь» по метафоре Гольдмана). Рабочая память в стрессе сохраняется лучше; в спокойных условиях дофаминовый тонус ниже."
wellness.notes.fto_missing: "Генетический маркер rs9939609 отсутствует в геноме."
wellness.notes.fto_elevated: "Гомозигота AA: наибольший вклад локуса FTO в риск ожирения (~1.6× vs TT). Эффект: +0.8 кг/м² BMI в среднем. Механизм — нарушение термогенеза в бурой жировой ткани. Хорошо отвечает на физическую активность: FTO-эффект частично нейтрализуется регулярными аэробными нагрузками."
wellness.notes.fto_modest: "Гетерозигота AT: умеренный вклад FTO (~1.3× vs TT). Эффект: +0.4 кг/м² BMI в среднем. Физическая активность значительно нивелирует генетическую предрасположенность. Один из наиболее слабых предикторов среди изученных — образ жизни важнее генетики."
wellness.notes.fto_neutral: "Генотип TT — нейтральный. Ожирение при таком генотипе определяется другими факторами (поведение, другие локусы, микробиом)."
wellness.notes.hfe_missing: "Генетический маркер rs1799945 отсутствует в геноме."
wellness.notes.hfe_homozygous: "Гомозигота H63D/H63D. Риск перегрузки железом выше, чем у гетерозиготы, но всё же значительно ниже, чем у C282Y-мутаций (HFE классический). Контроль ферритина и насыщения трансферрина при клинических показаниях. Избегать длительный приём железосодержащих препаратов без показаний."
wellness.notes.hfe_heterozygous: "Гетерозиготный носитель H63D (наиболее частый HFE-вариант, ~20% носителей). Незначительно повышенное всасывание железа. Клинический гемохроматоз у гетерозигот редок. При повышенном ферритине — проверить насыщение трансферрина. Относится к фоновому риску, не требует специфического мониторинга при норм. ОАК."
wellness.notes.hfe_absent: "HFE H63D отсутствует. Риск генетически обусловленного гемохроматоза по этому локусу не повышен."

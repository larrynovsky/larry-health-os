[pytest]
# Конфиг pytest для Health OS test suite.
# См. TEST_ARCHITECTURE.md §3 для расшифровки слоёв.

testpaths = tests

# Маркеры (соответствуют слоям из TEST_ARCHITECTURE.md):
markers =
    unit: изолированный модуль, mock зависимостей. <100мс.
    integration: связь нескольких модулей через данные (in-memory SQLite).
    e2e_mock: сквозной сценарий с моками внешних систем (Telegram, Anthropic, ClinVar, Oura). 1-3 мин.
    consistency: тесты на распределённые свойства (RYW/tentative/single-primary/staleness/causal/eventual).
    snapshot: эталоны JSON / структуры для критичных мест.
    llm_judge: D-уровень оракул через отдельный Claude haiku. Дорого по API.
    slow: помечает тесты дольше 5с — пропускаются в pre-commit, идут в nightly.
    requires_studio: тесты, которые работают только на Studio (single-primary). На MacBook skipped.
    requires_anthropic_key: тесты, использующие реальный Anthropic API. Skipped без ключа.
    owner_data: тест правил или данных владельца (его пороги, свод, питание, конфиг, мастерская). В публичной выгрузке пропускается (pii_census.is_public_export), у владельца бежит всегда.
    owner_env: предполагают реальное окружение владельца (канонический HEALTH_DATA_DIR + настоящие секреты). В tenant-staging прогоне (scripts/test_on_studio.sh) skipped; идут в nightly на каноне.
    host_only: тест судит машину-хост, а не систему (git и хуки, нити, Homebrew, zsh, launchd, адреса машин). В контейнере (HEALTH_RUNTIME=container) пропускается с причиной; бежит на Studio в каждом закрытии нити (scripts/thread_finish.sh). Решение владельца 30.09 (вариант Б).

# По умолчанию запускаем без slow и без e2e (чтобы pre-commit был быстрым).
# Для полного прогона: pytest -m "not slow" --override-ini="addopts="
addopts =
    -ra
    --strict-markers
    --tb=short
    -m "not slow and not requires_anthropic_key"

# Исключение в потоке теста — красный, а не предупреждение (05.10.2026): поток, писавший
# в живую базу, был виден только строкой предупреждения в ночном журнале.
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning

# Не делать collection в служебных папках
norecursedirs = tests/snapshots tests/reports tests/plans tests/charters tests/.diagnosis_cache .git logs

# Минимальная версия pytest
minversion = 7.0

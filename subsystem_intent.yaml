      claim: "Текст отчёта судится против lab_results, а не против показанного модели среза: судья читает канон за 10 лет, и фильтр между базой и промптом не становится определением реальности."
      status: holds
      check:
        file: gp_agent.py
        present: ["absent_claims_contradicted", "get_recent_labs(730 * 5)"]
    - id: window_boundary_declared
      claim: "Лаб-блок объявляет границу окна и наличие строк за ней датами и счётом. Сырые написания бланков за границу не передаются (§19). В месячном отчёте GP build_unrepeated_draw_context может перечислять канонические имена аналитов без более свежего замера, если есть находка; canon_window_note(named_below=True) объявляет это исключение. Флаг unrepeated управляет и блоком, и оговоркой. Остальные читатели получают формулировку без исключения. Отсутствие аналита в блоке означает отсутствие данных за окно, а не отсутствие обследования."
      status: holds
      check:
        file: labs_db.py
        present: ["canon_window_note", "ГРАНИЦА ОКНА", "их имена здесь не перечислены", "named_below"]
    - id: no_manual_analyte_allowlist
      claim: "Лабораторный контекст GP и консилиума отбирает аналиты окном, а не ручным списком имён. Профильный снимок patient_context.build_patient_brief содержит ограниченный список, поэтому сам по себе не описывает весь канон. В консилиуме его дополняет лабораторный блок по окну. Ограничения снимка должны объявляться через context_declares_its_boundary."
      status: holds
      check:
        file: wellally_consult.py
        present: ["get_recent_labs(LAB_WINDOW_DAYS)"]
        absent: ["key_labs"]
    - id: context_declares_its_boundary
      claim: "Блок данных, который едет в промпт, ОБЪЯВЛЯЕТ своё отклонение от канона — и окно, и отбор имён, и усечение. Объявление собирает единый дом labs_db.canon_window_note; вызывающие зовут его через labs_db.declared_boundary, и отказ сборки объявления сам становится объявлением («считай НЕПОЛНЫМ»), а не молчаливым срезом и не падением всего промпта. Периметр ВЫЧИСЛЯЕТСЯ пробой (AST: функция зовёт читателя лаб-строк), а не перечисляется: читатель без объявления либо назван с причиной, либо краснеет. Замер 21.09: читателей 21, объявляют 9, приняты с причиной 12 (судьи, выход человеку, логика без текста, улика без окна, детекторы событий)."

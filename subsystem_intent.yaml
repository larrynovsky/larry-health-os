    - id: question_typing_unverified_open
      # Стабильность маршрутизации и успешный разбор ответа — разные свойства.
      # Пограничные формулировки могут менять адресата; оракул границы — человек.
      claim: "Кому адресована формулировка, судит модель. СТАБИЛЬНОСТЬ измерена на 7 прогонах × 7 кейсах: на шести успешных прогонах ярлык не плавал ни разу и поведение совпало с эталоном 7/7. Седьмой прогон вернул пустоту не из-за суждения, а из-за разбора ответа — отдельный замер дал 2 сбоя на 10 вызовов, причина найдена и починена пообъектным salvage. Замер на полной популяции (plans/probe_question_corpus_2026-09-15.py, 27 формулировок, производственная порция 5) расширил оценку за пределы подобранных кейсов. Инвариант остаётся open: на реальном входе было 1 расхождение поведения из 27 внутри сессии, 2 смены ярлыка и 2 дрейфа из 20 между замерами. Содержание, идентификаторы и хронология личных вопросов здесь не воспроизводятся. Независимо придуманный пример пограничной фразы: «кто должен выбрать формат учебного отчёта?» — предпочтение человека и правило системы требуют разных адресатов. Вердикт судьи и его причина сохраняются в tasks.judge_verdict/judge_reason на обоих путях судьи и в memory_facts.retire_reason для снятых кандидатов. Долг BACKLOG.md::BL-JUDGE-VERDICT-UNRECORDED-1 касался выбрасывания уже полученной причины, а не отсутствия поля. Слой публикации отделён от слоя данных: tasks.reason рендерится человеку в Telegram (format_tasks_message), машинное суждение туда не попадает. Позднейшая проверка показала предел salvage: он спасал соседние объекты, но терял сломанный. На 7 кейсах пробы 6 ответов из 30 не разбирались json.loads (все end_turn, не обрезка). Лечение (решение владельца «переспросить потерянное», коммит 278ec93): id без вердикта судятся ещё раз, только они, тем же промптом; после — 20 вызовов, повтор 5 раз, потеряно 0 из 140. Корпус 28 формулировок: 27 стабильных в базовом замере судятся так же, расхождений поведения между двумя прогонами 0 (в базовом замере 1). Строгий формат ответа (tool_use) отвергнут по воротам: Haiku в 2 из 12 слал вердикты строкой. Статус open НЕ снят: причина открытости — плавание границы между замерами, а повтор разбора её не касается."
      status: open
      closes_when: "ярлык не плавает на наборе формулировок, собранном НЕ по прошлым промахам и собранном ПОСЛЕ последнего изменения судьи"
      closes_when_by: claude
      # ЯВНОЕ поле, а не упоминание пути в claim: сторож test_probe_coverage видит

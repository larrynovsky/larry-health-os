      # РЕШЕНИЕ ВЛАДЕЛЬЦА 2026-09-21 (вариант 2 из трёх): критерий ниже УТВЕРЖДЁН.
      # Доказательство, предъявленное к решению (ручные прогоны 21.09 на каноне): 9 из 9

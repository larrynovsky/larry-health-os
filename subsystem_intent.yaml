        - "queue_quarantine ГЛОТАЕТ нарушение схемы молча: family вне CHECK (D|A|q_lag) даёт INSERT OR IGNORE → 0 и ноль сигналов, неотличимо от «пара уже стоит». Замер 2026-07-29 на снимке: плохая семья → 0 и пусто, хорошая → 1. quarantine_schema_guarded() при этом True. Сегодня недостижимо (единственный производитель берёт семьи из ключей снимка), но связка «ключи снимка = CHECK схемы» ничем не удерживается: новая семья сигналов молча отключит карантин для неё."

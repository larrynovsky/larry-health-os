- id: lab_intake_gate
  title: "Разбор анализов из входящих: что не бланк — решает не только словарь"
  intent: >
    Человек присылает файл в бот — разборщик входящих (lab_intake_watcher) решает, бланк ли это
    анализов, и только бланк отдаёт платному распознаванию двумя моделями. Первая сторонняя
    установка (Windows, ключ OpenAI, 05.10) показала, как этот гейт отказывает молча: суд по
    ключевым словам опирается на словарь, а словарь — данные установки (docs.type_markers), и на
    новой установке он пуст; чистый русский бланк получал «не удалось распознать, пришлите
    почётче», хотя модель его не видела. При нулевом балансе отказ поставщика превращался в
    «0 строк» навсегда, а повтор того же файла бот отбивал как дубль. Решение владельца 06.10 —
    гейт в реестр. Поэтому обещания: «нет» слов не окончательное — его переспрашивает модель по
    первой странице с безопасной стороной «бланк»; отказ поставщика по ключу или счёту — ожидание
    с повтором, а не сбой навсегда, человеку — один раз и словами; повтор файла после отказа берёт
    его заново, повтор после «не бланк» — вердикт человека «это анализы»; ответ человеку называет
    настоящую причину (сбой у нас / ключ или баланс), а не «пришлите почётче». 06.10 тот же человек
    прислал заключение врача и услышал «не удалось прочитать ни одного значения анализов; в базу
    ничего не добавлено»: файл читают ДВА разборщика (анализы и документы), а говорил только первый —
    за весь файл. Поэтому ещё одно обещание: итог по файлу один и говорится после обоих; ошибка гейта
    стоит лишнего вызова модели, а не ложного ответа человеку.

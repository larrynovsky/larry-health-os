- id: genome_effect_allele
  title: "Геном: strand-безопасная резолюция аллеля (отказывает безопасно)"
  intent: >
    Твой генотип (23andMe) и клинические базы (ClinVar/VCF) часто записаны на разных
    цепях ДНК. Наивно сверить их «в лоб» — значит иногда объявить носительство, которого
    нет, или, хуже, чистоту, которой нет. Резолвер строго приводит одно к другому, а при
    ЛЮБОЙ неоднозначности (палиндром, несколько альтернатив, генотип не из пары) возвращает
    «неизвестно», а не догадку. Для онкопациента уверенно-ложное «вы чисты» опаснее пустоты:
    пустоту видно, ложную чистоту — нет.
  explanation: docs/explanation/genome_effect_allele.md
  code_anchors:
    - effect_allele.py::resolve_effect_allele
    - effect_allele.py::_comp
    - effect_allele.py::_norm_genotype
  invariants:
    - id: fail_safe_null
      claim: "Любая неоднозначность цепи (палиндром / >1 альтернативы / генотип не из пары) даёт (None, status) — резолвер молчит, а не угадывает аллель."
      status: holds
      check:
        file: effect_allele.py
        present: ["multiallelic_ambiguous", "palindromic", "genotype_mismatch"]
    - id: strand_symmetry
      claim: "Результат инвариантен к цепи: resolve(complement(генотип)) даёт тот же status (для resolved — комплементарный аллель). Покрыто property-тестом."
      status: holds
      check:
        file: effect_allele.py
        present: ["_comp", "strand-симметрия"]
    - id: null_is_unknown_not_clean
      claim: "Ниже по потоку NULL effect_allele читается как «неизвестно», не «нет риска»: все читатели (genome_context, constitution_analysis, generate_constitutions) сюрфейсят NULL как «не верифицировано», а сцепление carrier-статус⟹effect_allele≠NULL заверено датчиком."
      # Сверено 2026-07-11: census всех 22 читателей effect_allele (заверитель — тест).
      # Фикс C1: constitution_analysis сюрфейсит unverified (был баг — NULL сливался
      # с wildtype в 5 местах, ВКЛ. онко-путь analyze_oncology). Сторож сцепления —
      # genome_db.carrier_status_null_allele_violations + integrity_tests (live 0/16937).
      # generate_constitutions:169 укреплён (NULL→«unknown», не тихий скип).
      # warm_guard оставлен инертным — перевзвод при откате в open.
      status: holds
      check:
        file: tests/unit/test_genome_null_not_clean.py
        present: ["test_analyze_oncology_surfaces_null_as_unverified", "carrier_status_null_allele_violations", "zygosity_null_never_wildtype"]
      warm_guard:
        absent: ["неизвестно значит нет риска", "null значит чисто", "отсутствие аллеля — чисто"]
        absent_en: ["unknown means no risk", "null means clean", "absence of the allele means clean"]
  sentinel: tests/consistency/test_intent_validation_gate.py
  last_reconciled: "2026-07-11"


- id: consilium
  title: "Консилиум: спор, а не голосование"
  intent: >
    Одна модель, даже с учебником, уверенно кренится в одну сторону; несколько специалистов,
    ответивших параллельно и усреднённых, дают консенсус посредственности — все ошиблись
    одинаково, а выглядит как единодушие. Поэтому консилиум устроен как спор: состав берётся
    из одного источника (мед-роли — все, кроме явно неподходящих по полу и возрасту; lifestyle-
    коучи отдельно), в раунде A каждый отвечает вслепую, в раунде B видит остальных и может НЕ
    согласиться, координатор синтезирует итог. Ценность — в возражении кардиолога эндокринологу,
    не в кивке.
  explanation: docs/explanation/consilium.md
  code_anchors:
    - consilium_roster.py::medical_roster
    - consilium_roster.py::roster_for
    - hypothesis_consilium_eval.py::_arbiter_extract_verdict
  invariants:
    - id: single_source_roster
      claim: "Состав мед-консилиума берётся из одного источника (consilium_roster): все специалисты минус явно неподходящие по полу/возрасту. Свело split-brain двух захардкоженных списков (wellally/monthly — оба зовут отсюда)."
      status: holds
      check:
        file: consilium_roster.py
        present: ["_MEDICAL_ALL", "medical_roster", "roster_for"]
    - id: objection_round
      claim: "Консилиум — спор, не усреднение: раунд A вслепую, раунд B каждый видит остальных и может не согласиться, затем координатор и арбитр."
      status: holds
      check:
        file: hypothesis_consilium_eval.py
        present: ["Round A", "Round B", "coordinator"]
    - id: participant_count_hardcoded_open
      claim: "Число участников считается от фактического состава: n_participants = len(medical_roster()) + len(lifestyle AGENTS); логи и промпт eval — от него, а не от литерала (был лог-баг «17/13» — split-brain счётчика и динамического ростера)."
      # Сверено 2026-07-11: литерал «13»/«9 врачей + 4» вычищен из hypothesis_consilium_eval
      # (логи 252/299/330, докстринг, комменты, промпт координатора); единый источник —
      # consilium_roster. warm_guard оставлен инертным — перевзвод при откате в open.
      status: holds
      check:
        file: hypothesis_consilium_eval.py
        present: ["n_participants = len(medical_names) + len(la.AGENTS)"]
        absent: ["9 врачей + 4"]
      warm_guard:
        absent: ["ровно 13 участников", "всегда 13", "консилиум из 13 специалистов"]
        absent_en: ["exactly 13 participants", "always 13", "consilium of 13 specialists"]
  sentinel: tests/consistency/test_intent_validation_gate.py
  last_reconciled: "2026-07-11"


- id: memory_temporal_axis
  title: "Память с осью времени: durable / standing / transient"
  intent: >
    Система извлекает из разговоров факты, но не все они действуют одинаково долго.
    Полностью выдуманный немедицинский пример: открытие выставки перенесли с понедельника
    на среду, а память хранит обе версии как актуальные. Нужна ось времени у каждой
    записи: durable (генетика, анатомия) не тускнеет никогда; standing (статус ремиссии)
    гаснет только при явной смене, не по возрасту; transient (разовый сбой, одна плохая
    ночь) уходит из подачи по сроку годности, но остаётся в базе. Класс выводится из
    СТРУКТУРЫ записи, а не суждением модели — авто-судье тут доверять нельзя.
  explanation: docs/explanation/memory_temporal_axis.md
  code_anchors:
    - memory_facts_db.py::_derive_temporal_class
    - memory_facts_db.py::save_fact
    - memory_facts_db.py::get_facts
  invariants:
    - id: class_from_structure
      claim: "Временной класс (durable/standing/transient) выводится из СТРУКТУРЫ записи (critical_flag + привязка к дате/относительному дню), а не суждением LLM — авто-судьи согласны лишь на 48%."
      status: holds
      check:
        file: memory_facts_db.py
        present: ["_derive_temporal_class", "durable", "transient", "standing"]
    - id: conservative_standing_default
      claim: "Дефолт — standing: не тускнеет по возрасту, гаснет только при явной смене. Риск асимметричен — потерять факт хуже, чем додержать лишний."
      status: holds
      check:
        file: memory_facts_db.py
        present: ["standing", "асимметрич"]
    - id: read_side_enforcement_open
      claim: "temporal_class проставляется на ЗАПИСИ, но ЧТЕНИЕ его не навязывает: get_facts/get_profile отдают активные факты, потребитель сам решает ронять устаревший transient. Census потребителей неполон (~10 модулей читают raw, мимо оси)."
      # open (4-я колонка): ось задаётся при записи, но enforcement на чтении —
      # на совести каждого читателя; полнота покрытия читателей не заверена.
      status: open
      closes_when: "перепись потребителей доведена до неподвижной точки, и каждый читающий сырые факты либо уважает ось времени, либо назван осознанно открытым в самом реестре"
      closes_when_by: claude
      warm_guard:
        absent: ["устаревшее автоматически исчезает", "устаревшее не попадёт в подачу", "чтение само роняет устаревшее"]
        absent_en: ["stale items disappear automatically", "stale items never reach the feed", "reading drops stale items by itself"]
  sentinel: tests/consistency/test_intent_validation_gate.py
  last_reconciled: "2026-07-10"


- id: doctor_in_loop
  title: "Врач в контуре: ответ врача возвращается входом"
  intent: >
    Медицинское не решается моделью — оно уходит живому врачу. Ключевое: ответ врача
    возвращается ВХОДОМ, а не оседает репликой в чате. Подтвердил → гипотеза подтверждена
    и рождает протокол действий; скорректировал → переформулирована, идёт на новый круг
    консилиума; принёс новые анализы → вердикт пересматривается. Без этого возврата система
    фактически ставила бы диагнозы и советовала лечение — то есть была бы нелицензированным
    медицинским устройством, способным навредить уверенной чепухой. Это несущая стена.

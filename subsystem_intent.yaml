- id: telegram_bot
  title: "Бот: fail-closed доставка владельцу"
  intent: >
    Бот — то, как медицинское уходит к тебе и возвращается от тебя. Две несущие вещи, не про
    кнопки. Первая: он отвечает и шлёт только твоему чату — OWNER_CHAT_ID грузится при импорте
    fail-closed (нет файла — процесс падает, чтобы первый встречный не стал владельцем гонкой),
    а получатель берётся из ЕДИНОГО резолвера секретов тенанта, так что карточка партнёра уходит
    партнёру, а не тебе. Вторая: длинное сообщение доставляется с квитанцией — система знает
    message_id каждого куска, а не радуется, что «корутина не упала»; недельный отчёт однажды
    «отправился», но не дошёл — с тех пор доставка без квитанции не считается доставкой.
  explanation: docs/explanation/telegram_bot.md
  code_anchors:
    - bot/filters.py::get_token
    - bot/filters.py::get_chat_id
    - bot/filters.py::_owner_filter
  invariants:
    - id: owner_fail_closed
      claim: "Fail-closed доступ владельца СОХРАНЁН, но механизм сменился (2026-07-17): не импорт-фейл, а ленивый мемоизированный owner_chat_id() (RAISE при отсутствии секрета, НИКОГДА не None → auth-чек не короткозамкнётся в fail-open) + старт-гейт assert_owner_configured() до run_polling. Хендлеры пускают только чат владельца (_owner_filter). Прежняя формулировка «падает при импорте» — мёртва: ленивый резолв введён, чтобы утечка env в тестах не роняла сбор pytest."
      status: doc_drift
      closes_when: "формулировка инварианта переписана под действующий механизм (ленивый owner_chat_id), и расхождение дока с кодом больше не воспроизводится"
      closes_when_by: claude
      check:
        file: bot/filters.py
        present: ["owner_chat_id", "assert_owner_configured", "_owner_filter"]
    - id: single_tenant_resolver
      claim: "Получатель — из ЕДИНОГО резолвера secrets_paths.secrets_dir(), не хардкод и не локальная копия (датчик single-resolver): процесс партнёра берёт свой токен/чат, карточка уходит своему тенанту."
      status: holds
      check:
        file: bot/filters.py
        present: ["secrets_dir", "ЕДИНЫЙ"]
    - id: delivery_receipt_not_proxy
      claim: "Длинное сообщение (send_long) доставляется с квитанцией — message_id по кускам, а не «корутина не упала»; тело сообщения в лог не пишется (биометрия). Инцидент: отчёт «отправился», но не дошёл."
      status: holds
      check:
        file: bot/utils.py
        present: ["send_long", "message_id", "SEND_RECEIPT"]
  sentinel: tests/consistency/test_intent_validation_gate.py
  last_reconciled: "2026-07-18"


- id: dashboard
  title: "Дашборд: витрина из БД за периметром tailnet"
  intent: >
    Дашборд — вторая система вывода: read-only витрина состояния из health.db плюс точечная
    inline-правка. Две несущие вещи, не про вёрстку. Он не создаёт своей истины — читает и пишет
    ту же каноническую БД через общий слой, не держит отдельной копии состояния. И он не
    запускается в режиме записи не на Studio: fail-fast на старте, иначе 14 POST-эндпоинтов могли бы
    устроить split-brain через iCloud-синк. Доступ — только из частного tailnet, без публичного
    funnel: периметр вместо пароля.
  explanation: docs/explanation/dashboard.md
  code_anchors:
    - dashboard.py::_lifespan
    - dashboard_db.py::_w
    - dashboard_db.py::_log_edit
  invariants:
    - id: write_guard_primary_only
      claim: "Дашборд в режиме записи fail-fast на не-primary (raise на старте без ALLOW_WRITE_NONPRIMARY), защищая канон от split-brain через iCloud — 14 POST-эндпоинтов пишут прямым sqlite3 (census 2026-09-26; PUT/DELETE/PATCH=0). История цифры: 31 (Sprint 5/F-111) → 16 (снят experiments-эндпоинт, 2026-07-10, BL-EXP-1) → 15 (снята правка периодов со страницей /events) → 14 (снята правка консультаций со страницей /consultations; обе 2026-09-26)."
      status: holds
      check:
        file: dashboard.py
        present: ["_is_primary", "ALLOW_WRITE_NONPRIMARY", "split-brain"]
    - id: db_as_single_truth
      claim: "Дашборд читает и пишет ту же health.db через общий слой (dashboard_db._q/_w), не держит своей копии состояния; правки логируются (_log_edit). ИСКЛЮЧЕНИЕ (санкционированный операторский путь, api_lab_review): ревью анализов читает staging (mode=ro) и промоут-пишет в канон ЛЮБОГО тенанта по параметру tenant (роль ревьюера, не runtime-пользователя; санитизация анти-traversal). Взаимная видимость тенантов — принятая договорённость владельца с партнёром (2026-07-18), не изъян."
      status: holds
      check:
        file: dashboard_db.py
        present: ["_q", "_w", "_log_edit"]
    - id: no_auth_tailnet_only_open
      claim: "У дашборда НЕТ аутентификации — периметром служит частный tailnet (слушает только tailscale-IP, без funnel). Осознанный принятый риск для семейной сети, но для мед-данных это допущение, не гарантия: кто в mesh — видит всё."
      # open (4-я колонка): accepted risk (F-1), не изъян-по-недосмотру — но и не
      # закрытая безопасность. Периметр ≠ аутентификация. Помечаем честно.
      status: open
      closes_when: "РЕШЕНИЕ ВЛАДЕЛЬЦА, а не замер: либо аутентификация построена, либо риск принят записью с датой и названным условием пересмотра"
      closes_when_by: claude
      warm_guard:
        absent: ["дашборд защищён аутентификацией", "доступ ограничен паролем", "данные под замком"]
        absent_en: ["dashboard is protected by authentication", "access is password-protected", "data are locked"]
    - id: lan_ingest_write_only
      claim: "Приём с телефона по домашней Wi-Fi (ingest_lan.py, решение владельца 02.10.2026: простой путь по умолчанию в инструкции, Tailscale рекомендован как безопасный) — отдельный процесс на порту 8011 только с маршрутами записи под токеном (/hae/ingest, /hae/ecg, /location/ingest): страниц дашборда нет, браузерные запросы (Origin, Sec-Fetch-Site) отвергаются. В установке в Докере порт по умолчанию на loopback; в Wi-Fi — только по install.sh --lan-ingest. Разделение по порту, а не по адресу клиента (за пробросом Colima адрес не виден). Принятый риск: http без шифрования внутри Wi-Fi и отправка вне дома на тот же адрес — названы в инструкции. Сторож — tests/unit/test_ingest_lan.py (подключить views или снять фильтр браузеров — красные)."

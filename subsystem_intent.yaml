- id: night_decision_loop
  title: "Ночной конвейер решений: находка получает имя, класс и срок"
  intent: >
    Поток сообщений без устойчивой идентичности не даёт управлять находками:
    меняющийся счётчик может каждый день выглядеть новой проблемой.
    Конвейер даёт находке имя (одно на предмет), класс (моё чиню · в сводку ·
    твоё решение), дом (карточка со статусом) и
    срок (через две недели молчания решается умолчанием). Тихих отказов здесь четыре, и
    все опасны одинаково: автономный актор повысил себе права и решил медицинское сам;
    карточка закрылась умолчанием там, где умолчания быть не должно; имя находки
    разъехалось между двумя домами и один предмет стал двумя; датчик замолчал по слепоте,
    и «ошибок нет» стало неотличимо от «я ничего не смотрел». Снаружи каждый выглядит как
    тишина, а тишина здесь — штатное состояние.
  explanation: docs/explanation/night_cycle.md

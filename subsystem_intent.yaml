        present: ["ОДНА ПРАВКА = ОДНА СТРОКА", "for ch in changes or []"]
    - id: repeat_is_counter_not_duplicate
      claim: "Та же правка (proposal_dedup_key) от того же источника при живом pending → repeats+1, last_proposed_at=now, текст обновлён; строка не гасится и не дублируется. Expiry считает возраст от last_proposed_at."
      status: holds
      check:

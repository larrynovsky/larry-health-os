# Словарь ворот допуска — ЕДИНСТВЕННЫЙ дом имён. Diátaxis: reference.
#
# ЗАЧЕМ ОТДЕЛЬНЫЙ ФАЙЛ. Имена ворот разъехались молча: мы называли профиль по периодам
# «Gate 3», автор критерия называет его «Gate 2», и обнаружилось это только чтением его
# финального словаря 2026-08-01 — то есть через два раунда переписки о порогах, где
# номер ворот несёт смысл. Класть словарь в signal_family.yaml нельзя: тот файл заморожен
# правилом «менять только ре-объявлением version↑», привязанным к валидности p, а
# глоссарий к валидности p отношения не имеет и обновляться будет чаще.
#
# ИСТОЧНИК: «Ответ на Дополнение 3: спецификация синтетики и финальный словарь»
# (2026-08-01, docs/explanation/statistik/). Порядок исполнения — тот, что в таблице §3.
#
# ПОЛЕ implemented — граница ДОКАЗАННОГО, а не план. `false` означает «механизма нет»,
# и это честнее, чем отсутствие строки: отсутствие читается как «не думали».
# Сторож имён: tests/consistency/test_gate_vocabulary.py

source: "статистик, ответ от 2026-08-01, раздел 3"
adopted_at: "2026-08-01"

gates:
  "Gate 0":
    name: "Structural Block"
    what: "блокировка по реестру явных структурных зависимостей (один прибор, часть-целое); транзитивность НЕ применяется"
    implemented: true
    where: "correlation_gate.py::_derived_metrics"
    note: "Алгоритмические производные одного конвейера блокируются по происхождению вычисления: числовой порог корреляции не заменяет проверку зависимости. Реестры part_whole_pairs и algorithmic_derived_pairs в signal_family.yaml читает STRUCTURAL_PAIRS; результат записывается в structural. Фильтр применяется после BY, не меняя p, размер семьи или её версию. Прохождение статистических ворот само по себе не доказывает содержательную связь."

  "Gate 0.5":
    name: "Suppression Detector"
    what: "блокировка скрытых тавтологий Y=X/Z: частная корреляция при фиксации Z=время в постели раскрывает near-deterministic связь"
    implemented: true
    where: "correlation_gate.py::_gate05_suppressed"
    note: "Правило: частная Пирсон-корреляция |r(X,Y|Z)|≥0.80 И |частная|>|сырая| (ratio>1 — сигнатура подавления). Z должен быть независимо измеренным знаменателем, а не восстановленной из X и Y величиной. ПОСТ-BY фильтр. Используется Пирсон: R² интерпретируется как доля объяснённой дисперсии. N/A, когда Z нет или полных троек <30, — не блокирует. Оракул — synthetic_controls: tautological блокируется, positive-common-cause не блокируется."

  "Gate 1":
    name: "Statistical Significance"
    what: "перестановочный тест с сохранением автокорреляции; p <= BY-порог семьи"
    implemented: true
    where: "correlation_gate.py::_gate_daily"

  "Gate 2":
    name: "Period Profile"
    what: "устойчивость знака и величины по заданному разбиению на периоды смены режима, с допуском на короткие периоды"
    implemented: true
    where: "correlation_gate.py::_epoch_profile"
    note: "Двухкомпонентный критерий: медиана корреляций по периодам ≥ r_min И доля согласного знака ≥ sign_min. Доля знака считается относительно знака медианы; это операционное определение словесного требования устойчивости. Дом порогов — gate2_profile в signal_family.yaml, применение — correlation_gate._gate2_blocked, сводка — _epoch_summary. ПОСТ-BY фильтр: permutation-p и размер семьи не меняются. N/A без профиля — не блокирует. Пороги выбираются на контролях с известной правдой; прохождение профиля не отменяет проверки структурных зависимостей в Gate 0 и Gate 0.5."

  "Gate 3":
    name: "Leave-One-Period-Out"
    what: "робастность к влиятельным периодам: удаление одного периода не должно менять r более чем на дельту"
    implemented: false
    why_absent: "механизма нет; дельта в спецификации автора числа не имеет и калибруется нами на синтетике"

  "Gate 4":
    name: "Autocorrected CI"
    what: "нижняя граница 95% доверительного интервала с поправкой на N_eff должна превышать пол r"
    implemented: false
    why_absent: "механизма нет; доверительных интервалов с поправкой на эффективный размер выборки в гейте не считается вовсе"

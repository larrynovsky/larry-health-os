  last_reconciled: "2026-09-15"


- id: self_monitoring
  orchestrators: [run_checks.sh, run_full_test_suite.sh, watch_and_test.sh]   # не-.py носитель: ежедневный гейт 07:50 (carrier-fix 2026-07-23, [[feedback_guard_filtered_wrong_carrier]])
  title: "Само-мониторинг: система стережёт саму себя"
  intent: >
    Всё остальное работает — и в тихий день одна из проверок начинает падать, а ты не
    узнаёшь, если сигнал уходит в лог, который никто не читает. Поэтому: ежедневная проверка
    целостности (свежесть данных, ядро метрик, integrity базы), а правило поверх всего —
    проверять путь сигнала до тебя ЦЕЛИКОМ, а не наличие проверки. Предупреждения доставляются
    по mute-списку (доставляем всё, кроме явного неактонируемого шума), не по whitelist —
    чтобы падение не потерялось между «поймали» и «сказали».
  explanation: docs/explanation/self_monitoring.md
  code_anchors:
    - integrity_tests.py::check
    - integrity_tests.py::check_db_integrity
    - triage_agent.py::run_triage
  invariants:
    - id: daily_integrity_check
      claim: "Ежедневная проверка целостности (07:50): integrity базы, свежесть данных, полнота ядра метрик; критическое падение поднимает флаг, не тонет в логе."
      status: holds
      check:
        file: integrity_tests.py
        present: ["integrity_check", "critical", "check_db_integrity"]
    - id: detect_with_delivery
      claim: "Предупреждения доставляются по mute-списку, не whitelist: доставляем всё, кроме явного неактонируемого шума — закрывает «детект без доставки» (раньше failures из integrity дропались)."
      status: holds
      limits:
        - "Доставка до ЧИНЯЩЕГО есть только там, где живёт ночной ремонт (у владельца — Studio). У постороннего на своей установке сбой ложится в инженерную очередь, которую никто не разбирает; поэтому бот обещает починку только при свежей отметке ремонта (notify.repairer_alive), иначе даёт оператору код сбоя (нить first-contact, 02.10)."
      check:
        file: triage_agent.py
        present: ["MUTE_WARN", "детект без доставки"]
    - id: external_registry_incomplete_open
      claim: "CBCR load-bearing (manifest + 95 wiki-концептов) перенесён из iCloud в git (methodology/cbcr — СК-1 устранён), зарегистрирован в external_dependencies.yaml и под сторожем integrity_tests (наличие+непустота; падение → гипотезы деградируют молча)."
      # Сверено 2026-07-11: cbcr_hypothesis.MANIFEST_PATH + cbcr_lookup.WIKI_DIR → git
      # (repo-relative, не iCloud/эвикт); external_dependencies.cbcr_methodology; датчик
      # check_cbcr_methodology_present (+ позитивный контроль). Прочие ~80 .md в cbcr/ код
      # НЕ читает (read_cbcr_concept = top-level glob) — не load-bearing, оставлены в iCloud.
      # warm_guard оставлен инертным — перевзвод при откате в open.
      status: holds
      check:
        file: tests/unit/test_cbcr_methodology_sentinel.py
        present: ["test_cbcr_sentinel_fails_when_wiki_missing", "check_cbcr_methodology_present"]
      warm_guard:
        absent: ["все внешние артефакты под сторожем", "каждая зависимость зарегистрирована", "ничего не забыто"]
        absent_en: ["all external artifacts are guarded", "every dependency is registered", "nothing is forgotten"]
    - id: job_coverage_is_read_from_code
      claim: "Что задача по расписанию покрыта датчиком факта исполнения, для датчиков на `_schedule_covers(<метка>)` читается из кода integrity_tests (зарегистрированная проверка + метка), а не пишется рукой в MONITORED; ручная копия вычисленного покрытия — находка. Повод: 07.08 и 07.09 перепись кричала «нет датчика» о покрытых задачах — строку в MONITORED забывали внести."
      status: holds
      limits:
        - "Вычисляется только покрытие через `_schedule_covers`; датчики по порогу-литералу и косвенные (дайджест, dead-man) по-прежнему записаны руками и могут разойтись с кодом."
        - "Метка засчитывается, если это литерал или модульная строковая константа; выражение не угадывается — такое покрытие не будет найдено и перепись закричит «нет датчика» (громко, не молча)."
      check:
        file: producer_registry.py
        present: ["def schedule_judged_labels", "записано и руками"]
    - id: liveness_sensor_does_not_read_bad_stamp_as_alive
      claim: "Датчик живости джоба на нечитаемом штампе времени говорит «не судимо», а не молчит, и «нет таблицы» не прячет иную ошибку чтения. Аудит 23.09 (A6): в семи датчиках живости 11 тихих обработчиков, 8 получили сигнал, 3 — сверенное делегирование; вне строгой зоны сторожа тишины в integrity_tests.py тихих обработчиков нет."
      status: holds
      limits:
        - "Строгая зона — поимённый список функций сторожа; новый датчик вне списка стоит только под числовым ратчетом всего файла."
      check:
        file: tests/consistency/test_silent_handler_guard.py
        present: ["LIVENESS_FUNCS", "NOT_AUDITED: dict[str, int] = {}"]
    - id: liveness_alarms_on_first_missed_run
      claim: "Датчик живости задачи по расписанию краснеет после ПЕРВОГО пропущенного запуска, и допуска-числа у него нет: ритм берётся там, где он объявлен. launchd-задачи — живой плист (календарь или StartInterval); джобы бота — квитанция, в которую джоб пишет свой ритм тем же числом, каким регистрируется ({every_s, started_at}); бриф — время и пояс из system_config тенанта; канал доставки — последний понедельничный дайджест. Решение владельца 23.09 («общее правило») вместо своего допуска у каждого из восьми датчиков (триаж 2д, канал 9д, ротация 2ч, reschedule 26ч, консолидация и подъёмник 48ч, бриф 3д, бэкап 25ч)."
      status: holds
      limits:

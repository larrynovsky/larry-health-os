- id: problem_list_proposals
  title: "Предложения к медкарте: правка — единица решения владельца"
  intent: >
    Список проблем — медкарта, её меняет владелец. Модели (GP-ревьюер еженедельно, кураторы
    литературы и выживания) только предлагают правки; одобрение — одно нажатие в боте или дашборде.
    Единица предложения — одна правка, не пачка: спорная строка не должна блокировать остальные.
    Повтор той же правки — счётчик «предлагается N-ю неделю», а не новая строка и не тихое гашение
    прошлой. Независимо придуманный пример: предложение учебного состояния Example_Condition_A
    теряется, если следующая пачка гасит предыдущую по пересечению problem_id до решения владельца.
    Идентичность «добавить» решают данные — standing-условие clinical_kb/_index.yaml (тот же regex,
    что потом активирует строки таблицы питания), не slug модели. «Добавить», покрытое живой
    проблемой медкарты, — дубль записи и не сохраняется. Так лабораторная находка доходит до
    медкарты руками владельца — одним нажатием, не набором текста. Пример вымышленный и не
    утверждает диагноз.

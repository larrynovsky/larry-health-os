common.help.commands: "*What you can do*\n\n*Automatic reports*\nMorning report — every day at {brief_time}, your local time.\nWeekly review — {weekly_days} at {weekly_time}.\nMonthly report — day {monthly_day} of each month at {monthly_time}.\nYour weekly review and monthly report use {report_timezone} time.\n\n*Getting started*\n/start — start a chat\n/help — this guide\n/about — restart the introduction to change your answers\n\n*Data and reports*\n/report — get your morning report now\n/sleep — your sleep data from the past week\n/labs — your latest key lab results\n/weekly — your weekly review\n/monthly — your monthly report\n/memory — what I remember about you\n/genome — significant variants; you can add a question\n/genome\\_update — check for new information about variants\n\n*Wellbeing and plans*\n/checkin — chat about your day\n/experiment — what you're trying and how your measurements change\n/tasks — your tasks and questions\n/problems — your health concerns and suggested changes\n/hypotheses — possible explanations and their review\n/protocols — your active action plans\n/consult — AI consultation: AI specialists discuss your question\n/visit — prepare a summary for your doctor; you can add a date\nExample: /visit 2030-01-15\n/map — how to clarify a test name\n/cancel — stop a photo review if one is in progress\n\nUse the buttons under messages to confirm, reject, run a hypothesis check, prepare a request for your doctor, close a task or end a conversation. You can leave these for later — nothing happens until you choose.\n\nYou can also just send a message: ask questions or tell me how you feel. I'll remember the important details."


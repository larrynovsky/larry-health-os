owner.weekly.upstream: "У открытого проекта, откуда взяты описания врачей-специалистов, вышли обновления. Для тебя пока ничего не меняется."
owner.weekly.docs: "Описание работы системы обновлено."
owner.weekly.translation: "Перевод описания системы обновлён."
owner.weekly.unblocked: "Обновление системы на время застряло и продолжилось само. Делать ничего не нужно."
owner.weekly.regression: "Проверки несколько раз находили одну и ту же техническую ошибку. Твои данные о здоровье не пострадали; разбираю сам."
owner.card.template: "{subject}\n\n{question}\n\nВарианты:\n{options}\nЕсли промолчишь — {silence}."
owner.card.option: "• {option} — {cost}"
owner.card.wait: "решение останется ждать тебя, ничего не изменится"
owner.card.default: "{on} будет применён вариант «{choice}»"
owner.card.heldout: "Про систему, не срочно. Раньше система нашла связи в твоих данных (например: «после плохого сна падает вариабельность пульса»). Накопились новые данные, по которым можно проверить, правда ли эти связи держатся. Что делать с результатом?\n\nВарианты:\n• Разобрать вместе с Claude — займёт минут 10; дальше в объяснениях отчёта остаются только подтвердившиеся связи.\n• Отложить — в отчётах пока могут встречаться связи, которые не подтвердились.\nЕсли промолчишь — отчёты будут объяснять как раньше, проверка подождёт."
owner.card.lag: "Про систему, не срочно. Найдены связи с задержкой: одно влияет на другое через день-два (например: «плохо спал — через два дня ниже вариабельность пульса»). Проверять ли их отдельно, прежде чем упоминать в отчётах?\n\nВарианты:\n• Сначала проверить на новых данных — такие объяснения появятся в отчётах позже.\n• Упоминать сразу с оговоркой «может быть случайностью» — раньше, но иногда ошибочно.\nЕсли промолчишь — отчёты будут упоминать их как раньше."
owner.card.stalled: "Про систему, не срочно. Работа «{work}» стоит {days}. Доделать её или закрыть?\n\nВарианты:\n• Доделать — Claude вернётся к ней в ближайшей сессии.\n• Закрыть — результата не будет, но и висеть она перестанет.\nЕсли промолчишь — работа останется на паузе."
owner.card.stalled_older: "Про систему, не срочно. Ещё работ, которые стоят с прошлых недель: {count}. Разобрать их?\n\nВарианты:\n• Разобрать по одной вместе с Claude — займёт минут 10.\n• Оставить на паузе.\nЕсли промолчишь — они останутся на паузе."
owner.card.stalled_subject: "Какие из вставших работ доделать, а какие закрыть? Список покажет Claude по фразе «разбери решения»."
owner.card.secret: "‼️ Про систему, СРОЧНО (в течение суток). В тексте, который система собиралась отправить во внешний сервис, оказался секретный ключ — это как пароль от твоего аккаунта в сервисе. Отправку я остановил. Ключ нужно заменить: если его кто-то увидел, он может пользоваться сервисом от твоего имени.\n\nВарианты:\n• Заменить сейчас — Claude подскажет, где нажать в настройках сервиса (минут 5); старый ключ перестанет работать.\n• Сначала выяснить, куда он мог попасть — но пока ключ не заменён, риск остаётся.\nЕсли промолчишь — отправка так и будет стоять, а ключ останется прежним."
owner.card.model_retired: "Про систему, важно. Сервис ИИ перестал поддерживать модель, на которой работает часть бота (например, утренний отчёт или разбор гипотез). Выбрать замену?\n\nВарианты:\n• Подобрать замену — Claude проверит новую модель; цена и стиль ответов могут немного измениться.\n• Ничего не менять — затронутые части бота перестанут отвечать.\nЕсли промолчишь — замены не будет, и эти части так и будут молчать."
owner.card.model_switched: "Про систему, для сведения. Сервис ИИ перестал отвечать моделью {old}, и система сама перевела эту часть работы на {new} — следующую модель из списка проверенных. Делать ничего не нужно."
owner.card.model_switched_back: "Про систему, для сведения. Модель {new} снова доступна, и система вернула на неё эту часть работы (временно работала {old}). Делать ничего не нужно."
owner.card.models_admitted: "Про систему, для сведения. Проверила новые модели ИИ на задачах системы. Прошли и стали запасными: {passed}. Не прошли: {failed}. Потрачено на проверки в этом месяце до {spent} $ из {cap} $. Делать ничего не нужно."
owner.card.intake: "Про здоровье, не срочно. Пришёл новый документ с анализами, система распознала из него числа. Сверить их с бланком?\n\nВарианты:\n• Сверить — это сделает Claude по фразе «разбери решения»; страница для сверки: {url}\n• Отложить — числа из этого документа пока не попадут в отчёты.\nЕсли промолчишь — они подождут сверки."
owner.investigator.language: "owner_ask пишется для человека без навыков программирования; файлы и команды он не открывает. subject — одна строка: что именно случилось, конкретно и по уликам (что, сколько, с какого дня), без оценок и без рамки. question начинается одной фразой: про его здоровье это или про систему и насколько срочно; дальше сам вопрос. Пиши только то, что есть в уликах: не придумывай исполнителей (делает Claude, решает он — других людей нет), причины и сроки; не пиши «неизвестно, кто и зачем» — если это выясняется по данным, это работа Claude, а не вопрос владельцу. Обращайся на «ты», без «мы». Пример из жизни — только если без него понятие не понять, одной фразой; сравнение не заменяет факт. В cost каждого варианта — что изменится для него. Что будет, если он промолчит, не пиши: эту строку добавит система. Никаких имён файлов, кодов, английских терминов."


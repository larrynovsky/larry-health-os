- id: mcp_gateway
  title: "Облачные помощники: одна память, вход через бот, наружу только MCP"
  intent: >
    Владелец спрашивает о здоровье в Claude и ChatGPT, в том числе с телефона, а отвечают они по
    данным Health OS. Решения владельца 06.10: Health OS — одна память, бот и помощники — окна в неё
    (вариант Б); сразу облако, без шага «только Мак»; ChatGPT тоже — данные о здоровье по запросу
    владельца уходят и в OpenAI; отдельный узел tailnet health-mcp, чтобы публичный адрес не
    открывал ни дашборд, ни соседей Studio; анализы читаются по веществу (LOINC), а не по названию.
    Первый живой разговор (07.10) показал второй вид выдумки:
    получив сырые таблицы, помощник сам вывел ограничения из диагнозов — закрытую проблему подал главным
    ограничением, а правило питания, которое система уже вывела кодом, переоткрыл у владельца только
    в споре. Вывод владельца 07.10: облако должно видеть то же, что бот, — один
    читатель контекста, а не пять сырых; правила еды консилиума, ещё не одобренные владельцем, отдаются
    с пометкой «не одобрено», а не прячутся: выдумка без источника хуже вывода системы с пометкой.
    Главная тревога владельца — выдумка поверх данных: пустоту модель заполняет догадкой. Поэтому
    каждый ответ ИНСТРУМЕНТА (то, что получает помощник, а не то, что он пишет человеку) несёт
    источник и дату, а пустота — явная строка «нет данных», а не пустой список. Вход — OAuth 2.1 со
    своим маленьким сервером на одного человека: пароля нет вовсе, код из шести цифр приходит
    владельцу в Telegram — кто не видит его Telegram, не войдёт. Шаг 1 — только чтение; запись
    (шаг 2) — только через «да» владельца, отдельным кодом. Граница: ответы инструментов уходят в
    Anthropic и OpenAI и остаются у них по их правилам и настройкам аккаунта владельца — хранение,
    история чатов, обучение решаются там, не нами; что чужая модель сделает с ответом, мы не
    контролируем; кривизну канона (например, норму анализа, записанную не в той шкале, что
    значение) помощник повторит как факт.

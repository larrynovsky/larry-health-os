# methodology/clinical_kb/_index.yaml — свод состояний установки (шаблон).
#
# Движок не знает ни одной болезни: он матчит триггеры состояний отсюда против ДАННЫХ тенанта
# (проблем-лист, ИМТ, геном) и получает набор активных состояний. Свод пуст — ни одно
# состояние не активно, работают только общие правила. Дописывает тенант (или его врач).
#
# Формат (пример — выдуманный, не активен, пока закомментирован):
#   - id: iron_deficiency
#     temporal_class: standing          # durable | standing | transient
#     description: "дефицит железа"
#     trigger:
#       problem_regex: 'дефицит\w*\s+желез|iron.{0,12}deficien'
#     lit_term: "iron deficiency"       # необязательно: тема литературы для этого класса
#     labs:                             # необязательно: анализы, которые класс делает нужными
#       Ferritin: {days: 90, priority: high}
conditions: []

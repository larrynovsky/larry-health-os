    - id: quote_checked_against_text
      claim: "Предложение несёт дословную цитату; у PDF с текстовым слоем цитата, которой нет в тексте, отбрасывается (выдумка модели); у снимка сверка идёт с OCR tesseract, расхождение помечает карточку, а не отбрасывает её."
      status: holds

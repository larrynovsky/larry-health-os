    - id: bp_second_source
      claim: "У давления есть второй, независимый путь: облако Withings → import_withings → bp_readings (каждый замер со временем и пульсом). bp_readings — зеркало облака: замер, удалённый в приложении Withings, удаляется и здесь; пустой ответ при непустой истории — отказ, а не стирание. Повод (живая сверка 05.10): часть замеров есть у Withings и в «Здоровье», но до daily_metrics через HAE не дошла; за один день HAE прислал среднее, куда вошёл замер, уже удалённый в Withings. Кто пишет дневное давление — инвариант bp_day_owner_withings."

- id: report_absence_claims
  title: "Отчёт не утверждает отсутствие анализа, у которого есть строка"
  intent: >
    Фраза «анализ не сдавался» читается врачом и владельцем как факт и меняет решение:
    сдать впервые или сравнить с прошлым значением. Модель выводит эту фразу из
    ОТСУТСТВИЯ строки в показанном ей блоке — а блок не канон, а его срез. Любой фильтр
    между базой и промптом (ручной список имён, временнóе окно) превращает «я этого не
    вижу» в «этого не было», и снаружи поломка невидима: отчёт остаётся связным и
    уверенным, а ложь в нём адресная. Поэтому граница среза объявляется в самом блоке,
    а текст отчёта судится против канона, а не против того, что модели показали.
  explanation: docs/explanation/report_absence_claims.md
  code_anchors:
    - gp_context.py::absent_claims_contradicted
    - gp_agent.py::_guard_absent_claims
    - labs_db.py::canon_window_note
  invariants:

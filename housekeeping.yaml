# housekeeping.yaml — Studio footprint registry for health_scripts
# Source: external inventory (2026-11-02) reviewed and corrected by project Claude agent.
# EVERYTHING status: declared. restart_safe is agent-declared, NOT owner-confirmed.
# Subsystem ids verified against subsystem_intent.yaml (2026-11-02).
# Rule: any task that adds a Studio-side artifact MUST update this file in the same commit.
project: health_scripts
registry: subsystem_intent.yaml
studio_paths:
- ~/health_scripts (working tree, updateInstead)
- ~/health
- ~/health_partner
- ~/.health_reference
- ~/container_backups/health
- ~/health/backups
subsystems:
  data_ingestion:
    owns:
      services:
      - label: com.larry.health.backup
        plist: ~/Library/LaunchAgents/com.larry.health.backup.plist
        state: loaded
        schedule: 03:00
        program: /bin/bash ~/health_scripts/backup_studio.sh
        log: ~/health/logs/backup.log
        note: DB backups of all tenants (backup_studio.sh); no closer subsystem id; consider code_backup or a new db_backup id
        map_confidence: guess
        restart_safe: false
        restart_safe_note: false while 03:00 run is in progress (corrupt backup), true otherwise
        restart_safe_by: project_claude_agent_review_2026-11-02
      - label: com.larry.health.import-poll
        plist: ~/Library/LaunchAgents/com.larry.health.import-poll.plist
        state: not_loaded
        schedule: every 5 min
        program: /opt/homebrew/bin/python3.11 ~/health_scripts/import_all.py
        log: ~/health_import_poll.log
        note: plist exists, job not loaded (dead config?)
        map_confidence: high
      - label: com.larry.health.import-watchdog
        plist: ~/Library/LaunchAgents/com.larry.health.import-watchdog.plist
        state: not_loaded
        schedule: every 120 min
        program: /opt/homebrew/bin/python3.11 ~/health_scripts/import_watchdog.py
        workdir: ~/health_scripts
        log: ~/health/logs/import_watchdog.log
        note: plist exists, job not loaded (dead config?)
        map_confidence: high
      - label: com.larry.health.watcher
        plist: ~/Library/LaunchAgents/com.larry.health.watcher.plist
        state: not_loaded
        schedule: KeepAlive
        program: /bin/zsh ~/health_scripts/watch_and_import.sh
        log: ~/health_watcher.log
        note: plist exists, job not loaded (dead config?)
        map_confidence: high
      - label: com.larry.health.calendar-sync.partner
        plist: ~/Library/LaunchAgents/com.larry.health.calendar-sync.partner.plist
        state: loaded
        schedule: :05 hourly
        program: /opt/homebrew/bin/python3.11 ~/health_scripts/google_calendar_fetcher.py
        workdir: ~/health_scripts
        log: ~/health_scripts/logs/calendar_sync_partner.log
        map_confidence: guess
      - label: com.larry.health.calendar-sync
        plist: ~/Library/LaunchAgents/com.larry.health.calendar-sync.plist
        state: not_loaded
        schedule: :05 hourly
        program: /opt/homebrew/bin/python3.11 ~/health_scripts/google_calendar_fetcher.py
        workdir: ~/health_scripts
        log: ~/health_scripts/logs/calendar_sync.log
        note: plist exists, job not loaded (dead config?)
        map_confidence: guess
      - label: com.larry.health.oura-import.partner
        plist: ~/Library/LaunchAgents/com.larry.health.oura-import.partner.plist
        state: loaded
        schedule: 08:00; 11:00; 14:00; 17:00; 20:00
        program: /bin/bash -c /opt/homebrew/bin/python3.11 ~/health_scripts/import_oura.py 2 >> ~/health_oura_import_partner.log 2>&1
        log: ~/health_oura_import_partner.log
        map_confidence: high
      - label: com.larry.health.oura-import
        plist: ~/Library/LaunchAgents/com.larry.health.oura-import.plist
        state: not_loaded
        schedule: 08:00; 11:00; 14:00; 17:00; 20:00
        program: /bin/bash -c /opt/homebrew/bin/python3.11 ~/health_scripts/import_oura.py 2 >> ~/health_oura_import.log 2>&1
        log: ~/health_oura_import.log
        note: plist exists, job not loaded (dead config?)
        map_confidence: high
      - label: com.larry.health.withings-import
        plist: ~/Library/LaunchAgents/com.larry.health.withings-import.plist
        state: not_loaded
        schedule: 09:10; 21:10
        program: /bin/bash -c /opt/homebrew/bin/python3.11 ~/health_scripts/import_withings.py >> ~/health_withings_import.log 2>&1
        log: ~/health_withings_import.log
        note: plist exists, job not loaded (dead config?)
        map_confidence: high
      - label: com.larry.health.wellally-check
        plist: ~/Library/LaunchAgents/com.larry.health.wellally-check.plist
        state: not_loaded
        schedule: wd1 10:00
        program: /opt/homebrew/bin/python3.11 ~/health_scripts/check_wellally_updates.py --notify
        log: ~/health/logs/wellally_check.log
        note: plist exists, job not loaded (dead config?)
        map_confidence: guess
      containers:
      - name: health-ingest-1
        image: health-os:local
        docker_context: colima-health
        state: Up
        map_confidence: high
        restart_safe: unknown
        restart_safe_note: port 8011, role not described in subsystem_intent
        restart_safe_by: project_claude_agent_review_2026-11-02
      - name: health-caldav-1
        image: python:3.11-slim
        docker_context: colima-health
        state: Up
        map_confidence: guess
        note: CalDAV server, bind ~/.health_caldav
        restart_safe: false
        restart_safe_note: live CalDAV connections
        restart_safe_by: project_claude_agent_review_2026-11-02
      ports:
      - port: 8011
        proto: tcp
        bind: 127.0.0.1
        via: colima-health container health-ingest-1 (ssh tunnel to host)
      - port: 5232
        proto: tcp
        bind: 127.0.0.1
        via: health-caldav-1; Tailscale Serve https :5232 tailnet-only
      dirs:
      - path: ~/health/data
        kind: data
        size_mb: 2028
        last_modified: '2026-11-02'
        retention_proposal: never auto-clean (live health.db). hae_rest/ follows existing log_rotation compression after 14d
        note: contains health.db 99 MB + presnap_profile_20260926.db 97 MB + health.pre-waitingroom-20260921-*.db 97 MB = manual one-off copies
          (candidates once owner says so)
        status: declared
      - path: ~/health_partner/data
        kind: data
        size_mb: 438
        last_modified: '2026-11-02'
        retention_proposal: never auto-clean (partner tenant live DB)
        status: declared
      - path: ~/health_partner/backups
        kind: backup
        size_mb: 1824
        last_modified: '2026-11-02'
        retention_proposal: 'health_partner_YYYY-MM-DD.db: keep 30 d (backup_studio.sh already deletes >30 d). before_discovery_*: no longer expected
          here (see genome_effect_allele). pre_fitness_backfill_20260926.db: 37 d old, candidate for deletion if the job is closed (owner/agent
          decision).'
        note: 98 files; 88% of the size is 3 before_discovery snapshots
        status: declared
      - path: ~/container_backups/health
        kind: backup
        size_mb: 4029
        last_modified: '2026-11-02'
        retention_proposal: health_YYYY-MM-DD.db keep 30 d; one-off pre_* by owner decision
        status: declared
        note: 'Independent collection (NOT a mirror): written rw by 4 containers (health-bot/cron/lab-intake/ingest via bind mount /home/health/health/backups);
          health_partner_* are in ~/health_partner/backups (different tenant, different inodes, no APFS clone). before_discovery files gone as
          of 2026-11-02.'
      - path: ~/health_data
        kind: data
        size_mb: 692
        last_modified: 2026-08-13 (vcf_import.log)
        retention_proposal: owner decision (last write 2026-06-26)
        status: declared
        never_touch_note: ULGEDCBG2561.vcf (689 MB genome source) is irreplaceable without re-download
      - path: ~/health_staging_runs
        kind: tmp
        size_mb: 1262
        last_modified: '2026-10-18'
        retention_proposal: 13 run dirs; delete runs older than 30d when no running job references them
        status: declared
      - path: ~/health_staging
        kind: tmp
        size_mb: 435
        last_modified: '2026-09-28'
        retention_proposal: owner decision
        status: declared
      - path: ~/health/backups
        kind: backup
        size_mb: 3946
        file_count: 121
        last_modified: 2026-09-30 (daily dbs); -shm files touched 2026-10-31
        retention_proposal: 'PRE-CONTAINERIZATION path, superseded by ~/container_backups/health. Daily health_*.db all >30 d: delete after owner
          confirmation; one-off pre_* (Aug 30): owner decision; check why -shm files were touched 2026-10-31 before deleting.'
        status: declared
    never_touch:
    - ~/health/data/health.db
    - ~/health_partner/data
    - ~/.health_secrets*
    - ~/.health_caldav
    - ~/health_data/ULGEDCBG2561.vcf
    schedule_windows:
    - busy 03:00-05:30 (backup 03:00, assessment 03:30, survivorship Mon 03:30, literature 04:00/04:30, consilium 1st 04:00) and 07:40-09:00 (machine-check
      07:40, integrity 07:50, night-cycle 08:00, night-repair 08:40); pgs before_discovery snapshot (16.5 GB) created ~07:00
    restart_safe: false
    status: declared
    restart_safe_by: project_claude_agent_review_2026-11-02 (aggregate of children)
  norm_from_documents:
    owns:
      dirs:
      - path: ~/health_reference
        kind: data
        size_mb: 232
        last_modified: '2026-07-29'
        retention_proposal: owner decision (reference norms, 2026-07-29)
        status: declared
      - path: ~/health_review_533
        kind: tmp
        size_mb: 13
        last_modified: '2026-07-26'
        retention_proposal: one-off review dir, 2026-07-26; candidate tmp 30d
        status: declared
    never_touch:
    - ~/health_reference
    restart_safe: unknown
    status: declared
  genome_effect_allele:
    owns:
      services:
      - label: com.larry.health.pgs-discovery.partner
        plist: ~/Library/LaunchAgents/com.larry.health.pgs-discovery.partner.plist
        state: retired_2026-11-02
        retired_note: 'removed (thread pgs-coverage, owner decision 02.11): the bot job discover_pgs_monthly
          (day 2) is the single trigger per tenant; repo copy launchd/…partner.plist deleted, tenant_services.yaml
          pgs-discovery excluded, placement.yaml none. Unloaded from launchd after deploy.'
        schedule: day5 03:00
        program: /opt/homebrew/bin/python3.11 ~/health_scripts/pgs_discovery.py
        workdir: ~/health_scripts
        log: ~/health_scripts/logs/pgs_discovery_partner.log
        note: 'Triggers pgs_discovery for partner tenant, day 5 03:00. A SECOND trigger is the bot job discover_pgs_monthly in health-bot-1 (jobs/scheduled.py:1421,
          day=2 07:00 tenant TZ) -> explains snapshots at 2026-10-02 07:01 and 2026-11-02 07:01. Purpose of before_discovery_*.db: rollback of
          ~/.health_reference/pgs.db if PRAGMA quick_check fails (pgs_discovery.py:238-247).'
        map_confidence: guess
        restart_safe: true
        restart_safe_note: batch, idempotent, misfire_grace_time=86400; not on day 2 / day 5 03:00-10:00 (quick_check on 16.5 GB takes hours)
        restart_safe_by: project_claude_agent_review_2026-11-02
      - label: com.larry.health.pgs-discovery
        plist: ~/Library/LaunchAgents/com.larry.health.pgs-discovery.plist
        state: not_loaded
        schedule: day5 03:00
        program: /opt/homebrew/bin/python3.11 ~/health_scripts/pgs_discovery.py
        workdir: ~/health_scripts
        log: ~/health_scripts/logs/pgs_discovery.log
        note: 'not loaded; superseded by discover_pgs_monthly in health-bot-1 (jobs/scheduled.py:1421). Do NOT load: would duplicate the bot job.
          Candidate for _retired (owner/agent confirms).'
        map_confidence: guess
        restart_safe: true
        restart_safe_note: batch, idempotent, misfire_grace_time=86400; not on day 2 / day 5 03:00-10:00 (quick_check on 16.5 GB takes hours)
        restart_safe_by: project_claude_agent_review_2026-11-02
      - label: 'bot-job: discover_pgs_monthly'
        container: health-bot-1
        source: jobs/scheduled.py:1421
        schedule: day=2 07:00 tenant TZ
        note: calls pgsd.discover_and_import_new_scores()
        state: running_in_container
        map_confidence: high
        restart_safe: false
        restart_safe_note: part of health-bot-1
        restart_safe_by: project_claude_agent_review_2026-11-02
      dirs:
      - path: ~/.health_reference
        kind: data
        size_mb: 2
        last_modified: '2026-11-02'
        retention_proposal: never (pgs.db 1.7 MB after pruning 778 useless scores + VACUUM on 2026-11-02 23:05; was 16.5 GB)
        status: declared
        note: 'snapshots: ~/.health_reference/snapshots/ (committed 489fa2e, 02.11: snapshot auto-deleted after successful quick_check,
          0 files at rest). A non-empty snapshots/ = failed quick_check -> NEVER clean automatically, needs rollback decision.
          Size: pruned to scores usable for at least one tenant (thread pgs-coverage, 02.11) — see pgs_rejected / discovery_runs tables.'
    never_touch:
    - ~/.health_reference/pgs.db
    - '~/.health_reference/snapshots/ (if non-empty: leftover = failed run)'
    schedule_windows:
    - ~07:00 on day 2 (bot job, both tenants); never run cleanup while discovery runs
    restart_safe: false
    status: declared
    restart_safe_by: project_claude_agent_review_2026-11-02 (aggregate of children)
  patient_answer_channel:

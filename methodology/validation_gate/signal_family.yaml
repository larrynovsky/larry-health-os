# Замороженная семья сигналов валидационного гейта (R1: гипотеза объявляется ОДИН раз).
# Источник истины для correlation_gate.py / longitudinal_analysis.py — что именно тестируется.
# ПРАВИЛО: менять только осознанным ре-объявлением (version↑ + дата + причина; метод карантина —
# отдельно, quarantine_epoch↑). НИКОГДА не
# подстраивать под результат — это ломает валидность p (§6 вердикта, пост-селекция).
# ИСКЛЮЧЕНИЕ из version↑ (записано 28.09 по коду, не новое правило): реестры структурных пар
# (part_whole_pairs, algorithmic_derived_pairs) режутся ПОСЛЕ BY: что тестируется, семья и m не меняются —
# меняется только рендер веры (correlation_gate.py, комментарий у Gate 0). Их правка — с датой и причиной
# у записи, без version↑; эпоху карантина это не трогает (она — quarantine_epoch, не version, с 23.09).
# Прецеденты: 7e6702d (25.09), 241d8ed (28.09).
# Load-bearing → в git, не iCloud. Diátaxis: reference.

version: 12
# v12 (2026-09-27, нить d-exact-shift) — РЕ-ОБЪЯВЛЕНИЕ МЕТОДА (R1), решение владельца.
# Перестановочный p семьи D (связи «в один день») — ТОЧНЫЙ перебор всех годных круговых
# сдвигов в окне пары вместо B=1000 случайных. Причина — BL-MCGAP-FLIP-1: пол
# p̂ = 1/1001 может быть выше шага BY ранга 1; на шумовом полу решение зависит от удачи
# Монте-Карло. Обсуждение метода шло после взгляда на исход; эмпирические итоги здесь опущены.
# Точный p детерминирован и снимает MC-шум по построению. Пол точного перебора
# ≈ 1/(1+L−2·guard): если он выше шага ранга 1, одиночная D-пара не пройдёт.
# Это ограничение длины ряда. Held-out confirm остаётся на b_perm (альфа 0.05,
# пол 0.001 ≪ альфы). Состав семьи, m, BY, фильтры, quarantine_epoch, frozen_at,
# lagged — не тронуты.
# v11 (2026-09-26, нить hae-fitness) — РЕ-ОБЪЯВЛЕНИЕ СОСТАВА ДО прогона (R1).
# Четыре показателя выносливости и подвижности из Apple Watch и ручного ввода,
# которые разборщик выбрасывал, входят в семью колонками:
# cardio_recovery_bpm, six_min_walk_m, stair_speed_up_ms, stair_speed_down_ms.
# Правило отбора то же, что у v8 — каждая числовая колонка daily_metrics.
# Структурных пар здесь нет: подъём и спуск — разные измерения, не часть-целое.
# Пары с общим окном < 365 дней (min_overlap_days, v10) в m не входят:
# до года общих данных BY-порог остальных не ужесточается; редкие замеры накапливаются дольше.
# quarantine_epoch, frozen_at, лаг-семья не тронуты.
# v10 (2026-09-25, нить new-sources) — РЕ-ОБЪЯВЛЕНИЕ МЕТОДА ДО прогона (R1), решение владельца 25.09
# Пороги объявляются до пробного прогона; вливание — только после него.
# Три правки, все про ДОСТУПНОСТЬ данных; пороги объявлены до взгляда на исход:
# (1) Перестановочный p daily-пары считается сдвигом ВНУТРИ общего окна пары (первый..последний
#     общий день на train) и только по годным сдвигам: p = (1+cnt)/(1+годных), как в лаб-пути и
#     в стратифицированной семье. Было: сдвиг по всей сетке; негодный сдвиг (общих дней <30)
#     считался «не превысил» (тянет p вниз), а сдвиги с малым перекрытием шумные (тянут вверх) —
#     у пар, покрывающих часть сетки, p зависел от длины ПУСТОЙ сетки, направление ошибки не известно
#     заранее. Замер 25.09 на синтетике H0 (4 раскладки покрытия): type-I старого 0.013–0.125, нового
#     0.025–0.055 (400 повторов). coverage_min держал такие пары вне веры — вместе с настоящими связями.
# (2) coverage_min 0.40 (доля ВСЕЙ сетки, пост-BY) → min_overlap_days 365 (общих дней пары на train,
#     ДО BY: меньше года — «не тестировалась», в m не входит). Год — полный сезонный цикл: связь,
#     увиденная меньше чем за год, неотличима от сезонного совпадения. Число выбрано по смыслу, не
#     по данным. Эффект: поздно подключённые источники получают суд, как только наберут
#     год общих дней, независимо от длины предшествующей пустой сетки.
# (3) frozen_at сдвигается сам: действующий = max(объявленный, последний конец квартала, от которого
#     до сегодня ≥ frozen_advance.min_tail_days). 84 дня = мощностная граница confirm из ADR
#     (r≤0.3 требует >84д; пол валидности 42д). Назад не ходит никогда (данные, которые discovery уже
#     видел, не могут стать confirm-окном). Сегодня (25.09) правило даёт 30.06 < 12.07 → остаётся
#     12.07; первый сдвиг — 23.12.2026 на 30.09.2026.
# quarantine_epoch НЕ бумпается: метод карантина не менялся. lagged НЕ тронута.
# v9 (2026-09-24, нить publication-tails, хвост data-parity) — РЕ-ОБЪЯВЛЕНИЕ СОСТАВА ДО прогона (R1):
# время засыпания и подъёма (sleep_start, sleep_end) входят в семью. В v8 их не взяли:
# час через полночь без отдельного метода неверен. Метод объявлен до взгляда на результат:
# время → минуты от ПОЛУДНЯ (metrics_db._clock_minutes — тот же перевод, что в общем блоке врачей).
# Иллюстративный пример, времена вымышлены: 23:10 и 00:40 рядом (670 и 760 минут от полудня).
# Разрыв шкалы — в 12:00. Корреляции на этой шкале корректны, пока засыпание/подъём не переходят полдень.
# Структурные пары — по определению (inbed = подъём − засыпание): [sleep_start, sleep_inbed],
# [sleep_end, sleep_inbed] — в algorithmic_derived_pairs. Расширение повышает m и ужесточает BY.
# sleep_total и sleep_end не тождественны: время засыпания и бодрствования может меняться.
# quarantine_epoch, frozen_at, lagged — не тронуты (метод карантина не менялся).
# v8 (2026-09-24, нить data-parity, BL-DATA-PARITY-1) — РЕ-ОБЪЯВЛЕНИЕ СОСТАВА.
# Цена названа заранее: m растёт → BY-порог строже → часть прежних связей может выпасть.
# Правило отбора ОДНО и объявлено ДО прогона: в семью входит КАЖДАЯ числовая колонка daily_metrics;
# не входят время суток (sleep_start/sleep_end — текст ISO; через полночь нужен отдельный метод)
# и категориальные (stress_summary, resilience_level — C-28: числовая корреляция неприменима).
# Структурные пары новых членов объявлены ПО ОПРЕДЕЛЕНИЮ (сумма стадий сна, сумма ккал), не по данным.
# Иллюстративная арифметика, числа вымышлены: total 8.0 = deep 2.0 + rem 2.0 + core 4.0;
# inbed 9.0 = total + awake 1.0. Под-индексы/композиты Oura — в derived по тому же правилу,
# что под-индексы readiness (решение 2026-07-12), не по результату.
# quarantine_epoch НЕ бумпается: метод карантина не менялся (разведено 23.09, нить family-epoch).
# frozen_at НЕ сдвинут. Новая колонка входит в панель, когда наберёт panel_min_days:
# до этого она «не тестировалась», а не «незначима». lagged НЕ тронута
# (отдельная семья q_lag с twin-валидацией; расширение предикторов — отдельное решение).
# quarantine_epoch (2026-09-23, нить family-epoch): эпоха МЕТОДА карантина — отдельно от version.
# До 23.09 одно поле version несло два смысла: «счётчик ре-объявлений семьи» (правило в шапке:
# менять семью — version↑) и «эпоха метода карантина» (quarantine_db.method_epoch →
# signal_family_v{N}: pending-строки ЧУЖОЙ эпохи не защищают пару). Ре-объявление, не меняющее
# метод карантина, бампом version снимало бы защиту с карантина молча (A3 22.09 поймал это
# полным прогоном). Теперь: состав/параметры семьи меняются → version↑; метод карантина
# меняется → quarantine_epoch↑; одно не тянет другое. Значение = прежней эпохе (7): строки
# карантина с signal_family_v7 остаются своими.
quarantine_epoch: 7
frozen_at: "2026-07-12"          # ОБЪЯВЛЕННЫЙ (нижняя граница); действующий — signal_family.FROZEN_AT
frozen_advance:                  # v10 (3): квартальный сдвиг по правилу, объявленному до прогона
  min_tail_days: 84
# 2026-09-22 (A3 fdr-online) — БЕЗ ре-объявления: pair_min_overlap (30) вынесен из литералов кода в
# gate_params, LAB_WINDOW_DAYS в longitudinal_analysis читается отсюда. Значения, состав семьи и метод НЕ
# менялись — сменился только дом числа. version НЕ бумпается намеренно: version = эпоха метода карантина
# (quarantine_db.method_epoch → signal_family_v{version}); бамп без смены метода сделал бы pending-строки
# карантина «чужой эпохи» и снял бы с их пар защиту. Тот же слой, что Gate 0 / Gate 2 (correlation_gate).
# Первая попытка A3 бампнула v8 — поймал полный прогон (test_gate_state_machine), не глаз.
redeclared_at: "2026-09-24"    # v8 — см. шапку (data-parity). v7 (2026-07-25, аудит датчиков fdr-online): имена аналитов приведены к КАНОНУ
                               # (CA19.9→CA19-9, Cholesterol→Cholesterol_Total). Состав ЗАМЫСЛА семьи НЕ менялся:
                               # оба аналита были в семье с 2026-07-12 — менялась РЕАЛИЗАЦИЯ чтения (строковое
                               # равенство вместо lab_canon). Из-за расхождения часть лабораторных замеров была
                               # невидима гейту. Переквалификация не требуется: лаб-путь descoped, в веру
                               # не подаётся, m daily-семьи не затронут. Значения НЕ подстроены под исход.
                               # v6 (2026-07-23, D1 fdr-online): panel_min_days вынесен из литерала correlation_gate.py в
                               # gate_params (единый оракул порога панели; значение 80 НЕ изменено, состав семьи НЕ тронут).
                               # v5 (2026-07-23, промоут лаг-класса fdr-online): направленный лаг-класс включён в
                               # веру как ОТДЕЛЬНАЯ семья q_lag (fdr_q_lag), derived-исключение направленных пар,
                               # BY на лаг-семье. Нуль валидирован twin'ом (v4), см. lagged.harness_validated.
                               # Бюджетный леджер (раскрытая сумма) — в notes ниже. Значения НЕ под исход.
                               # v3 (2026-07-22, Фаза 2 fdr-online): + стратифицированный A-гейт (strat_hi, c*, B_strat).
                               # Состав семьи НЕ изменён (sleep_score/readiness уже в derived_composites →
                               # non-derived семья уже исключает sleep_score). Причина ре-объявления: добавлены
                               # frozen-параметры confirmatory-движка семьи A. Значения p НЕ подстроены под результат.
                               # v4 (2026-07-23, Группа 2 fdr-online): + ОПИСАТЕЛЬНЫЕ параметры причинного уточнения
                               # A-рычагов (causal_*). Состав семьи НЕ изменён. НЕ error-rate слой (вне бюджета q_A/q_D):
                               # диагностическая пометка рычаг|совпадение|не_знаю. Значения — clarity-cut, НЕ под исход.
provenance: >
  Снимок семьи из кода на 2026-07-12 (DAILY_METRICS / LAB_METRICS / PREDICTORS / TARGETS / lags +
  gate-параметры correlation_gate), с правками по решению владельца: под-индексы readiness → в производные;
  лаги объявлены первым классом (статус — ждёт валидации на harness).
  v2 (2026-07-12): состав тела Fitdays (9 колонок) — В ПРОИЗВОДНЫЕ. Основание: каждая колонка почти
  целиком объясняется весом и импедансом — весы считают всё из них, это НЕ новые сигналы.
  §12.3: пары/лаги/направления НЕ выбираются по данным (перебор фикс. списков) → селекция R1 неактивна.


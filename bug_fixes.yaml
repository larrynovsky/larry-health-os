# Исправленные сбои из отчётов /bug — ЕДИНСТВЕННЫЙ дом связи «отпечаток → исправление».
#
# Читатель: night_cycle._bug_reports_to_repair. Карточка report:<fp> из этого списка
# закрывается ночью (автор `fixed`) и переоткрывается, только если сбой пришёл с версии
# не старше fixed_in. Без реестра карточка не закрывалась никогда: цикл каждую ночь
# перечитывает все отчёты, и park() переоткрывал решённую как рецидив (08.11).
#
# Строку пишет коммит-исправление: отпечаток, коммит и версия выпуска, в который исправление
# войдёт (не знаешь — следующая за последним выпуском). Хеш ставь ПОСЛЕ слияния в main:
# thread_finish переставляет ветку, и хеш из нити в main не существует (08.11: 1d1082a → bab2ca9).
# Логика цикла хеш не читает — он для человека.

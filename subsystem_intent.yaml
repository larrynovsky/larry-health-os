        - "Withings опрашивается дважды в день (09:10 и 21:10): удаление замера в приложении доезжает до базы со следующим прогоном."
        - "Нет подключения Withings у тенанта — путь молчит как «прибора нет»."
        - "Зеркало (удаление отсутствующих в Withings) добавлено 06.10 после подтверждения 05.10; живьём удаление ещё не проходило."
    - id: bp_day_owner_withings
      claim: "У кого Withings подключён (bp_readings непуст), дневное давление daily_metrics.bp_systolic/bp_diastolic — среднее ВСЕХ замеров местного дня (так требует домашний протокол 7-2-2), а пик дня raw bp_*_max (его читает потолок тревоги, решение 26.09) — максимум замеров; пишет только import_withings. Путь «Здоровья» (metrics_db.upsert_metrics_from_json) давление в колонки и raw bp_* не пишет, а кладёт свидетелем в raw.apple_health_bp. С первого дня Withings у дня один хозяин: день без замеров чистится, чужое значение переписывается; дни до первого замера Withings остаются за «Здоровьем». Ночной судья check_bp_day_is_withings пересчитывает средние сам и кричит о дне, где значение разошлось со средним замеров или есть без замеров. Решение владельца 06.10: главный в давлении — Withings."

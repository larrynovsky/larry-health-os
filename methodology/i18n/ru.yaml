common.help.commands: "*Что умеет бот*\n\n*Автоматические отчёты*\nУтренний — ежедневно в {brief_time}, по твоему местному времени.\nЕженедельный разбор — {weekly_days}, {weekly_time}.\nЕжемесячный — {monthly_day}-го числа, {monthly_time}.\nЕженедельный разбор и ежемесячный отчёт — по времени {report_timezone}.\n\n*Начало и помощь*\n/start — начать общение\n/help — эта справка\n/about — пройти знакомство заново (ответы можно поменять)\n\n*Данные и отчёты*\n/report — утренний отчёт сейчас\n/sleep — ночи с данными за последнюю неделю\n/labs — последние ключевые анализы\n/weekly — еженедельный разбор\n/monthly — ежемесячный отчёт\n/memory — что я запомнил\n/genome — значимые варианты генома; можно дописать вопрос\n/genome\\_update — проверить новые сведения о вариантах генома\n\n*Самочувствие и планы*\n/checkin — поговорить о прошедшем дне\n/experiment — что ты пробуешь и как меняются показатели\n/tasks — задачи и вопросы\n/problems — проблемы со здоровьем и предложения об изменениях\n/hypotheses — предположения о причинах и их проверка\n/protocols — действующие планы действий\n/consult — консилиум: твой вопрос разбирают ИИ-специалисты\n/visit — подготовить сводку для врача; можно добавить дату\nПример: /visit 2030-01-15\n/map — как уточнить название анализа\n/cancel — прервать разбор фото, если он идёт\n\nПодтвердить, отклонить, проверить гипотезу, подготовить запрос для врача, закрыть задачу или закончить разговор можно кнопками под сообщениями. Без выбора эти действия не выполняются.\n\nМожно просто писать: задавать вопросы и рассказывать о самочувствии. Важное я запомню."


        present: ["history", "version", "_update_hypothesis_versioned"]
    - id: error_no_mutation
      claim: "При вердикте error ничего не меняется в БД (fail-safe): непонятный ответ не портит состояние гипотезы."
      status: holds
      check:
        file: hypothesis_resolution.py
        present: ["error", "ничего не меняет"]
    - id: boundary_reliability_open
      claim: "Несущая стена держится на классификации поведенческое↔медицинское: мисроут медицинского в само-ведение обошёл бы врача. Точка и надёжность этой классификации в реестре не заземлены — не заверено, что медицинское не утечёт мимо врача."
      # open (4-я колонка): сама граница — критична; её код-якорь и доказательство

cpic.implication.cyp2c9.poor_metabolizer: "⚠️ Значительно сниженный метаболизм варфарина, НПВС, фенитоина. Риск кровотечения при стандартных дозах варфарина — требуется начальная доза ~50%."
cpic.implication.cyp2c9.intermediate_metabolizer: "⚡ Умеренно сниженный CYP2C9. Варфарин: стартовая доза ↓20–30%; НПВС (ибупрофен, целекоксиб): потенциал накопления при высоких дозах."
cpic.implication.cyp2c19.poor_metabolizer: "⚠️ Клопидогрел неэффективен (пролекарство не активируется). ИПП (омепразол) — повышенная экспозиция. Циталопрам/эсциталопрам: ↓ доза."
cpic.implication.cyp2c19.intermediate_metabolizer: "⚡ CYP2C19 частично снижен. Клопидогрел: субоптимальная антиагрегация — рассмотреть тикагрелор. ИПП: стандартная доза обычно ОК."
cpic.implication.cyp2c19.ultrarapid_metabolizer: "⚡ Ускоренный CYP2C19. ИПП могут быть менее эффективны; антидепрессанты (СИОЗС) — риск субтерапевтического уровня."
cpic.implication.cyp2c19.rapid_metabolizer: "ℹ️ CYP2C19 несколько ускорен. Клинически значимо редко, но ИПП и СИОЗС могут требовать более высоких доз."
cpic.implication.cyp2d6.poor_metabolizer: "⚠️ Кодеин/трамадол противопоказаны (нет активации → неэффективность + риск токсичности). Тамоксифен: снижена эффективность. ТЦА, антипсихотики — риск накопления."
cpic.implication.cyp2d6.ultrarapid_metabolizer: "⚠️ Кодеин: риск острой опиоидной токсичности из-за избыточного морфина. СИОЗС и ТЦА — сниженная концентрация, возможна неэффективность."
cpic.implication.cyp2d6.intermediate_metabolizer: "⚡ CYP2D6 частично снижен. Кодеин/трамадол использовать с осторожностью; тамоксифен — рассмотреть альтернативы или мониторинг эндоксифена."
cpic.implication.slco1b1.poor_function: "⚠️ Высокий риск статин-индуцированной миопатии (ОАТП1B1 резко снижен). Симвастатин ≥40 мг/сут противопоказан; предпочтителен розувастатин/правастатин."
cpic.implication.slco1b1.decreased_function: "⚡ Умеренный риск статин-миопатии. Симвастатин: не более 20 мг/сут; CK-мониторинг при старте статинов. Розувастатин — более безопасная альтернатива."
cpic.implication.dpyd.poor_metabolizer: "\U0001F6A8 DPYD*2A гомозиготный — 5-ФУ/капецитабин ПРОТИВОПОКАЗАНЫ (жизнеугрожающая токсичность). Альтернативные режимы ХТ обязательны."
cpic.implication.dpyd.intermediate_metabolizer: "⚠️ Снижен метаболизм 5-ФУ/капецитабина. Стартовая доза ↓ 25–50%; мониторинг токсичности обязателен."
cpic.implication.tpmt.poor_metabolizer: "⚠️ Азатиоприн/6-МП противопоказаны в стандартных дозах → тяжёлая миелосупрессия. При необходимости — доза ↓ 90% + еженедельный CBC."
cpic.implication.tpmt.intermediate_metabolizer: "⚡ Умеренно снижен TPMT. Азатиоприн/6-МП: доза ↓ 30–50%; регулярный мониторинг CBC."
cpic.implication.ugt1a1.poor_metabolizer: "⚠️ Иринотекан: риск тяжёлой нейтропении и диареи (UGT1A1*28/*28). Стартовая доза ↓; рассмотреть липосомальный иринотекан."
cpic.implication.ugt1a1.intermediate_metabolizer: "⚡ UGT1A1 частично снижен. При иринотекане — внимательный мониторинг токсичности."
cpic.implication.hla_b.hla_b_57_01_carrier: "\U0001F6A8 HLA-B*57:01 носитель — АБАКАВИР АБСОЛЮТНО ПРОТИВОПОКАЗАН (высокий риск жизнеугрожающей реакции гиперчувствительности)."

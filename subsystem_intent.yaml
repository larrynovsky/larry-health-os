- id: deterministic_norm_source
  title: "Детерминированный слой нормы: единственный источник, громкий отказ"
  intent: >
    Под умным ИИ-слоем лежит тупой детерминированный предохранитель. Клиническая
    норma — «что для этого показателя тревожно» — берётся ровно из одной таблицы,
    не из литералов, разбросанных по коду, и не из решения модели. А если нужного
    порога в таблице нет, система громко падает, а не подставляет тихую догадку:
    уверенно-неверный порог опаснее пустоты. Этот слой — не дубликат умного, а
    несущая стена под ним, которую нельзя переубедить красноречием модели.
  explanation: docs/explanation/deterministic_norm_source.md
  code_anchors:
    - rules_db.py::get_threshold
    - rules_db.py::get_absolute_thresholds
    - services/recommendations.py::evaluate_domain_need
  invariants:
    - id: single_runtime_source
      claim: "Рантайм-источник клинической нормы — таблица absolute_thresholds (§9), а не литералы в коде и не решение модели. Покрывает алерт-пути (trend_alerts/lifestyle_agents/morning_report) И предохранитель safety_net (loader'ы читают absolute_thresholds variant='safety_net'/_rel + lab_trend_thresholds; резерв _FALLBACK в safety_net — с 2026-09-02 снимок того же документа, что и сид (norm_from_documents), только на случай недоступной БД, с громким алертом)."
      status: holds
      check:
        file: rules_db.py
        present: ["absolute_thresholds", "get_absolute_thresholds"]
    - id: safety_net_thresholds_in_db
      claim: "safety_net читает клинические пороги из БД (absolute_thresholds variant='safety_net'/'safety_net_rel' + lab_trend_thresholds) через loader'ы. Резерв _FALLBACK_* — только на случай недоступного источника (пустой сид / БД offline), с ГРОМКИМ алертом (fail-static, §9: не тихий литерал, а сигнал). Резерв ОБЯЗАН быть равен сиду — держит coherence-тест; с 2026-09-02 и сид, и резерв — снимок документа (CTCAE v5.0 → data/norm_docs/ctcae_lab_v5.0.json; EFLM → eflm_bv.json), прежние литералы выноса E1 2026-07-18 оказались пересказом CTCAE по памяти модели и ушли в архив variant='safety_net_legacy' (см. запись norm_from_documents). Amylase — личный порог владельца (честный source)."
      status: holds
      check:
        file: safety_net.py
        present: ["_load_lab_thresholds", "_FALLBACK_LAB", "_emit_fallback_alert"]
      warm_guard:
        absent: ["safety_net держит пороги литералами", "пороги захардкожены в safety_net"]
        absent_en: ["safety_net keeps thresholds as literals", "thresholds are hardcoded in safety_net"]
    - id: fail_loud_not_literal
      claim: "Отсутствующий ПОРОГ — это громкий отказ (raise), а не тихая подстановка литерала: seed-контур сломан → чинить, а не угадывать. Отсутствие РЕФЕРЕНСА бланка у кратного порога (kind='relative', baseline ULN|LLN) — другой объект: порог есть, судить нечем; это не raise всего предохранителя из-за одного бланка, а алерт norm_unresolved по этому аналиту — тоже громко, не догадка (norm_from_documents::decision_threshold_composes_with_bank_reference)."
      status: holds
      check:
        file: rules_db.py
        present: ["raise KeyError", "_seed_absolute_thresholds"]
    - id: fires_regardless_of_signals
      claim: "Абсолютный пол/потолок проверяется в evaluate_domain_need после сигнального цикла — безусловно, даже когда перцентильных сигналов нет (пустой signals_def); заверено поведенческим тестом (BUG-FLOORS-ORDER). ГРАНИЦА (26.09): значение порог берёт из get_metric_percentiles, а тот пропускает метрику с историей < 14 дней из 90 — для редкой колоночной метрики порог молчит. Ключ дня без колонки (пик давления bp_*_max) читается прямо из вчерашнего дня (_raw_only_yesterday; тест test_bp_peak_ceiling_fires_without_percentile_history); колоночные sleep_total/sleep_awake оставлены на своём читателе lifestyle_agents."
      # Сверено 2026-07-11: early-return на пустом signals_def убран (Q-2 fix
      # 2026-05-22). Заверитель — ПОВЕДЕНЧЕСКИЙ тест test_recommendations_floors.py
      # (позитивный контроль: возврат early-return → красный, проверено). Intent-check
      # ниже стережёт лишь НАЛИЧИЕ заверителя; правоту доказывает ночной pytest.
      # warm_guard оставлен инертным — перевзводится, если статус откатится в open.
      status: holds
      check:
        file: tests/unit/test_recommendations_floors.py
        present: ["test_floor_fires_with_empty_signals_def", "BUG-FLOORS-ORDER", "signals=[]"]
      warm_guard:
        absent: ["срабатывает при любом состоянии", "гарантированно покрывает все домены", "always fires"]
        absent_en: ["fires in any state", "guaranteed to cover all domains", "always fires"]
      bug_ids: ["BUG-FLOORS-ORDER"]  # live-дома (BLUEPRINT/BACKLOG) стережёт test_intent_doc_home_refs
  sentinel: tests/consistency/test_intent_validation_gate.py
  last_reconciled: "2026-07-11"



- id: norm_from_documents
  title: "Норма выводится из документа, не набирается: снимок → строки → предохранитель"
  intent: >
    Число клинической нормы не вводится без документа или без имени назначившего: оно
    следствие именованного документа с версией и датой (NCI CTCAE как порог решения,
    EFLM BV как биологическая вариация для RCV, гайдлайны наблюдения как каданс), снятого в
    репозиторий с checksum и разобранного импортёром по карте термов-данных, — либо личный
    порог владельца, либо назначение врача с id консультации. Между документом и базой нет
    пересказа: пересказ и был тем шагом, где терялась точность (апрель 2026: PLT 100 вместо
    75, ALT «7x» вместо 5x, онкомаркеры с порогами, которых нет ни в одном документе).
    Порог решения композируется с референсом бланка лаборатории (CTCAE выражен кратными
    ULN/LLN), а не заменяет его; аналит без документа судится самим бланком. Обновление —
    pull по сроку: датчик замечает смену удалённого состояния документа и краснеет, норму
    машина не переписывает. Единственный человек в контуре — врач, читающий бриф.
  explanation: docs/explanation/norm_from_documents.md
  code_anchors:
    - norm_documents.py::import_ctcae
    - norm_documents.py::rcv_pct
    - health_db.py::_seed_safety_lab_thresholds
    - safety_net.py::_resolve_thresholds
  invariants:
    - id: threshold_derived_from_document
      claim: "Каждая активная лабораторная строка absolute_thresholds variant='safety_net' несёт source = id документа из norm_documents, либо личный источник (*_owner_personal_*), либо назначение врача (clinician:<consultation_id>). Набранных клинических чисел нет; прежние — в архиве variant='safety_net_legacy', active=0. Оракул — ночной integrity_tests.check_threshold_source_is_document (красное у обоих тенантов); граница: датчик судит имя источника, что документ говорит именно это число — держит coherence снимка."
      status: holds
      check:
        file: integrity_tests.py
        present: ["check_threshold_source_is_document", "_threshold_source_scan", "clinician:"]
    - id: snapshot_equals_import_equals_db
      claim: "Снимок документа в репо ≡ импорт(документ) ≡ строки БД ≡ резерв _FALLBACK_LAB — четыре копии одного, под coherence-тестами; дрейф любой копии — красное."
      status: holds
      check:
        file: tests/unit/test_safety_net_thresholds.py
        present: ["test_snapshot_equals_import_of_document", "test_fallback_lab_equals_seed"]
    - id: decision_threshold_composes_with_bank_reference
      claim: "Кратный порог (kind='relative', baseline ULN|LLN) разрешается референсом ТОЙ строки бланка, которую судят; без него — модальный интервал по ≥norm.witness_min_docs документам; без него — алерт norm_unresolved, не догадка и не молчание."
      status: holds
      check:
        file: safety_net.py
        present: ["_resolve_thresholds", "norm_unresolved", "get_modal_reference"]
    - id: document_freshness_is_pulled
      claim: "Каждый документ реестра norm_documents имеет next_check; по нему датчик спрашивает удалённое состояние (sha256 тела / updated_at EFLM) и краснеет на изменении с обоими состояниями; сеть недоступна → WARN, не тишина."
      status: holds
      check:
        file: integrity_tests.py
        present: ["check_norm_documents_fresh", "remote_state"]
    - id: no_number_from_single_study
      claim: "Параметры биологической вариации берутся из мета-оценок EFLM (BIVAC-совместимые исследования, медиана), не из одного исследования: Erden 2008 дал CV_I 27–31 % против медианы 4–7 %, и вывод на нём продержался полдня."
      status: holds
      check:
        file: norm_documents.py
        present: ["cvi_median", "fetch_eflm"]
    - id: interpretation_rule_is_document
      claim: "Правило ТОЛКОВАНИЯ (не число) — тоже документ: schedules.json::rules несёт id правила, doc (id из norm_documents) и цитату гайдлайна; код читает правило оттуда (norm_documents.confirmation_metrics — рост онкомаркера считается сигналом только после подтверждения следующим забором, EGTM 2014), а не зашивает список аналитов. Тихий отказ, от которого это: правило в коде литералом переживает смену гайдлайна и продолжает судить по старому. Записано по слову владельца 27.09 (BL-BOTDEC-1)."
      status: holds
      check:
        file: norm_documents.py
        present: ["confirm_rise_before_action", "cfg.get(\"rules\""]
    - id: norm_verdict_single_home
      claim: "Вердикт человека о норме аналита («нормы нет» / «отложено до даты») живёт в одном доме — таблице analyte_norm_verdicts (писатель labs_db.set_analyte_norm_verdict, читатель labs_db.analyte_norm_verdicts, только живые по review_at); датчик покрытия норм берёт исключения оттуда. Второй дом (список в коде или конфиге) разошёлся бы с первым молча, и датчик молчал бы о забытом аналите. Записано по слову владельца 27.09 (BL-BOTDEC-1)."
      status: holds
      check:
        file: labs_db.py
        present: ["def set_analyte_norm_verdict", "FROM analyte_norm_verdicts WHERE review_at"]
- id: lab_recognizer
  title: "Распознаватель анализов: staging, оракулы, человек-гейт"
  intent: >
    Анализы приходят бумагой и фото, часто на другом языке, а модель, читающая скан
    напрямую, роняет десятичную точку — 15.2 становится 152, и с медицинскими числами
    это не косметика. Поэтому не «распознай», а конвейер с проверкой: два зрения читают
    страницу постранично и сверяются между собой, независимые оракулы правдоподобия
    ловят вылеты за физиологию, результат идёт в staging (канон не трогается) и ждёт
    твоего «да» — и только атомарный промоут с предснимком кладёт его в канон.
  explanation: docs/explanation/lab_recognizer.md
  code_anchors:
    - lab_recognizer.py::recognize
    - lab_oracles.py::verify
    - lab_promote.py::plan
  invariants:
    - id: two_model_reconciled
      claim: "Скан/фото читают два независимых зрения разными промптами постранично и сверяются между собой (agreement/confidence), а не одна модель на веру."
      # 2026-07-30: заверитель заменён с грепа по исходнику на ПОВЕДЕНЧЕСКИЙ тест. Замер У-1
      # показал: обещание не было защищено ничем — `p2 = p1` (второе зрение = копия первого)
      # не ронял ни одного теста, а слова `_vision_call`/`_reconcile`/`confidence` оставались
      # на месте, поэтому прежний check зеленел. Негативный контроль ИСПОЛНЕН
      # (plans/verify_hollow_promises_2026-07-30.py, M-06/M-07/M-08, staging, 2026-07-30):
      # копия первого прохода · тот же промпт · та же модель — краснеют все три.
      # check стережёт НАЛИЧИЕ заверителя; правоту доказывает прогон набора.
      # Граница: доказано, что зрений два и они различны промптом и моделью. НЕ доказано,
      # что суждения независимы — две модели одного семейства могут ошибаться одинаково.
      status: holds
      verified_at: "2026-07-30"
      verified_on: "staging"
      check:
        file: tests/unit/test_two_visions_independent.py
        present: ["test_each_page_is_read_by_two_visions",
                  "test_two_visions_differ_in_prompt_and_model",
                  "test_reconcile_sees_the_disagreement_between_visions"]
    - id: oracles_flag_implausible
      claim: "Независимые оракулы правдоподобия помечают вылеты за физиологию (диапазон, скачок величины, единицы) до канона; итог документа — green|flagged."

- id: log_rotation
  title: "Ротация логов: файл подрезается, а писатель не осиротеет"
  intent: >
    Логи растут молча. К 2026-09-01 их накопилось ~470 МБ с мая на двух машинах, и
    consilium_eval.log — тот, ради которого ротацию и заводили, — не значился в списке
    вовсе. Дальше начинается неочевидное: подрезать лог переименованием НЕЛЬЗЯ. И launchd
    (редирект StandardOutPath), и logging.FileHandler держат ОТКРЫТЫЙ дескриптор —
    переименуй файл, и писатель продолжит писать в переименованный inode, а живой лог
    замолкнет навсегда, ничем это не обнаружив. Поэтому: содержимое копируется в архив,
    файл обрезается НА МЕСТЕ, inode сохраняется. Штатный newsyslog умеет то же, но требует
    root; решение владельца 2026-09-01 — «поставь без меня», отсюда агент пользователя.
    Список логов и пороги живут в ОДНОМ доме (launchd/health-logs.newsyslog.conf), который
    читают оба механизма. Тихих отказов здесь три, и все три закрыты датчиками: лог растёт
    вне списка; агент умер; агент жив, но его самопроверка не прошла.
  explanation: docs/explanation/log_rotation.md
  code_anchors:
    - log_rotate.py::rotate_all
    - log_rotate.py::unlisted_logs
    - log_rotate.py::receipt_status
    - integrity_tests.py::check_logrotate_liveness
    - hae_checker.py::compress_raw_archive
    - integrity_tests.py::check_hae_raw_archive_compressed
  invariants:
    - id: copytruncate_keeps_inode
      claim: "Ротация НЕ переименовывает файл: gzip-копия плюс обрезка на месте, inode сохраняется. Иначе живой писатель с открытым дескриптором уходит в переименованный inode и лог замолкает навсегда — тихо. Каждый результат несёт inode_kept."
      status: holds
      check:
        file: log_rotate.py
        present: ["fh.truncate(0)", "inode_kept"]
        absent: ["path.rename("]
    - id: one_home_of_the_list
      claim: "Список логов, пороги и keep живут в launchd/health-logs.newsyslog.conf и только там; и свой ротатор, и штатный newsyslog читают его. Второй список разошёлся бы с первым молча."
      status: holds
      check:
        file: log_rotate.py
        present: ["health-logs.newsyslog.conf", "_parse_conf"]
    - id: dead_config_screams
      claim: "Пустой или неразобранный конфиг бросает ValueError, а не возвращает пустой список: пустота неотличима от «всё чисто», и тогда молчали бы одинаково убедительно и ротация, и датчик слепого пятна."
      status: holds
      check:
        file: log_rotate.py
        present: ["пуст или не разобран"]
    - id: silence_is_watched
      claim: "Три тихих отказа под датчиками: лог вне конфига (check_logs_all_listed, WARN от 1 МБ, FAIL при переросшем пороге ротации); смерть агента и провал его самопроверки (check_logrotate_liveness — свежесть квитанции logs/logrotate.log плюс хвост selftest ok). FAIL, а не WARN, выбран по адресату: падения integrity_latest.json читает night_cycle и доводит до владельца. ГРАНИЦА: датчик живости читает ЛОКАЛЬНУЮ квитанцию, поэтому агент на MacBook покрыт своим прогоном integrity, а не этим."
      status: holds
      check:
        file: integrity_tests.py
        present: ["check_logrotate_liveness", "check_logs_all_listed"]
    - id: raw_archive_compressed_not_deleted
      claim: "Ротатор же сжимает сырой архив прибора (data/hae_rest каждого тенанта): выгрузки старше 14 дней — в .json.gz на месте, оригинал удаляется только после того, как копия прочитана тем же загрузчиком (решение владельца 26.09). Сжатие, а не удаление: от ГЛУБИНЫ архива зависит правило «пустая колонка = прибора нет» (device_metrics_owner.empty_column_means_no_device). Поломку шага при живом агенте ловит датчик по файлам на диске — check_hae_raw_archive_compressed, FAIL на несжатой выгрузке старше 15 дней (негативный контроль — мутация M3 plans/mutate_hae_owner_2026-09-26.sh, покраснела 26.09)."
      status: holds
      check:
        file: log_rotate.py
        present: ["hae_checker.compress_raw_archive(_rest)"]
  last_reconciled: "2026-09-26"

- id: device_metrics_owner
  title: "У каждой метрики прибора есть хозяин"
  intent: >
    Прибор (Health Auto Export → REST /hae/ingest) присылает десятки метрик, и поломка
    здесь не видна снаружи: бот и сводки работают, просто без части данных.
    Независимо придуманный пример: прибор шлёт условное поле example_level, разборщик
    ждёт example_value, а реестр ошибочно считает метрику обработанной. Другой сценарий:
    после смены пути приёма реестр продолжает сканировать опустевший каталог.
    Это примеры механизма потери, не история чьих-либо измерений.
    Решения владельца 26.09: у каждой пришедшей
    метрики либо ветка разборщика, которая доходит до хранения, либо записанное решение
    «не берём:»; утверждение «покрыто: <колонка>» проверяется данными, а не верится на
    слово; живость судьи сторожится отдельно; пустая колонка семейства сигналов значит
    «прибора нет» только если её источник не приходил за всю глубину сырого архива —
    иначе это потеря.
  explanation: docs/explanation/device_metrics_owner.md
  code_anchors:
    - hae_checker.py::judge_payload
    - hae_checker.py::_produced_keys
    - import_apple_health.py::aggregate_metric_by_day
    - metrics_db.py::upsert_metrics_from_json
    - dashboard_routers/api_hae_ingest.py::hae_ingest
    - integrity_tests.py::check_hae_arrivals_have_owner
    - integrity_tests.py::_hae_device_absent
  invariants:
    - id: every_arrival_has_owner
      claim: "Судья на приёме (api_hae_ingest → hae_checker.judge_payload) выносит вердикт по ПОВЕДЕНИЮ разборщика, не по пометке реестра: ключи, которые реальный aggregate_metric_by_day выдаёт и которые доходят до хранения (APPLE_RAW_KEYS | APPLE_BIO_INPUTS), — handled; решение «не берём:» — tracked; разобрано, но не хранится, — unowned; незнакомое — new. Крик держит ночной датчик check_hae_arrivals_have_owner по СОСТОЯНИЮ реестра, а не по событию прихода (негативный контроль M1, покраснела 26.09)."
      status: holds
      check:
